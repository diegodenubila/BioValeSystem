function saveNovaCF(){
  var n=document.getElementById('cf-n').value.trim();
  var tipo=document.getElementById('cf-tipo').value;
  var v=parseFloat(document.getElementById('cf-v')?document.getElementById('cf-v').value:0)||0;
  var venc=parseInt(document.getElementById('cf-venc').value)||1;
  var ic=document.getElementById('cf-ic').value||'&#128197;';
  if(!n){alert('Informe o nome da conta!');return;}
  if(tipo==='fixa'&&!v){alert('Informe o valor fixo!');return;}
  if(venc<1||venc>31){alert('Dia de vencimento invalido!');return;}
  if(tipo==='parcelada'){
    if(!v){alert('Informe o valor de cada parcela!');return;}
    var np=parseInt(document.getElementById('cf-parc').value)||0;
    if(np<2){alert('Informe o numero de parcelas (minimo 2)!');return;}
    var mesInicio=document.getElementById('cf-mes-inicio').value.trim();
    if(!mesInicio||!/^\d{2}\/\d{4}$/.test(mesInicio)){alert('Informe o mes de inicio no formato MM/AAAA!');return;}
    // Gera historico com todas as parcelas como pendentes
    var hist=[];
    var parts=mesInicio.split('/');
    var m=parseInt(parts[0])-1,y=parseInt(parts[1]);
    for(var i=0;i<np;i++){
      var mm=String(m+1).padStart(2,'0')+'/'+y;
      hist.push({mes:mm,valor:v,pago:false,dataPag:null,parcela:(i+1),totalParcelas:np});
      m++;if(m>11){m=0;y++;}
    }
    DB.contasFixas.push({id:nid(),nome:n,ic:ic,tipo:'parcelada',valor:v,venc:venc,status:'Pendente',totalParcelas:np,mesInicio:mesInicio,historico:hist});
  } else {
    DB.contasFixas.push({id:nid(),nome:n,ic:ic,tipo:tipo,valor:tipo==='fixa'?v:0,venc:venc,status:'Pendente',historico:[]});
  }
  closeM();saveDB();
  document.getElementById('fin-content').innerHTML=_finRender('fixas');
}

function mEditCF(id){

function mLancarCF(id){

function saveLancarCF(id,pagar){
  var c=null;for(var i=0;i<DB.contasFixas.length;i++){if(DB.contasFixas[i].id===id){c=DB.contasFixas[i];break;}}
  if(!c)return;
  var v=parseFloat(document.getElementById('cf-lv').value)||0;
  var conta=document.getElementById('cf-lc').value;
  if(!v){alert('Informe o valor!');return;}
  var ma=_mesAtual();
  if(!c.historico)c.historico=[];
  // Remove existing record for this month if any
  c.historico=c.historico.filter(function(h){return h.mes!==ma;});
  c.historico.unshift({mes:ma,valor:v,pago:pagar,dataPag:pagar?hj():null,conta:pagar?conta:null});
  if(pagar){
    DB.movs.unshift({id:nid(),data:hj(),desc:'Pagamento: '+c.nome+' ('+ma+')',tipo:'saida',cat:'Fixo',valor:v,conta:conta});
    for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome===conta){DB.contas[i].saldo=+(DB.contas[i].saldo-v).toFixed(2);break;}}
  }
  closeM();saveDB();
  document.getElementById('fin-content').innerHTML=_finRender('fixas');
}

  var c=null;for(var i=0;i<DB.contasFixas.length;i++){if(DB.contasFixas[i].id===id){c=DB.contasFixas[i];break;}}

  var found=false;
  for(var i=0;i<c.historico.length;i++){if(c.historico[i].mes===ma){c.historico[i].pago=true;c.historico[i].dataPag=hj();c.historico[i].conta=conta;found=true;break;}}

  DB.movs.unshift({id:nid(),data:hj(),desc:'Pagamento: '+c.nome+' ('+ma+')',tipo:'saida',cat:'Fixo',valor:v,conta:conta});
  for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome===conta){DB.contas[i].saldo=+(DB.contas[i].saldo-v).toFixed(2);break;}}

function mDesfazerPagCF(id,mes){
  var c=null;for(var i=0;i<DB.contasFixas.length;i++){if(DB.contasFixas[i].id===id){c=DB.contasFixas[i];break;}}
  if(!c)return;
  var h=null;for(var i=0;i<(c.historico||[]).length;i++){if(c.historico[i].mes===mes){h=c.historico[i];break;}}
  if(!h||!h.pago)return;
  confirmar('Desfazer pagamento de <b>'+c.nome+'</b> referente a <b>'+mes+'</b>?<br><span style="font-size:12px;color:var(--mt)">O valor de '+fR(h.valor)+' sera estornado e o lancamento removido.</span>',function(){
    var contaAlvo=h.conta||'Caixa';
    for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome===contaAlvo){DB.contas[i].saldo=+(DB.contas[i].saldo+h.valor).toFixed(2);break;}}
    var desc='Pagamento: '+c.nome+' ('+mes+')';
    for(var i=0;i<DB.movs.length;i++){if(DB.movs[i].desc===desc&&DB.movs[i].tipo==='saida'){DB.movs.splice(i,1);break;}}
    h.pago=false;h.dataPag=null;
    closeM();saveDB();
    document.getElementById('fin-content').innerHTML=_finRender('fixas');
  });
}

function delCat(id,tipo){
  var arr=tipo==='entrada'?DB.cats.entrada:DB.cats.saida;
  var nome='';for(var i=0;i<arr.length;i++){if(arr[i].id===id){nome=arr[i].nome;break;}}
  confirmar('Excluir a categoria <b>'+nome+'</b>?',function(){
    var arr2=tipo==='entrada'?DB.cats.entrada:DB.cats.saida;
    for(var i=0;i<arr2.length;i++){if(arr2[i].id===id){arr2.splice(i,1);break;}}
    closeM();
    document.getElementById('fin-content').innerHTML=_finRender('categorias');
  });
}

function mMov(tipo){
  var cO='';for(var i=0;i<DB.contas.length;i++)cO+='<option>'+DB.contas[i].nome+'</option>';
  var catsArr=tipo==='entrada'?DB.cats.entrada:DB.cats.saida;
  var catsH=_buildCatBtns(catsArr,'mv');
  openM(tipo==='entrada'?'&#8593; Entrada de Dinheiro':'&#8595; Saida de Dinheiro',
    '<div class="mf">'
    +'<div class="fld"><label>Descricao</label><input class="inp" id="m-d" placeholder="Descreva..."></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'
    +'<div class="fld"><label>Valor R$</label><input class="inp" type="number" inputmode="decimal" id="m-v" placeholder="0.00"></div>'
    +'<div class="fld"><label>Conta</label><select class="inp" id="m-c">'+cO+'</select></div>'
    +'</div>'
    +'<div class="fld"><label>Data</label><input class="inp" type="date" id="m-dt"></div>'
    +'<div><div style="font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px">Categoria</div>'
    +catsH+'</div>'
    +'<div class="brow">'
    +'<button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn'+(tipo==='saida'?' btn-rd':'')+'" onclick="saveMov(\&apos;'+tipo+'\&apos;)">Registrar</button>'
    +'</div></div>');
  setTimeout(function(){var d=document.getElementById('m-dt');if(d){var n=new Date();d.value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}},50);
}
function saveMov(tipo){
  var d=document.getElementById('m-d').value.trim();
  var v=parseFloat(document.getElementById('m-v').value)||0;
  var c=document.getElementById('m-c').value;
  var cat=_getCatVal('mv');
  if(!d||!v){alert('Preencha todos os campos!');return;}
  if(!cat){alert('Selecione uma categoria!');return;}
  DB.movs.unshift({id:nid(),data:hj(),desc:d,tipo:tipo,cat:cat,valor:v,conta:c});
  for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome===c){DB.contas[i].saldo=+(tipo==='entrada'?DB.contas[i].saldo+v:DB.contas[i].saldo-v).toFixed(2);break;}}
  closeM();go('financeiro');
}


var agVw='semana';
var agMesRef=null; // {year,month} para visao mensal
var agSemRef=null; // {year,month,day} início da semana

// ── STATUS helpers ──────────────────────────────────────────
// Novo fluxo: Agendada → Confirmada → Em Rota → Coletada | Pendente | Cancelada
function stCorCol(s){
  if(s==='Confirmada')return 'var(--gr)';
  if(s==='Agendada')return 'var(--bl)';
  if(s==='Em Rota')return 'var(--pu)';
  if(s==='Coletada')return '#10b981';
  if(s==='Pendente')return 'var(--or)';
  if(s==='Cancelada')return 'var(--rd)';
  return 'var(--mt)';
}
function stIcCol(s){
  if(s==='Confirmada')return '✅';
  if(s==='Agendada')return '📅';
  if(s==='Em Rota')return '🚛';
  if(s==='Coletada')return '✔️';
  if(s==='Pendente')return '⏳';
  if(s==='Cancelada')return '❌';
  return '●';
}
function stBadge(s){
  var cor=stCorCol(s);
  return '<span style="background:'+cor+'20;color:'+cor+';border:1px solid '+cor+'40;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap">'+stIcCol(s)+' '+s+'</span>';
}
// Botões de ação por status — avança no fluxo
function stAcoes(col){
  var id=col.id;var s=col.status;var btns='';
  if(CU.perfil==='motorista'){
    if(s==='Confirmada')btns+='<button class="bsm" style="background:#a855f720;color:#a855f7;border:1px solid #a855f740" onclick="updCol('+id+',\'Em Rota\')">🚛 Iniciar Rota</button>';
    if(s==='Em Rota')btns+='<button class="bsm bsmg" onclick="updCol('+id+',\'Coletada\')">✔️ Marcar Coletada</button>';
    if(s==='Em Rota')btns+='<button class="bsm" style="background:var(--orb);color:var(--or);border:1px solid rgba(245,158,11,.3)" onclick="updCol('+id+',\'Pendente\')">⏳ Pendente</button>';
    return btns?'<div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--bd);display:flex;gap:5px;flex-wrap:wrap">'+btns+'</div>':'';
  }
  // admin/operador
  if(s==='Agendada')btns+='<button class="bsm bsmg" onclick="updCol('+id+',\'Confirmada\')">✅ Confirmar</button>';
  if(s==='Confirmada')btns+='<button class="bsm" style="background:#a855f720;color:#a855f7;border:1px solid #a855f740" onclick="updCol('+id+',\'Em Rota\')">🚛 Em Rota</button>';
  if(s==='Em Rota')btns+='<button class="bsm bsmg" onclick="updCol('+id+',\'Coletada\')">✔️ Coletada</button>';
  if(s!=='Cancelada'&&s!=='Coletada')btns+='<button class="bsm" style="background:var(--orb);color:var(--or);border:1px solid rgba(245,158,11,.3)" onclick="updCol('+id+',\'Pendente\')">⏳ Pendente</button>';
  btns+='<button style="background:var(--blb);color:var(--bl);border:1px solid rgba(59,130,246,.3);border-radius:6px;padding:4px 10px;font-size:11px" onclick="notifC('+id+')">📲 Notificar</button>';
  btns+='<button style="background:var(--orb);color:var(--or);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:4px 10px;font-size:11px" onclick="mEditCol('+id+')">✏️ Editar</button>';
  if(s!=='Cancelada')btns+='<button class="bsm bsmr" onclick="updCol('+id+',\'Cancelada\')">❌ Cancelar</button>';
  btns+='<button onclick="mMDFe('+id+')" style="background:#7c3aed18;color:#7c3aed;border:1px solid rgba(124,58,237,.3);padding:4px 10px;border-radius:6px;font-size:11px">MDF-e</button>';
  return '<div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--bd);display:flex;gap:5px;flex-wrap:wrap">'+btns+'</div>';
}

// ── date helpers ───────────────────────────────────────────
function _today(){return new Date();}
function _fmtDataBR(d){return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();}
function _parseDataBR(s){var p=s.split('/');return new Date(+p[2],+p[1]-1,+p[0]);}
function _isoDateBR(s){var p=s.split('/');return p[2]+'-'+p[1]+'-'+p[0];}
function _startOfWeek(d){var dt=new Date(d);dt.setDate(dt.getDate()-dt.getDay());return dt;}
function _addDays(d,n){var dt=new Date(d);dt.setDate(dt.getDate()+n);return dt;}
function _sameDay(a,b){return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();}
var _meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var _diasCurtos=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function pgAgenda(){
  // refs de navegação
  var hoje=_today();
  if(!agMesRef)agMesRef={year:hoje.getFullYear(),month:hoje.getMonth()};
  if(!agSemRef)agSemRef=_startOfWeek(hoje);

  // contadores topo
  var hjStr=_fmtDataBR(hoje);
  var conf=0,ag=0,rota=0,col=0,tot=0;
  for(var i=0;i<DB.coletas.length;i++){
    var c=DB.coletas[i];tot+=c.peso;
    if(c.status==='Confirmada')conf++;
    else if(c.status==='Agendada')ag++;
    else if(c.status==='Em Rota')rota++;
    else if(c.status==='Coletada')col++;
  }

  // ── VISÃO LISTA (todos os dias) ─────────────────────
  function buildLista(){
    // agrupa por data e ordena
    var grupos={};
    for(var i=0;i<DB.coletas.length;i++){
      var c=DB.coletas[i];
      if(!grupos[c.data])grupos[c.data]=[];
      grupos[c.data].push(c);
    }
    var datas=Object.keys(grupos).sort(function(a,b){return _parseDataBR(a)-_parseDataBR(b);});
    if(!datas.length)return '<div style="text-align:center;padding:32px;color:var(--mt)">Nenhuma coleta agendada</div>';
    var html='';
    for(var d=0;d<datas.length;d++){
      var dt=_parseDataBR(datas[d]);
      var isHj=_sameDay(dt,hoje);
      var diasSemana=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      var labelDia=(isHj?'🟢 HOJE — ':'')+diasSemana[dt.getDay()]+', '+datas[d];
      html+='<div style="display:flex;align-items:center;gap:8px;margin:14px 0 8px"><div style="height:1px;flex:1;background:var(--bd)"></div><span style="font-size:10px;color:'+(isHj?'var(--gr)':'var(--mt)')+';font-weight:700;text-transform:uppercase;letter-spacing:2px;white-space:nowrap">'+labelDia+'</span><div style="height:1px;flex:1;background:var(--bd)"></div></div>';
      var lista_dia=grupos[datas[d]].sort(function(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');});
      for(var i=0;i<lista_dia.length;i++){
        html+=_cardColeta(lista_dia[i]);
      }
    }
    return html;
  }

  // ── CARD coleta ─────────────────────────────────────
  function _cardColeta(col){
    var cor=stCorCol(col.status);
    return '<div class="card" style="margin-bottom:9px;border-left:3px solid '+cor+';border-color:'+cor+'30">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:9px">'+
      '<div style="display:flex;gap:11px">'+
      '<div style="background:var(--s2);border-radius:7px;padding:7px 9px;text-align:center;min-width:46px;flex-shrink:0">'+
      '<div style="font-size:14px;font-weight:800;color:var(--gr);font-family:monospace">'+(col.hora?col.hora.split(':')[0]:'--')+'</div>'+
      '<div style="font-size:10px;color:var(--mt)">:'+(col.hora?col.hora.split(':')[1]:'00')+'h</div></div>'+
      '<div><div style="font-size:13px;font-weight:700">'+col.cli+'</div>'+
      '<div style="font-size:11px;color:var(--mt);margin-top:2px">'+col.end+'</div>'+
      '<div style="font-size:11px;color:var(--mt)">'+col.mat+' · ~'+col.peso+'kg</div>'+
      (col.obs?'<div style="font-size:11px;color:var(--or);margin-top:2px">⚠️ '+col.obs+'</div>':'')+'</div></div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">'+
      stBadge(col.status)+
      '<div style="font-size:11px;color:var(--mt)">🚛 '+col.mot+'</div>'+
      '<div style="font-size:11px;color:var(--bl)">📞 '+col.tel+'</div></div></div>'+
      stAcoes(col)+'</div>';
  }

  // ── VISÃO SEMANAL ───────────────────────────────────
  function buildSemana(){
    var semInicio=agSemRef;
    var semFim=_addDays(semInicio,6);
    var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
    html+='<button onclick="agNavSem(-1)" style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;color:var(--tx);font-size:13px">‹ Ant</button>';
    html+='<span style="font-size:13px;font-weight:700">'+_fmtDataBR(semInicio)+' – '+_fmtDataBR(semFim)+'</span>';
    html+='<button onclick="agNavSem(1)" style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;color:var(--tx);font-size:13px">Próx ›</button>';
    html+='</div>';
    // grade de 7 dias
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px">';
    for(var d=0;d<7;d++){
      var dia=_addDays(semInicio,d);
      var dStr=_fmtDataBR(dia);
      var isHj=_sameDay(dia,hoje);
      var colDia=DB.coletas.filter(function(c){return c.data===dStr;});
      html+='<div style="background:var(--s2);border:1px solid '+(isHj?'var(--gr)':'var(--bd)')+';border-radius:10px;padding:8px 6px;min-height:90px">'+
        '<div style="font-size:10px;color:var(--mt);text-align:center">'+_diasCurtos[dia.getDay()]+'</div>'+
        '<div style="font-size:18px;font-weight:800;text-align:center;color:'+(isHj?'var(--gr)':'var(--tx)')+'">'+dia.getDate()+'</div>'+
        '<div style="margin-top:4px">';
      var sorted=colDia.sort(function(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');});
      for(var i=0;i<sorted.length;i++){
        var c=sorted[i];var cor=stCorCol(c.status);
        html+='<div onclick="agFiltrarDia(\''+dStr+'\')" style="cursor:pointer;background:'+cor+'18;border-left:2px solid '+cor+';border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:10px;font-weight:600;color:'+cor+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+c.cli+' '+c.hora+'">'+
          (c.hora?c.hora+' ':'')+(c.cli.length>10?c.cli.substring(0,10)+'…':c.cli)+'</div>';
      }
      if(!colDia.length)html+='<div style="font-size:10px;color:var(--ft);text-align:center;margin-top:6px">—</div>';
      html+='</div></div>';
    }
    html+='</div>';
    // lista detalhada da semana
    var temColeta=false;
    for(var d=0;d<7;d++){
      var dia=_addDays(semInicio,d);var dStr=_fmtDataBR(dia);
      var colDia=DB.coletas.filter(function(c){return c.data===dStr;}).sort(function(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');});
      if(!colDia.length)continue;
      temColeta=true;
      var isHj=_sameDay(dia,hoje);
      var diasSemana=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      html+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0 7px"><div style="height:1px;flex:1;background:var(--bd)"></div><span style="font-size:10px;color:'+(isHj?'var(--gr)':'var(--mt)')+';font-weight:700;text-transform:uppercase;letter-spacing:2px;white-space:nowrap">'+(isHj?'🟢 HOJE — ':'')+diasSemana[dia.getDay()]+' '+dia.getDate()+'</span><div style="height:1px;flex:1;background:var(--bd)"></div></div>';
      for(var i=0;i<colDia.length;i++)html+=_cardColeta(colDia[i]);
    }
    if(!temColeta)html+='<div style="text-align:center;padding:24px;color:var(--mt);font-size:13px">Nenhuma coleta nesta semana</div>';
    return html;
  }

  // ── VISÃO MENSAL ────────────────────────────────────
  function buildMes(){
    var ano=agMesRef.year;var mes=agMesRef.month;
    var primDia=new Date(ano,mes,1);var ultDia=new Date(ano,mes+1,0);
    var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
    html+='<button onclick="agNavMes(-1)" style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;color:var(--tx);font-size:13px">‹ Ant</button>';
    html+='<span style="font-size:14px;font-weight:800">'+_meses[mes]+' '+ano+'</span>';
    html+='<button onclick="agNavMes(1)" style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;color:var(--tx);font-size:13px">Próx ›</button>';
    html+='</div>';
    // cabeçalho dias semana
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">';
    for(var d=0;d<7;d++)html+='<div style="text-align:center;font-size:10px;color:var(--mt);font-weight:700;padding:3px">'+_diasCurtos[d]+'</div>';
    html+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
    // células vazias do início
    for(var v=0;v<primDia.getDay();v++)html+='<div></div>';
    for(var d=1;d<=ultDia.getDate();d++){
      var dia=new Date(ano,mes,d);
      var dStr=_fmtDataBR(dia);
      var isHj=_sameDay(dia,hoje);
      var colDia=DB.coletas.filter(function(c){return c.data===dStr;});
      var temEventos=colDia.length>0;
      html+='<div onclick="'+(temEventos?'agFiltrarDia(\''+dStr+'\')':'')+'" style="cursor:'+(temEventos?'pointer':'default')+';background:'+(isHj?'var(--grb)':temEventos?'var(--s2)':'transparent')+';border:1px solid '+(isHj?'var(--gr)':temEventos?'var(--bd)':'transparent')+';border-radius:8px;padding:5px 4px;min-height:60px;transition:all .15s" '+(temEventos?'title="'+colDia.length+' coleta(s)"':'')+'>'+
        '<div style="font-size:12px;font-weight:'+(isHj?800:600)+';color:'+(isHj?'var(--gr)':temEventos?'var(--tx)':'var(--ft)')+';text-align:center">'+d+'</div>';
      var maxPills=Math.min(colDia.length,3);
      for(var i=0;i<maxPills;i++){
        var cor=stCorCol(colDia[i].status);
        html+='<div style="background:'+cor+';border-radius:3px;height:5px;margin-top:2px;opacity:.85" title="'+colDia[i].cli+'"></div>';
      }
      if(colDia.length>3)html+='<div style="font-size:9px;color:var(--mt);text-align:center">+'+(colDia.length-3)+'</div>';
      html+='</div>';
    }
    html+='</div>';
    // Filtro de dia ativo
    if(agDiaFiltro){
      var colFiltro=DB.coletas.filter(function(c){return c.data===agDiaFiltro;}).sort(function(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');});
      var dtF=_parseDataBR(agDiaFiltro);
      var diasS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      html+='<div style="margin-top:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+
        '<div style="height:1px;flex:1;background:var(--bd)"></div>'+
        '<span style="font-size:10px;font-weight:700;color:var(--gr);text-transform:uppercase;letter-spacing:2px">'+diasS[dtF.getDay()]+' '+agDiaFiltro+'</span>'+
        '<button onclick="agDiaFiltro=null;go(\'agenda\')" style="background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--mt)">✕ Fechar</button>'+
        '<div style="height:1px;flex:1;background:var(--bd)"></div></div>';
      if(!colFiltro.length)html+='<div style="text-align:center;padding:18px;color:var(--mt)">Nenhuma coleta neste dia</div>';
      for(var i=0;i<colFiltro.length;i++)html+=_cardColeta(colFiltro[i]);
      html+='</div>';
    }
    return html;
  }

  // ── VISÃO DIA (hoje) ────────────────────────────────
  function buildDia(){
    var horas=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
    var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
    html+='<span style="font-size:13px;font-weight:700">📅 Hoje — '+hjStr+'</span></div>';
    html+='<div class="card"><div style="display:grid;grid-template-columns:52px 1fr">';
    for(var i=0;i<horas.length;i++){
      var col=null;for(var j=0;j<DB.coletas.length;j++){if(DB.coletas[j].hora===horas[i]&&DB.coletas[j].data===hjStr){col=DB.coletas[j];break;}}
      var isNow=(hoje.getHours()===parseInt(horas[i]))&&col;
      html+='<div style="padding:9px 6px 9px 0;font-size:11px;color:var(--ft);border-right:2px solid var(--bd);text-align:right">'+horas[i]+'</div>';
      html+='<div style="padding:5px 0 5px 11px;border-bottom:1px solid var(--bd);min-height:44px">';
      if(col){var cor=stCorCol(col.status);html+='<div style="background:'+cor+'18;border:1px solid '+cor+'40;border-radius:7px;padding:5px 9px;cursor:pointer" onclick="agFiltrarDia(\''+col.data+'\')">'+
        '<div style="font-size:12px;font-weight:700;color:'+cor+'">'+stIcCol(col.status)+' '+col.cli+'</div>'+
        '<div style="font-size:10px;color:var(--mt)">'+col.peso+'kg · '+col.mat+'</div></div>';}
      html+='</div>';
    }
    html+='</div></div>';
    // listagem detalhada do dia
    var colHoje=DB.coletas.filter(function(c){return c.data===hjStr;}).sort(function(a,b){return (a.hora||'99:99').localeCompare(b.hora||'99:99');});
    if(colHoje.length){
      html+='<div style="margin-top:14px">';
      for(var i=0;i<colHoje.length;i++)html+=_cardColeta(colHoje[i]);
      html+='</div>';
    }
    return html;
  }

// Calculate value from hours worked (with discount for tardiness)
function calcValorPonto(f, ent, sai, per) {
  var vHora = f.vHora || 0;
  var minEnt = timeToMin(ent);

  if(per === 'Manha (08-12)') {
    var atrasoMin = Math.max(0, minEnt - 8*60);
    return +(Math.max(0, 4 - atrasoMin/60) * vHora).toFixed(2);
  } else if(per === 'Tarde (13-17)') {
    var atrasoMin = Math.max(0, minEnt - 13*60);
    return +(Math.max(0, 4 - atrasoMin/60) * vHora).toFixed(2);
  } else if(per === 'Dia completo (08-17)') {
    var atrasoMin = Math.max(0, minEnt - 8*60);
    return +(Math.max(0, 8 - atrasoMin/60) * vHora).toFixed(2);
  } else if(per === 'Semana completa') {
    return +(40 * vHora).toFixed(2);
  } else {
    // Personalizado: paga exatamente o que trabalhou
    var minSai = timeToMin(sai);
    return +(Math.max(0, minSai - minEnt) / 60 * vHora).toFixed(2);
  }
}

function timeToMin(t) {
  if(!t) return 0;
  var p = t.split(':');
  return parseInt(p[0]||0)*60 + parseInt(p[1]||0);
}

function descHorasAtraso(f, ent, per) {
  var vHora = f.vHora || 0;
  if(per === 'Manha (08-12)') {
    var atraso = Math.max(0, timeToMin(ent) - 8*60);
    return +(atraso / 60 * vHora).toFixed(2);
  } else if(per === 'Tarde (13-17)') {
    var atraso = Math.max(0, timeToMin(ent) - 13*60);
    return +(atraso / 60 * vHora).toFixed(2);
  }
  return 0;
}

function getWeekOf(dateStr) {
  // dateStr: DD/MM/YYYY → returns "semana de DD/MM"
  if(!dateStr) return '';
  var p = dateStr.split('/');
  if(p.length<3) return dateStr;
  var d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  var day = d.getDay(); // 0=Sun
  var diff = d.getDate() - day + (day===0?-6:1); // Monday
  var mon = new Date(d.setDate(diff));
  var fri = new Date(mon); fri.setDate(mon.getDate()+4);
  return (mon.getDate()+'/'+(mon.getMonth()+1)+'/'+mon.getFullYear()) + ' a ' + (fri.getDate()+'/'+(fri.getMonth()+1)+'/'+fri.getFullYear());
}

function getMonthOf(dateStr) {
  if(!dateStr) return '';
  var p = dateStr.split('/');
  if(p.length<3) return dateStr;
  var months=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return months[parseInt(p[1])-1]+'/'+p[2];
}

function fPendente(f) {
  var pend=0;
  for(var j=0;j<f.pontos.length;j++){if(!f.pontos[j].pago)pend+=f.pontos[j].val;}
  for(var j=0;j<(f.adiantamentos||[]).length;j++){if(!f.adiantamentos[j].descontado)pend+=f.adiantamentos[j].val;}
  return pend;
}

function getTotalSemana(f) {
  // Current week (Mon-Sun)
  var hoje = new Date();
  var day = hoje.getDay();
  var diffMon = hoje.getDate() - day + (day===0?-6:1);
  var mon = new Date(hoje); mon.setDate(diffMon); mon.setHours(0,0,0,0);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  var total = 0;
  for(var j=0;j<f.pontos.length;j++){
    var pt = f.pontos[j];
    var p = pt.data.split('/');
    var d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
    if(d>=mon && d<=sun) total+=pt.val;
  }
  return total;
}

function getTotalMes(f) {
  var hoje = new Date();
  var mesAtual = hoje.getMonth();
  var anoAtual = hoje.getFullYear();
  var total = 0;
  for(var j=0;j<f.pontos.length;j++){
    var pt = f.pontos[j];
    var p = pt.data.split('/');
    var d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
    if(d.getMonth()===mesAtual && d.getFullYear()===anoAtual) total+=pt.val;
  }
  return total;
}

          +(pt.pago?'<span class="tag tg">Pago</span>':'<button class="bsm bsmg" onclick="pgPt('+fSel+','+j+')">Pagar</button>')
          +'<button onclick="delPt('+fSel+','+j+')" style="background:var(--rdb);border:1px solid rgba(239,68,68,.3);color:var(--rd);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer">&#215;</button>'
          +'</div></div></div>';
      }
      tabContent=ptH;
    } else if(fTab==='semana'){
      // Group pontos by week
      var semanas={};
      for(var j=0;j<f.pontos.length;j++){
        var pt=f.pontos[j];
        var wk=getWeekOf(pt.data);
        if(!semanas[wk])semanas[wk]={total:0,pago:0,adiant:0,pontos:[]};
        semanas[wk].total+=pt.val;
        if(pt.pago)semanas[wk].pago+=pt.val;
        semanas[wk].pontos.push(pt);
      }
      // Soma adiantamentos por semana
      for(var j=0;j<(f.adiantamentos||[]).length;j++){
        var ad=f.adiantamentos[j];
        var wk=getWeekOf(ad.data);
        if(!semanas[wk])semanas[wk]={total:0,pago:0,adiant:0,pontos:[]};
        semanas[wk].adiant+=ad.val;
      }
      var wKeys=Object.keys(semanas);
      if(!wKeys.length){tabContent='<p style="color:var(--mt);font-size:13px;padding:14px 0">Nenhum dado.</p>';}
      else{
        tabContent='';
        for(var k=0;k<wKeys.length;k++){
          var wk=wKeys[k];var sw=semanas[wk];
          var saldo=Math.max(0, sw.total - sw.adiant);
          // Verifica se é a semana atual
          var hoje2=new Date();
          var day2=hoje2.getDay();
          var diffMon2=hoje2.getDate()-day2+(day2===0?-6:1);
          var mon2=new Date(hoje2); mon2.setDate(diffMon2); mon2.setHours(0,0,0,0);
          var monStr=(mon2.getDate()+'/'+(mon2.getMonth()+1)+'/'+mon2.getFullYear());
          var isSemanaAtual=wk.indexOf(monStr)===0;
          var temAberto=false;
          for(var p3=0;p3<sw.pontos.length;p3++){if(!sw.pontos[p3].pago){temAberto=true;break;}}

          tabContent+='<div style="background:var(--bg);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;border:1px solid '+(isSemanaAtual?'rgba(59,130,246,.35)':'var(--bd)')+'">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
            +'<div><div style="font-size:12px;font-weight:700">'+wk+(isSemanaAtual?' <span style="font-size:10px;color:var(--bl);background:var(--blb);padding:1px 7px;border-radius:10px;margin-left:4px">Atual</span>':'')+'</div>'
            +'<div style="font-size:11px;color:var(--mt)">'+sw.pontos.length+' registro(s)</div></div>'
            +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">'
            +'<div style="text-align:right">'
            +'<div style="font-size:15px;font-weight:700;color:var(--gr);font-family:monospace">'+fR(sw.total)+'</div>'
            +'<div style="font-size:10px;color:var(--mt)">trabalhado</div>'
            +'</div>'
            +(isSemanaAtual&&temAberto?'<button style="background:var(--bl);border:none;border-radius:var(--r);padding:6px 13px;color:#fff;font-size:12px;font-weight:700;cursor:pointer" onclick="mPagarSemana('+fSel+')">&#10003; Pagar semana &mdash; '+fR(saldo)+'</button>':'')
            +'</div></div>'
            +(sw.adiant>0?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)">'
              +'<div style="background:var(--orb);border-radius:6px;padding:6px 10px">'
              +'<div style="font-size:10px;color:var(--or)">Adiantado</div>'
              +'<div style="font-size:13px;font-weight:700;color:var(--or);font-family:monospace">-'+fR(sw.adiant)+'</div></div>'
              +'<div style="background:var(--blb);border-radius:6px;padding:6px 10px">'
              +'<div style="font-size:10px;color:var(--bl)">A pagar</div>'
              +'<div style="font-size:13px;font-weight:700;color:var(--bl);font-family:monospace">'+fR(saldo)+'</div></div>'
              +'</div>':'')
            +'<div style="display:flex;flex-direction:column;gap:3px;margin-top:8px">';
          for(var p2=0;p2<sw.pontos.length;p2++){
            var pt2=sw.pontos[p2];
            tabContent+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-top:1px solid rgba(255,255,255,.04)">'
              +'<span style="color:var(--mt)">'+pt2.data+' &middot; '+pt2.per+'</span>'
              +'<span style="font-family:monospace;color:'+(pt2.pago?'var(--mt)':'var(--gr)')+'">'+fR(pt2.val)+(pt2.pago?' &#10003;':'')+'</span></div>';
          }
          tabContent+='</div></div>';
        }
      }
    } else if(fTab==='mes'){
      var meses={};
      for(var j=0;j<f.pontos.length;j++){
        var pt=f.pontos[j];
        var mm=getMonthOf(pt.data);
        if(!meses[mm])meses[mm]={total:0,adiant:0,pts:[]};
        meses[mm].total+=pt.val;
        meses[mm].pts.push(pt);
      }
      for(var j=0;j<(f.adiantamentos||[]).length;j++){
        var ad=f.adiantamentos[j];
        var mm=getMonthOf(ad.data);
        if(!meses[mm])meses[mm]={total:0,adiant:0,pts:[]};
        meses[mm].adiant+=ad.val;
      }
      var mKeys=Object.keys(meses);
      if(!mKeys.length){tabContent='<p style="color:var(--mt);font-size:13px;padding:14px 0">Nenhum dado.</p>';}
      else{
        tabContent='';
        for(var k=0;k<mKeys.length;k++){
          var mk=mKeys[k];var sm=meses[mk];
          var saldoM=Math.max(0, sm.total - sm.adiant);
          tabContent+='<div style="background:var(--bg);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;border:1px solid var(--bd)">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
            +'<div><div style="font-size:14px;font-weight:700;color:var(--bl)">'+mk+'</div>'
            +'<div style="font-size:11px;color:var(--mt)">'+sm.pts.length+' registro(s)</div></div>'
            +'<div style="text-align:right">'
            +'<div style="font-size:16px;font-weight:700;color:var(--gr);font-family:monospace">'+fR(sm.total)+'</div>'
            +'<div style="font-size:10px;color:var(--mt)">trabalhado</div>'
            +'</div></div>'
            +(sm.adiant>0?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">'
              +'<div style="background:var(--orb);border-radius:6px;padding:6px 10px">'
              +'<div style="font-size:10px;color:var(--or)">Adiantado no mes</div>'
              +'<div style="font-size:13px;font-weight:700;color:var(--or);font-family:monospace">-'+fR(sm.adiant)+'</div></div>'
              +'<div style="background:var(--blb);border-radius:6px;padding:6px 10px">'
              +'<div style="font-size:10px;color:var(--bl)">A pagar no mes</div>'
              +'<div style="font-size:14px;font-weight:700;color:var(--bl);font-family:monospace">'+fR(saldoM)+'</div></div>'
              +'</div>':'')
            +'</div>';
        }
      }
    } else if(fTab==='adiant'){
      var adH='';
      var adList=f.adiantamentos||[];
      if(!adList.length) adH='<p style="color:var(--mt);font-size:13px;padding:14px 0">Nenhum adiantamento.</p>';
      else for(var j=0;j<adList.length;j++){
        var ad=adList[j];
        adH+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:var(--r);margin-bottom:7px;border:1px solid '+(ad.descontado?'var(--bd)':'rgba(245,158,11,.4)')+'"><div>'
          +'<div style="font-size:13px;font-weight:600">'+ad.data+'</div>'
          +'<div style="font-size:11px;color:var(--mt)">'+ad.obs+'</div>'
          +'</div>'
          +'<div style="display:flex;align-items:center;gap:7px">'
          +'<span style="font-size:14px;font-weight:700;color:'+(ad.descontado?'var(--mt)':'var(--or)')+';font-family:monospace">'+fR(ad.val)+'</span>'
          +(ad.descontado?'<span class="tag to">Descontado</span>':'<button class="bsm" style="background:var(--orb);border:1px solid rgba(245,158,11,.4);color:var(--or)" onclick="descAdiant('+fSel+','+j+')">Descontar</button>')
          +'<button onclick="delAdiant('+fSel+','+j+')" style="background:var(--rdb);border:1px solid rgba(239,68,68,.3);color:var(--rd);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer">&#215;</button>'
          +'</div></div>';
      }
      tabContent=adH;
    }

    det='<div style="display:flex;flex-direction:column;gap:11px">'
      +'<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px">'
      +'<div><div style="font-size:15px;font-weight:700">'+f.nome+'</div>'
      +'<div style="font-size:11px;color:var(--mt)">'+f.cargo+(f.tel?' &middot; '+f.tel:'')+'</div></div>'
      +'<div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end">'
      +'<button class="btn btn-or" style="font-size:12px;padding:7px 12px" onclick="mAdiantamento('+fSel+')">&#128181; Adiantar</button>'
      +'<button class="btn" onclick="mPonto('+fSel+')">&#128197; Registrar Ponto</button>'
      +'</div></div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px">'+vH+'</div>'
      +'</div>'
      +'<div class="card">'+tabsH+'<div>'+tabContent+'</div></div>'
      +'</div>';
  }

  return '<div class="fc">'
    +'<div class="ptop"><div><div class="pl">Equipe</div><div class="pt">Funcionarios e Ponto</div></div>'
    +'<button class="btn" onclick="mNovoFunc()">+ Novo</button></div>'
    +'<div style="display:grid;grid-template-columns:'+(fSel!==null?'280px 1fr':'1fr')+';gap:14px">'
    +'<div style="display:flex;flex-direction:column;gap:9px">'+lista+'</div>'
    +det
    +'</div></div>';
}

function updPtV(fi){
  var f=DB.funcs[fi];
  var pEl=document.getElementById('pt-p');
  var enEl=document.getElementById('pt-e');
  var saEl=document.getElementById('pt-s');
  var lblE=document.getElementById('pt-lbl-e');
  var lblS=document.getElementById('pt-lbl-s');
  var prev=document.getElementById('pt-preview');
  if(!pEl||!enEl||!saEl)return;
  var per=pEl.value;

  // Lock/unlock fields and set fixed saída based on period
  if(per==='Semana completa'){
    // Esconde campos de horário, não faz sentido para semana
    var horarios=document.getElementById('pt-horarios');
    if(horarios)horarios.style.display='none';
    var v=calcValorPonto(f,'','',per);
    if(prev){prev.className='al alg';prev.innerHTML='Valor: <strong>'+fR(v)+'</strong> <span style="font-size:11px;color:var(--mt)">(40h &times; '+fR(f.vHora)+'/h)</span>';}
    return;
  }
  // Mostra campos de horário para outros períodos
  var horarios=document.getElementById('pt-horarios');
  if(horarios)horarios.style.display='grid';

  if(per==='Manha (08-12)'){
    // Entrada livre (para capturar atraso), saída travada em 12:00
    enEl.readOnly=false; enEl.style.opacity='1'; enEl.style.cursor='';
    saEl.value='12:00'; saEl.readOnly=true; saEl.style.opacity='.5'; saEl.style.cursor='not-allowed';
    if(lblE) lblE.textContent='Entrada (livre - atraso descontado)';
    if(lblS) lblS.textContent='Saida (travada em 12:00)';
  } else if(per==='Tarde (13-17)'){
    // Entrada livre (para capturar atraso), saída travada em 17:00
    enEl.readOnly=false; enEl.style.opacity='1'; enEl.style.cursor='';
    saEl.value='17:00'; saEl.readOnly=true; saEl.style.opacity='.5'; saEl.style.cursor='not-allowed';
    if(lblE) lblE.textContent='Entrada (livre - atraso descontado)';
    if(lblS) lblS.textContent='Saida (travada em 17:00)';
  } else if(per==='Dia completo (08-17)'){
    // Entrada livre (para capturar atraso), saída travada em 17:00
    enEl.readOnly=false; enEl.style.opacity='1'; enEl.style.cursor='';
    saEl.value='17:00'; saEl.readOnly=true; saEl.style.opacity='.5'; saEl.style.cursor='not-allowed';
    if(lblE) lblE.textContent='Entrada (livre - atraso descontado)';
    if(lblS) lblS.textContent='Saida (travada em 17:00)';
  } else {
    // Personalizado: os dois livres
    enEl.readOnly=false; enEl.style.opacity='1'; enEl.style.cursor='';
    saEl.readOnly=false; saEl.style.opacity='1'; saEl.style.cursor='';
    if(lblE) lblE.textContent='Entrada';
    if(lblS) lblS.textContent='Saida';
  }

  var ent=enEl.value, sai=saEl.value;
  var v=calcValorPonto(f, ent, sai, per);
  var desc=descHorasAtraso(f, ent, per);
  if(prev){
    if(desc>0){
      prev.className='al aly';
      prev.innerHTML='Valor: <strong>'+fR(v)+'</strong> <span style="color:var(--rd);font-size:12px">(-'+fR(desc)+' por atraso de '+Math.round((timeToMin(ent)-(per==='Tarde (13-17)'?13*60:8*60)))+'min)</span>';
    } else {
      prev.className='al alg';
      prev.innerHTML='Valor: <strong>'+fR(v)+'</strong>';
    }
  }
}

function savePt(fi){
  var f=DB.funcs[fi];
  var da=document.getElementById('pt-d').value;
  var p=document.getElementById('pt-p').value;
  var en=document.getElementById('pt-e').value;

  closeM(); go('funcionarios');
}

function getAdiantSemana(f) {
  // Soma adiantamentos não descontados registrados na semana atual
  var hoje = new Date();
  var day = hoje.getDay();
  var diffMon = hoje.getDate() - day + (day===0?-6:1);
  var mon = new Date(hoje); mon.setDate(diffMon); mon.setHours(0,0,0,0);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  var total = 0;
  for(var j=0;j<(f.adiantamentos||[]).length;j++){
    var ad=f.adiantamentos[j];
    if(ad.descontado) continue;
    var p=ad.data.split('/');
    var d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(d>=mon && d<=sun) total+=ad.val;
  }
  return total;
}

function getAdiantMes(f) {
  var hoje = new Date();
  var mesAtual = hoje.getMonth(), anoAtual = hoje.getFullYear();
  var total = 0;
  for(var j=0;j<(f.adiantamentos||[]).length;j++){
    var ad=f.adiantamentos[j];
    if(ad.descontado) continue;
    var p=ad.data.split('/');
    var d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(d.getMonth()===mesAtual && d.getFullYear()===anoAtual) total+=ad.val;
  }
  return total;
}

function mPagarSemana(fi){
  var f=DB.funcs[fi];
  var trabSemana=getTotalSemana(f);
  var adiantSemana=getAdiantSemana(f);
  var saldo=Math.max(0, trabSemana - adiantSemana);

  // Quais pontos da semana ainda não foram pagos?
  var hoje=new Date();
  var day=hoje.getDay();
  var diffMon=hoje.getDate()-day+(day===0?-6:1);
  var mon=new Date(hoje); mon.setDate(diffMon); mon.setHours(0,0,0,0);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  var pontosAbertos=[];
  for(var j=0;j<f.pontos.length;j++){
    var pt=f.pontos[j];
    if(pt.pago) continue;
    var p=pt.data.split('/');
    var d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(d>=mon && d<=sun) pontosAbertos.push(j);
  }

  if(!pontosAbertos.length && adiantSemana===0){
    openM('Pagar Semana',
      '<div class="mf"><div class="al alg">Nenhum ponto em aberto nesta semana.</div>'
      +'<div class="brow"><button class="btn" onclick="closeM()">OK</button></div></div>', 360);
    return;
  }

  var itensH='';
  for(var k=0;k<pontosAbertos.length;k++){
    var pt=f.pontos[pontosAbertos[k]];
    itensH+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)">'
      +'<span style="color:var(--mt)">'+pt.data+' &middot; '+pt.per+'</span>'
      +'<span style="font-family:monospace;color:var(--gr)">'+fR(pt.val)+'</span></div>';
  }

  openM('Pagar Semana - '+f.nome,
    '<div class="mf">'
    +'<div style="background:var(--bg);border-radius:var(--r);padding:11px 13px">'
    +'<div style="font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Resumo da semana</div>'
    +itensH
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px">'
    +'<div><div style="font-size:10px;color:var(--mt)">Total trabalhado</div><div style="font-size:14px;font-weight:700;color:var(--gr);font-family:monospace">'+fR(trabSemana)+'</div></div>'
    +'<div><div style="font-size:10px;color:var(--mt)">Adiantamentos</div><div style="font-size:14px;font-weight:700;color:var(--or);font-family:monospace">-'+fR(adiantSemana)+'</div></div>'
    +'<div><div style="font-size:10px;color:var(--mt)">A pagar agora</div><div style="font-size:16px;font-weight:700;color:var(--bl);font-family:monospace">'+fR(saldo)+'</div></div>'
    +'</div></div>'
    +(saldo===0?'<div class="al alg" style="font-size:12px">Tudo ja foi coberto pelos adiantamentos. Basta marcar os pontos como pagos.</div>':'')
    +'<div class="brow">'
    +'<button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn" style="background:var(--bl)" onclick="confirmarPagarSemana('+fi+')">&#10003; Confirmar Pagamento de '+fR(saldo)+'</button>'
    +'</div></div>', 480);
}

function confirmarPagarSemana(fi){
  var f=DB.funcs[fi];
  var hoje=new Date();
  var day=hoje.getDay();
  var diffMon=hoje.getDate()-day+(day===0?-6:1);
  var mon=new Date(hoje); mon.setDate(diffMon); mon.setHours(0,0,0,0);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);

  var totalPago=0;
  // Marca todos os pontos abertos da semana como pagos
  for(var j=0;j<f.pontos.length;j++){
    var pt=f.pontos[j];
    if(pt.pago) continue;
    var p=pt.data.split('/');
    var d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(d>=mon && d<=sun){pt.pago=true; totalPago+=pt.val;}
  }
  // Marca adiantamentos da semana como descontados
  for(var j=0;j<(f.adiantamentos||[]).length;j++){
    var ad=f.adiantamentos[j];
    if(ad.descontado) continue;
    var p=ad.data.split('/');
    var d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(d>=mon && d<=sun) ad.descontado=true;
  }
  var saldo=Math.max(0, totalPago - getAdiantSemana(f));
  // Lança pagamento líquido no financeiro (já descontando adiantamentos que já foram lançados)
  if(saldo>0) _addMovFin('Pagto semana '+f.nome, 'saida', saldo);
  closeM(); fTab='semana'; go('funcionarios');
}

function _gGetBasePrecos(){
  // Retorna {pId, nome, ic, preco} para todos os produtos da base selecionada
  var result=[];
  if(_gBase){
    var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(_gBase)){tab=DB.tabelas[i];break;}}
    if(tab){
      for(var j=0;j<tab.itens.length;j++){
        var p=gP(tab.itens[j].pId);
        if(p)result.push({pId:p.id,nome:p.nome,ic:p.ic,preco:tab.itens[j].preco});
      }
    }
  } else {
    // Manual: todos os produtos com vV
    for(var i=0;i<DB.produtos.length;i++){
      var p=DB.produtos[i];
      if(p.vV>0)result.push({pId:p.id,nome:p.nome,ic:p.ic,preco:p.vV});
    }
  }
  return result;
}

function _gCalcPreco(tabIdx, pId, precoVenda){
  var t=_gTabs[tabIdx];
  var modo=t.modo; // 'geral' ou 'prod'
  var tipoVal, val;
  if(modo==='prod' && t.porProd[pId]!==undefined){
    tipoVal=t.porProd[pId].tipo||'pct';
    val=parseFloat(t.porProd[pId].val)||0;
  } else {
    tipoVal=t.tipoVal||'pct';
    val=parseFloat(t.valGeral)||0;
  }
  if(tipoVal==='pct'){
    return precoVenda*(1-val/100);
  } else {
    return precoVenda-val;
  }
}

function _gSetBase(v){_gBase=v?parseFloat(v):null;_gPreview=false;go('tabelas');}
function _gToggleTab(key){for(var i=0;i<_gTabs.length;i++){if(_gTabs[i].key===key){_gTabs[i].ativo=!_gTabs[i].ativo;break;}}go('tabelas');}
function _gSetModo(key,modo){for(var i=0;i<_gTabs.length;i++){if(_gTabs[i].key===key){_gTabs[i].modo=modo;break;}}go('tabelas');}
function _gSetTipoVal(key,tv){for(var i=0;i<_gTabs.length;i++){if(_gTabs[i].key===key){_gTabs[i].tipoVal=tv;break;}}go('tabelas');}
function _gSetValGeral(key,v){for(var i=0;i<_gTabs.length;i++){if(_gTabs[i].key===key){_gTabs[i].valGeral=parseFloat(v)||0;break;}};}
function _gSetProdVal(key,pId,campo,v){for(var i=0;i<_gTabs.length;i++){if(_gTabs[i].key===key){if(!_gTabs[i].porProd[pId])_gTabs[i].porProd[pId]={tipo:'pct',val:0};_gTabs[i].porProd[pId][campo]=(campo==='tipo'?v:(parseFloat(v)||0));break;}};}
function _gShowPreview(){_gPreview=true;go('tabelas');}

function _gGerar(){
  var base=_gGetBasePrecos();
  if(!base.length){alert('Nenhum produto na base selecionada!');return;}
  var geradas=[];
  for(var ti=0;ti<_gTabs.length;ti++){
    var cfg=_gTabs[ti];
    if(!cfg.ativo)continue;
    // Verificar se já existe tabela com esse nome
    var tabExist=null;
    for(var k=0;k<DB.tabelas.length;k++){
      if(DB.tabelas[k].nome.toLowerCase()===('tabela '+cfg.nome).toLowerCase()&&DB.tabelas[k].tipo==='compra'){
        tabExist=k;break;
      }
    }
    var itens=[];
    for(var bi=0;bi<base.length;bi++){
      var prc=_gCalcPreco(ti,base[bi].pId,base[bi].preco);
      if(prc<0)prc=0;
      itens.push({pId:base[bi].pId,preco:Math.round(prc*100)/100});
    }
    if(tabExist!==null){
      DB.tabelas[tabExist].itens=itens;
    } else {
      var corMap={amarela:'amarelo',azul:'azul',verde:'verde',preta:'preto',dourada:'dourado'};
      DB.tabelas.push({id:nid(),nome:'Tabela '+cfg.nome,tipo:'compra',cor:corMap[cfg.key]||'padrao',itens:itens});
    }
    geradas.push(cfg.nome);
  }
  _gPreview=false;
  alert('Tabelas geradas/atualizadas: '+geradas.join(', '));
  swTabF('compra');
}

      if(String(DB.tabelas[i].id)===String(cmpTabA))tA=DB.tabelas[i];
      if(String(DB.tabelas[i].id)===String(cmpTabB))tB=DB.tabelas[i];
    }
    if(tA&&tB){
      // Coletar todos os produtos que aparecem em pelo menos uma das tabelas
      var prods={};
      for(var i=0;i<tA.itens.length;i++){var it=tA.itens[i];prods[it.pId]=prods[it.pId]||{pId:it.pId,pA:null,pB:null};prods[it.pId].pA=it.preco;}
      for(var i=0;i<tB.itens.length;i++){var it=tB.itens[i];prods[it.pId]=prods[it.pId]||{pId:it.pId,pA:null,pB:null};prods[it.pId].pB=it.preco;}
      var rows='';var somaVenda=0;var somaCompra=0;var somaValor=0;var countMargem=0;
      var corA=getTabCor(tA);var corB=getTabCor(tB);
      var keys=Object.keys(prods);
      for(var i=0;i<keys.length;i++){
        var row=prods[keys[i]];var p=gP(row.pId);if(!p)continue;
        var pA=row.pA;var pB=row.pB;
        var diff=pA!==null&&pB!==null?pB-pA:null;
        // % margem sobre o maior preço (preço de venda = referência)
        var pMax=pA!==null&&pB!==null?Math.max(pA,pB):null;
        var pct=diff!==null&&pMax>0?(diff/pMax*100):null;
        if(diff!==null){somaValor+=diff;somaVenda+=pMax;somaCompra+=Math.min(pA,pB);countMargem++;}
        var diffColor=diff===null?'var(--mt)':diff>0?'#86efac':diff<0?'#fca5a5':'var(--mt)';
        var diffSign=diff===null?'':diff>=0?'+':'';
        var editA=pA!==null
          ?'<button onclick="mEditCmpPreco(\&apos;A\&apos;,'+p.id+')" style="margin-left:6px;background:rgba(255,255,255,.08);border:1px solid var(--bd);color:var(--mt);border-radius:5px;padding:1px 6px;font-size:11px;cursor:pointer" title="Editar preço em '+tA.nome+'">✏️</button>'
          :'<button onclick="mEditCmpPreco(\&apos;A\&apos;,'+p.id+')" style="margin-left:6px;background:var(--grb);border:1px solid rgba(34,197,94,.3);color:var(--gr);border-radius:5px;padding:1px 6px;font-size:11px;cursor:pointer" title="Adicionar à '+tA.nome+'">+</button>';
        var editB=pB!==null
          ?'<button onclick="mEditCmpPreco(\&apos;B\&apos;,'+p.id+')" style="margin-left:6px;background:rgba(255,255,255,.08);border:1px solid var(--bd);color:var(--mt);border-radius:5px;padding:1px 6px;font-size:11px;cursor:pointer" title="Editar preço em '+tB.nome+'">✏️</button>'
          :'<button onclick="mEditCmpPreco(\&apos;B\&apos;,'+p.id+')" style="margin-left:6px;background:var(--grb);border:1px solid rgba(34,197,94,.3);color:var(--gr);border-radius:5px;padding:1px 6px;font-size:11px;cursor:pointer" title="Adicionar à '+tB.nome+'">+</button>';
        rows+='<tr>'
          +'<td style="padding:8px 10px;font-size:13px;border-bottom:1px solid var(--bd)">'+p.ic+' '+p.nome+'</td>'
          +'<td style="padding:8px 10px;text-align:right;font-family:monospace;font-size:13px;border-bottom:1px solid var(--bd);color:'+(pA!==null?'var(--tx)':'var(--mt)')+';font-weight:600">'
          +'<span style="display:inline-flex;align-items:center;gap:2px">'+(pA!==null?fR(pA)+'/kg':'—')+editA+'</span></td>'
          +'<td style="padding:8px 10px;text-align:right;font-family:monospace;font-size:13px;border-bottom:1px solid var(--bd);color:'+(pB!==null?'var(--tx)':'var(--mt)')+';font-weight:600">'
          +'<span style="display:inline-flex;align-items:center;gap:2px">'+(pB!==null?fR(pB)+'/kg':'—')+editB+'</span></td>'
          +'<td style="padding:8px 10px;text-align:right;font-family:monospace;font-size:13px;font-weight:700;border-bottom:1px solid var(--bd);color:'+diffColor+'">'
          +(diff!==null?diffSign+fR(diff)+'/kg':'—')+'</td>'
          +'<td style="padding:8px 10px;text-align:right;font-family:monospace;font-size:13px;font-weight:700;border-bottom:1px solid var(--bd);color:'+diffColor+'">'
          +(pct!==null?diffSign+pct.toFixed(1)+'%':'—')+'</td>'
          +'</tr>';
      }
      var mediaValor=countMargem>0?(somaValor/countMargem):0;
      var mediaPct=somaVenda>0?((somaVenda-somaCompra)/somaVenda*100):0;
      var mediaColor=mediaValor>0?'var(--gr)':mediaValor<0?'var(--rd)':'var(--mt)';
      resultH='<div class="card" style="overflow-x:auto">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span style="background:'+corA.hex+';color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">'+tA.nome+'</span>'
        +'<span style="color:var(--mt);font-size:13px">vs</span>'
        +'<span style="background:'+corB.hex+';color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">'+tB.nome+'</span>'
        +'</div>'
        +'<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
        +'<div style="font-size:12px;color:var(--mt)">Margem média: <span style="font-weight:700;color:'+mediaColor+';font-family:monospace">'+(mediaValor>=0?'+':'')+fR(mediaValor)+'/kg</span></div>'
        +'<div style="font-size:12px;color:var(--mt)">Margem geral: <span style="font-weight:700;color:'+mediaColor+';font-family:monospace">'+(mediaPct>=0?'+':'')+mediaPct.toFixed(1)+'%</span></div>'
        +'</div>'
        +'</div>'
        +'<table style="width:100%;border-collapse:collapse;min-width:420px">'
        +'<thead><tr>'
        +'<th style="padding:8px 10px;text-align:left;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">Produto</th>'
        +'<th style="padding:8px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">'+tA.nome+'</th>'
        +'<th style="padding:8px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">'+tB.nome+'</th>'
        +'<th style="padding:8px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">Diferença R$</th>'
        +'<th style="padding:8px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">Margem %</th>'
        +'</tr></thead>'
        +'<tbody>'+rows+'</tbody>'
        +'</table>'
        +(keys.length===0?'<div style="text-align:center;padding:20px;color:var(--mt)">Nenhum produto em comum ou nas tabelas.</div>':'')
        +'</div>';
    }
  }
  return '<div class="card" style="padding:14px">'
    +'<div class="stl" style="margin-bottom:12px"><div class="stb" style="background:var(--bl)"></div><div class="stx" style="color:var(--bl)">Comparar Tabelas</div></div>'
    +'<div class="al alb" style="margin-bottom:12px;font-size:12px">Selecione duas tabelas quaisquer — compra x compra, venda x venda ou compra x venda — para ver a diferença de preço e margem por produto.</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
    +'<div class="fld"><label>Tabela A</label><select class="inp" id="cmp-a" onchange="setCmpA(this.value)">'+opts+'</select></div>'
    +'<div class="fld"><label>Tabela B</label><select class="inp" id="cmp-b" onchange="setCmpB(this.value)">'+opts2+'</select></div>'
    +'</div>'
    +(cmpTabA&&cmpTabB?'':'<div style="text-align:center;padding:16px;color:var(--mt);font-size:13px">Selecione as duas tabelas para ver a comparação</div>')
    +'</div>'
    +resultH;
}

function setCmpA(v){cmpTabA=v?parseFloat(v):null;go('tabelas');}

function mEditCmpPreco(lado,prodId){
  var tabId=lado==='A'?cmpTabA:cmpTabB;
  var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){tab=DB.tabelas[i];break;}}
  if(!tab)return;
  var p=gP(prodId);if(!p)return;
  var precoAtual=null;var itemIdx=-1;
  for(var i=0;i<tab.itens.length;i++){if(tab.itens[i].pId===prodId){precoAtual=tab.itens[i].preco;itemIdx=i;break;}}
  var cor=getTabCor(tab);
  var isNovo=precoAtual===null;
  openM((isNovo?'Adicionar':'Editar')+' preço — '+tab.nome,
    '<div class="mf">'
    +'<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:'+cor.hex+';border-radius:var(--r);margin-bottom:4px">'
    +'<span style="font-size:22px">'+p.ic+'</span>'
    +'<div><div style="font-size:14px;font-weight:700;color:#fff">'+p.nome+'</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.6)">Tabela: '+tab.nome+' ('+(tab.tipo==='venda'?'Venda':'Compra')+')</div></div>'
    +'</div>'
    +'<div class="fld"><label>Preço R$/kg</label>'
    +'<input class="inp" type="number" inputmode="decimal" id="cmp-pr" value="'+(precoAtual||'')+'" placeholder="0,00" step="0.01" style="font-size:20px;text-align:center;font-family:monospace">'
    +'</div>'
    +'<div class="brow">'
    +(!isNovo?'<button class="btnO bOr" onclick="delCmpPreco(\&apos;'+lado+'\&apos;,'+prodId+','+itemIdx+')">Remover da tabela</button>':'')
    +'<button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn" onclick="saveCmpPreco(\&apos;'+lado+'\&apos;,'+prodId+','+itemIdx+')">Salvar</button>'
    +'</div></div>',400);
  setTimeout(function(){var el=document.getElementById('cmp-pr');if(el){el.focus();el.select();}},80);
}

function saveCmpPreco(lado,prodId,itemIdx){
  var tabId=lado==='A'?cmpTabA:cmpTabB;
  var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){tab=DB.tabelas[i];break;}}
  if(!tab)return;
  var novoPreco=parseFloat(document.getElementById('cmp-pr').value)||0;
  if(novoPreco<0){alert('Preço inválido!');return;}
  if(itemIdx>=0){
    tab.itens[itemIdx].preco=novoPreco;
  } else {
    tab.itens.push({pId:prodId,preco:novoPreco});
  }
  closeM();go('tabelas');
}

function delCmpPreco(lado,prodId,itemIdx){
  var tabId=lado==='A'?cmpTabA:cmpTabB;
  var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){tab=DB.tabelas[i];break;}}
  if(!tab||itemIdx<0)return;
  confirmar('Remover este produto da tabela?',function(){
    tab.itens.splice(itemIdx,1);go('tabelas');
  });
}

function saveConc(){
  var nome=document.getElementById('nc-nome').value.trim();
  if(!nome){alert('Informe o nome!');return;}
  var data=document.getElementById('nc-data').value.trim();
  var obs=document.getElementById('nc-obs').value.trim();
  var itens=[];
  var rows=document.getElementById('nc-itens').children;
  for(var i=0;i<rows.length;i++){
    var inputs=rows[i].querySelectorAll('input');
    if(inputs.length<2)continue;
    var pnome=inputs[0].value.trim();
    var ppreco=parseFloat(inputs[1].value)||0;
    if(pnome)itens.push({nome:pnome,preco:ppreco});
  }
  if(!DB.concorrentes)DB.concorrentes=[];
  if(_concEdit===null){
    DB.concorrentes.push({id:nid(),nome:nome,data:data,obs:obs,itens:itens});
  } else {
    DB.concorrentes[_concEdit].nome=nome;
    DB.concorrentes[_concEdit].data=data;
    DB.concorrentes[_concEdit].obs=obs;
    DB.concorrentes[_concEdit].itens=itens;
  }
  closeM();go('tabelas');
}

function delConc(idx){

  for(var i=0;i<fmts.length;i++){
    var b=document.getElementById('imt-btn-'+fmts[i]);

    b.style.borderColor=on?'var(--bl)':'var(--bd)';

  }

function _imtCsvPreview(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    var sep=text.indexOf(';')>text.indexOf(',')?';':',';
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    if(!lines.length)return;
    _imtCsvHeaders=lines[0].split(sep).map(function(h){return h.trim().replace(/^["']|["']$/g,'');});
    _imtCsvRows=[];
    for(var i=1;i<lines.length;i++){
      var cols=lines[i].split(sep).map(function(v){return v.trim().replace(/^["']|["']$/g,'');});
      if(cols.some(function(c){return c;}))_imtCsvRows.push(cols);
    }
    var optH='';for(var j=0;j<_imtCsvHeaders.length;j++)optH+='<option value="'+j+'">'+_imtCsvHeaders[j]+'</option>';
    document.getElementById('imt-csv-col-prod').innerHTML=optH;
    document.getElementById('imt-csv-col-prec').innerHTML=optH;
    for(var j=0;j<_imtCsvHeaders.length;j++){
      var h=_imtCsvHeaders[j].toLowerCase();
      if(h.indexOf('pre')>=0||h.indexOf('valor')>=0){document.getElementById('imt-csv-col-prec').value=j;break;}
    }
    var thH='';for(var j=0;j<_imtCsvHeaders.length;j++)thH+='<th style="padding:5px 8px;font-size:10px;color:var(--mt);border-bottom:1px solid var(--bd)">'+_imtCsvHeaders[j]+'</th>';
    var trH='';var maxP=Math.min(_imtCsvRows.length,4);
    for(var i=0;i<maxP;i++){var rH='';for(var j=0;j<_imtCsvRows[i].length;j++)rH+='<td style="padding:5px 8px;font-size:12px;border-bottom:1px solid var(--bd)">'+_imtCsvRows[i][j]+'</td>';trH+='<tr>'+rH+'</tr>';}
    document.getElementById('imt-csv-preview').innerHTML='<div style="overflow-x:auto;margin:6px 0"><table style="width:100%;border-collapse:collapse"><thead><tr>'+thH+'</tr></thead><tbody>'+trH+'</tbody></table></div><div style="font-size:11px;color:var(--mt)">'+_imtCsvRows.length+' linha(s)</div>';
    document.getElementById('imt-csv-maprow').classList.remove('H');
    document.getElementById('imt-btn-salvar').disabled=false;
  };
  reader.readAsText(file,'UTF-8');
}

async function _imtAiPreview(input){
  var file=input.files[0];if(!file)return;
  var status=document.getElementById('imt-ai-status');
  var result=document.getElementById('imt-ai-result');
  status.innerHTML='<div class="al alb" style="font-size:12px">⏳ Enviando para o Gemini AI... aguarde.</div>';
  result.className='H';
  document.getElementById('imt-btn-salvar').disabled=true;
  _imtAiItens=[];
  try{
    var b64=await new Promise(function(res,rej){
      var reader=new FileReader();
      reader.onload=function(e){res(e.target.result.split(',')[1]);};
      reader.onerror=rej;
      reader.readAsDataURL(file);
    });
    var mimeType=file.type||'image/jpeg';
    if(file.name.toLowerCase().endsWith('.pdf'))mimeType='application/pdf';
    var key=DB.geminiKey||'';
    if(!key){status.innerHTML='<div class="al alr">Chave do Gemini não configurada!</div>';return;}
    var prompt='Você é um extrator de dados de tabelas de preços de materiais recicláveis. Analise este arquivo e extraia TODOS os produtos e seus preços. Retorne APENAS um JSON válido neste formato, sem markdown, sem explicação:\n{"itens":[{"nome":"Nome do produto","preco":0.00}]}\nSe um preço estiver em formato brasileiro (vírgula), converta para número decimal com ponto. Extraia todos os itens visíveis.';
    var resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:mimeType,data:b64}},{text:prompt}]}],generationConfig:{temperature:0,maxOutputTokens:2048}})
    });
    if(!resp.ok){var err=await resp.json();status.innerHTML='<div class="al alr">Erro: '+(err.error&&err.error.message?err.error.message:resp.status)+'</div>';return;}
    var data=await resp.json();
    var text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0]?data.candidates[0].content.parts[0].text:'';
    text=text.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(text);
    _imtAiItens=parsed.itens||[];
    if(!_imtAiItens.length){status.innerHTML='<div class="al alr">Nenhum produto encontrado.</div>';return;}
    var rows='';
    for(var i=0;i<_imtAiItens.length;i++){
      rows+='<div style="display:grid;grid-template-columns:1fr 100px;gap:6px;align-items:center;padding:5px 8px;background:rgba(59,130,246,.08);border-radius:6px;margin-bottom:4px">'
        +'<input class="inp" style="font-size:12px;padding:5px 8px" value="'+_imtAiItens[i].nome+'" onchange="_imtAiItens['+i+'].nome=this.value">'
        +'<input class="inp" type="number" style="font-size:12px;padding:5px 8px;text-align:right;font-family:monospace" value="'+_imtAiItens[i].preco+'" onchange="_imtAiItens['+i+'].preco=parseFloat(this.value)||0">'
        +'</div>';
    }
    status.innerHTML='<div class="al" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;font-size:12px">✓ '+_imtAiItens.length+' produto(s) encontrado(s). Confira e corrija se necessário:</div>';
    result.innerHTML='<div style="max-height:180px;overflow-y:auto;margin-top:6px">'+rows+'</div>';
    result.className='';
    document.getElementById('imt-btn-salvar').disabled=false;
  }catch(e){status.innerHTML='<div class="al alr">Erro: '+e.message+'</div>';}
}

function _imtSalvar(){
  var nome=document.getElementById('imt-nome').value.trim();
  if(!nome){alert('Informe o nome da tabela!');return;}
  var itens=[];
  if(_imtFormato==='csv'){
    var colP=parseInt(document.getElementById('imt-csv-col-prod').value);
    var colV=parseInt(document.getElementById('imt-csv-col-prec').value);
    for(var i=0;i<_imtCsvRows.length;i++){
      var pnome=(_imtCsvRows[i][colP]||'').trim();
      var raw=(_imtCsvRows[i][colV]||'').replace(/[R$\s]/g,'').replace(',','.');
      var ppreco=parseFloat(raw)||0;
      if(pnome)itens.push({nome:pnome,preco:ppreco});
    }
  } else {
    itens=_imtAiItens;
  }
  if(!itens.length){alert('Nenhum produto para importar!');return;}
  // Converte nomes para pIds vinculando com produtos existentes
  var tabItens=[];
  var naoVinculados=[];
  for(var i=0;i<itens.length;i++){
    var match=null;
    var nLower=itens[i].nome.toLowerCase();
    // Tenta match exato primeiro, depois parcial
    for(var j=0;j<DB.produtos.length;j++){
      if(DB.produtos[j].nome.toLowerCase()===nLower){match=DB.produtos[j];break;}
    }
    if(!match){
      for(var j=0;j<DB.produtos.length;j++){
        var pn=DB.produtos[j].nome.toLowerCase();
        if(pn.indexOf(nLower.split(' ')[0])>=0||nLower.indexOf(pn.split(' ')[0])>=0){match=DB.produtos[j];break;}
      }
    }
    if(match){
      tabItens.push({pId:match.id,preco:itens[i].preco});
    } else {
      naoVinculados.push(itens[i].nome);
    }
  }
  DB.tabelas.push({id:nid(),nome:nome,tipo:_imtTabTipo,cor:'padrao',itens:tabItens});
  var msg='Tabela <b>'+nome+'</b> importada com '+tabItens.length+' produto(s)!';
  if(naoVinculados.length)msg+='<br><br><span style="color:var(--or)">⚠️ '+naoVinculados.length+' produto(s) não encontrado(s) no cadastro:<br>'+naoVinculados.join(', ')+'<br>Cadastre-os em Estoque e edite a tabela.</span>';
  closeM();
  openM('Importação Concluída','<div class="mf"><div class="al" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac">'+msg+'</div><div class="brow"><button class="btn" onclick="closeM();swTabF(\&apos;'+_imtTabTipo+'\&apos;);go(\&apos;tabelas\&apos;)">Ver Tabelas</button></div></div>',480);
}

function _csvPreview(input){

    var text=e.target.result;

    _csvHeaders=lines[0].split(sep).map(function(h){return h.trim().replace(/^["']|["']$/g,'');});

var _concCmpResult=null;

function _execCompararConc(idx){
  var tabIdx=document.getElementById('conc-tab-sel').value;
  if(tabIdx===''){alert('Selecione uma tabela!');return;}
  var c=DB.concorrentes[idx];
  var tab=DB.tabelas[parseInt(tabIdx)];
  // Monta resultado de comparação
  var rows='';var somaVenda=0;var somaConc=0;var count=0;
  var thTab='';
  // Para cada item do concorrente, tenta achar produto na tabela pelo nome similar
  for(var i=0;i<c.itens.length;i++){
    var ci=c.itens[i];
    // Busca match na tabela pelo nome
    var meuPreco=null;var meuNome='—';
    for(var j=0;j<tab.itens.length;j++){
      var p=gP(tab.itens[j].pId);
      if(p&&p.nome.toLowerCase().indexOf(ci.nome.toLowerCase().split(' ')[0])>=0){
        meuPreco=tab.itens[j].preco;meuNome=p.nome;break;
      }
    }
    var diff=meuPreco!==null?meuPreco-ci.preco:null;
    var pMax=meuPreco!==null?Math.max(meuPreco,ci.preco):null;
    var pct=diff!==null&&pMax>0?(diff/pMax*100):null;
    var dc=diff===null?'var(--mt)':diff>0?'#86efac':diff<0?'#fca5a5':'var(--mt)';
    var ds=diff===null?'':diff>=0?'+':'';
    if(diff!==null){somaVenda+=meuPreco;somaConc+=ci.preco;count++;}
    rows+='<tr>'
      +'<td style="padding:7px 10px;font-size:12px;border-bottom:1px solid var(--bd)">'+ci.nome+'</td>'
      +'<td style="padding:7px 10px;text-align:right;font-family:monospace;font-size:12px;font-weight:600;border-bottom:1px solid var(--bd);color:var(--pu)">'+fR(ci.preco)+'/kg</td>'
      +'<td style="padding:7px 10px;text-align:right;font-family:monospace;font-size:12px;font-weight:600;border-bottom:1px solid var(--bd);color:'+(meuPreco!==null?'var(--tx)':'var(--mt)')+'">'+( meuPreco!==null?fR(meuPreco)+'/kg':'—')+'</td>'
      +'<td style="padding:7px 10px;text-align:right;font-family:monospace;font-size:12px;font-weight:700;border-bottom:1px solid var(--bd);color:'+dc+'">'+(diff!==null?ds+fR(diff)+'/kg':'—')+'</td>'
      +'<td style="padding:7px 10px;text-align:right;font-family:monospace;font-size:12px;font-weight:700;border-bottom:1px solid var(--bd);color:'+dc+'">'+(pct!==null?ds+pct.toFixed(1)+'%':'—')+'</td>'
      +'</tr>';
  }
  var mediaPct=somaVenda>0?((somaVenda-somaConc)/Math.max(somaVenda,somaConc)*100):0;
  var mediaValor=count>0?((somaVenda-somaConc)/count):0;
  var mc=mediaValor>0?'var(--gr)':mediaValor<0?'var(--rd)':'var(--mt)';
  var resultH='<div style="overflow-x:auto;margin-top:10px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="background:var(--pu);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">&#128373; '+c.nome+'</span>'
    +'<span style="color:var(--mt)">vs</span>'
    +'<span style="background:var(--s3);border:1px solid var(--bd);color:var(--tx);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">'+tab.nome+'</span>'
    +'</div>'
    +'<div style="display:flex;gap:10px;font-size:12px;color:var(--mt);flex-wrap:wrap">'
    +'<span>Diferença média: <strong style="color:'+mc+';font-family:monospace">'+(mediaValor>=0?'+':'')+fR(mediaValor)+'/kg</strong></span>'
    +'<span>Margem geral: <strong style="color:'+mc+';font-family:monospace">'+(mediaPct>=0?'+':'')+mediaPct.toFixed(1)+'%</strong></span>'
    +'</div></div>'
    +'<table style="width:100%;border-collapse:collapse;min-width:400px">'
    +'<thead><tr>'
    +'<th style="padding:7px 10px;text-align:left;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">Produto</th>'
    +'<th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--pu);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">'+c.nome+'</th>'
    +'<th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">'+tab.nome+'</th>'
    +'<th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">Diferença R$</th>'
    +'<th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)">Margem %</th>'
    +'</tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'</table>'
    +(count===0?'<div style="text-align:center;padding:16px;color:var(--mt);font-size:12px">Nenhum produto em comum encontrado. Edite a tabela e ajuste os nomes para fazer o match.</div>':'')
    +'</div>';
  openM('Comparação: '+c.nome+' vs '+tab.nome,
    '<div class="mf">'+resultH
    +'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Fechar</button></div>'
    +'</div>',620);
}

// ── Imprimir tabela ──
function printTab(idx){
  var t=DB.tabelas[idx];
  var cor=getTabCor(t);
  var isPadrao=t.nome.toLowerCase()==='padrao';
  var tabPad=null;for(var k=0;k<DB.tabelas.length;k++){if(DB.tabelas[k].nome.toLowerCase()==='padrao'&&DB.tabelas[k].tipo===t.tipo){tabPad=DB.tabelas[k];break;}}
  var rows='';
  for(var j=0;j<t.itens.length;j++){
    var it=t.itens[j];var p=gP(it.pId);if(!p)continue;
    var padPreco=null;
    if(tabPad&&!isPadrao){for(var k=0;k<tabPad.itens.length;k++){if(tabPad.itens[k].pId===p.id){padPreco=tabPad.itens[k].preco;break;}}}
    var showRiscado=padPreco!==null&&padPreco!==it.preco;
    var df=padPreco!==null?it.preco-padPreco:0;
    rows+='<tr>'
      +'<td>'+p.ic+' '+p.nome+'</td>'
      +'<td style="text-align:right;text-decoration:line-through;color:#999">'+(showRiscado?fR(padPreco)+'/kg':'—')+'</td>'
      +'<td style="text-align:right;font-weight:700;color:'+(showRiscado?(df>=0?'#16a34a':'#dc2626'):'#222')+'">'+fR(it.preco)+'/kg</td>'
      +'</tr>';
  }
  var badge=t.tipo==='venda'
    ?'<span class="pr-badge pr-badge-venda">Venda</span>'
    :'<span class="pr-badge pr-badge-compra">Compra</span>';
  var now=new Date().toLocaleString('pt-BR');
  var pa=document.getElementById('print-area');
  if(!pa){pa=document.createElement('div');pa.id='print-area';document.body.appendChild(pa);}
  pa.innerHTML=
    '<div class="pr-logo">'
    +'<div class="pr-logo-icon">&#9850;</div>'
    +'<div><div class="pr-logo-text">BioVale</div><div class="pr-logo-sub">Gestao de Residuos</div></div>'
    +'</div>'
    +'<div class="pr-title">'+t.nome+' '+badge+'</div>'
    +'<div class="pr-meta">Gerado em '+now+' &nbsp;|&nbsp; '+t.itens.length+' produto(s)</div>'
    +'<table>'
    +'<thead><tr><th>Produto</th><th style="text-align:right">Preco Padrao</th><th style="text-align:right">Preco Tabela</th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'</table>'
    +'<div class="pr-footer">BioVale &mdash; Tabela de Precos &mdash; '+now+'</div>';
  window.print();
}

function updTabItem(tIdx,iIdx,val){
  DB.tabelas[tIdx].itens[iIdx].preco=parseFloat(val)||0;
  go('tabelas');
}

function delTabItem(tIdx,iIdx){
  DB.tabelas[tIdx].itens.splice(iIdx,1);
  mVerTab(tIdx);
  go('tabelas');
}

function addTabItemExist(tIdx){
  var pId=parseInt(document.getElementById('vt-p').value);
  var pr=parseFloat(document.getElementById('vt-pr').value)||0;
  var t=DB.tabelas[tIdx];
  for(var i=0;i<t.itens.length;i++){if(t.itens[i].pId===pId){alert('Produto ja esta na tabela!');return;}}
  t.itens.push({pId:pId,preco:pr});
  mVerTab(tIdx);
  go('tabelas');
}

// ── Editar nome/tipo/cor da tabela ──
function mEditTab(idx){
  var t=DB.tabelas[idx];
  openM('Editar Tabela',
    '<div class="mf">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'
    +'<div class="fld"><label>Nome</label><input class="inp" id="et-n" value="'+t.nome+'"></div>'
    +'<div class="fld"><label>Tipo</label><select class="inp" id="et-t"><option value="venda"'+(t.tipo==='venda'?' selected':'')+'>Venda</option><option value="compra"'+(t.tipo==='compra'?' selected':'')+'>Compra</option></select></div>'
    +'</div>'

    +'<button class="btnO bOr" onclick="delTab('+idx+')">Excluir</button>'

    +'</div></div>',520);
}

function saveEditTab(idx){
  var n=document.getElementById('et-n').value.trim();
  if(!n){alert('Informe o nome!');return;}
  DB.tabelas[idx].nome=n;
  var novoTipo=document.getElementById('et-t').value;
  DB.tabelas[idx].tipo=novoTipo;
  DB.tabelas[idx].cor=document.getElementById('et-cor').value;
  // Se o tipo mudou, verificar pesagem ativa
  if(pesAbas.length){
    var ab=pesAbas[pesAtiva];
    if(ab.tabId==DB.tabelas[idx].id){
      var abTipoTab=ab.tipo==='Compra'?'compra':'venda';
      if(novoTipo!==abTipoTab)ab.tabId=null;
    }
  }
  closeM();go('tabelas');
}

function delTab(idx){
  var nome=DB.tabelas[idx]?DB.tabelas[idx].nome:'esta tabela';
  confirmar('Excluir tabela <b>'+nome+'</b>?<br><span style="font-size:12px;color:var(--mt)">Esta acao nao pode ser desfeita.</span>',function(){
    DB.tabelas.splice(idx,1);go('tabelas');
  });
}

  tabItens=[];

    +'<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-bottom:7px">'
    +'<select class="inp" id="nt-p">'+opts+'</select>'

    +'<button class="btn" onclick="addTI()">+</button>'
    +'</div>'
    +'<div id="nt-items"></div>'
    +'</div>'

    +'</div>',520);

function addTI(){
  var pId=parseInt(document.getElementById('nt-p').value);
  var pr=parseFloat(document.getElementById('nt-pr').value)||0;
  for(var k=0;k<tabItens.length;k++){if(tabItens[k]&&tabItens[k].pId===pId){alert('Produto ja adicionado!');return;}}
  var idx=tabItens.length;
  tabItens.push({pId:pId,preco:pr});
  var p=gP(pId);
  var row='<div id="ti-row-'+idx+'" style="display:grid;grid-template-columns:1fr 130px 36px;gap:6px;align-items:center;background:var(--grb);border-radius:6px;padding:4px 7px;margin-bottom:4px">'
    +'<span style="font-size:12px">'+p.ic+' '+p.nome+'</span>'
    +'<input class="inp" type="number" inputmode="decimal" value="'+pr+'" style="text-align:right;font-family:monospace;padding:5px 8px" onchange="tabItens['+idx+'].preco=parseFloat(this.value)||0">'
    +'<button onclick="removeTI('+idx+')" style="background:var(--rdb);border:1px solid rgba(239,68,68,.3);color:var(--rd);border-radius:6px;padding:5px 7px;font-size:14px;cursor:pointer;min-height:32px">✕</button>'
    +'</div>';
  document.getElementById('nt-items').insertAdjacentHTML('beforeend',row);
  document.getElementById('nt-pr').value='';
}

function removeTI(idx){
  tabItens[idx]=null;
  var row=document.getElementById('ti-row-'+idx);
  if(row)row.remove();
}

function saveTab(){
  var n=document.getElementById('nt-n').value.trim();
  if(!n){alert('Informe o nome!');return;}
  var valid=tabItens.filter(function(x){return x!==null;});
  var tipo=document.getElementById('nt-t').value;
  var newTab={id:nid(),nome:n,tipo:tipo,cor:document.getElementById('nt-cor').value,itens:valid};
  DB.tabelas.push(newTab);
  // Auto-selecionar na aba de pesagem ativa se o tipo bater
  if(pesAbas.length&&pgAtiva==='pesagem'){
    var ab=pesAbas[pesAtiva];
    var abTipoTab=ab.tipo==='Compra'?'compra':'venda';
    if(tipo===abTipoTab){ab.tabId=newTab.id;}
  }
  closeM();go('tabelas');
}

function togglePinVisId(inputId,btnId){
  var inp=document.getElementById(inputId);var btn=document.getElementById(btnId);
  if(!inp)return;
  if(inp.type==='password'){inp.type='text';inp.style.letterSpacing='3px';if(btn)btn.style.color='var(--gr)';}
  else{inp.type='password';inp.style.letterSpacing='6px';if(btn)btn.style.color='var(--mt)';}
}
function saveMeuPin(){
  var old=document.getElementById('mp-old').value;
  var nw=document.getElementById('mp-new').value;
  var conf=document.getElementById('mp-conf').value;
  if(old!==CU.pin){alert('PIN atual incorreto!');document.getElementById('mp-old').focus();return;}
  if(!nw||nw.length<4){alert('O novo PIN deve ter 4 digitos!');return;}
  if(nw!==conf){alert('Os PINs nao coincidem!');document.getElementById('mp-conf').focus();return;}
  // Check if new PIN is in use by another user
  for(var i=0;i<USERS.length;i++){if(USERS[i].id!==CU.id&&USERS[i].pin===nw){alert('Este PIN ja esta em uso por outro usuario!');return;}}
  // Update in USERS array and in CU
  for(var i=0;i<USERS.length;i++){if(USERS[i].id===CU.id){USERS[i].pin=nw;break;}}
  CU.pin=nw;
  closeM();
  // Brief success feedback
  var sb=document.getElementById('sbur');if(sb){var orig=sb.textContent;sb.textContent='PIN alterado!';sb.style.color='var(--gr)';setTimeout(function(){sb.textContent=orig;sb.style.color='';},2000);}
}
function toggleBlockUser(uid){
  for(var i=0;i<USERS.length;i++){if(String(USERS[i].id)===String(uid)){USERS[i].bloqueado=!USERS[i].bloqueado;break;}}
  go('usuarios');
}
function delUser(uid){
  var idx=-1;for(var i=0;i<USERS.length;i++){if(String(USERS[i].id)===String(uid)){idx=i;break;}}
  if(idx<0)return;
  var nome=USERS[idx].nome;
  confirmar('Excluir usuario <b>'+nome+'</b>?<br><span style="font-size:12px;color:var(--mt)">Esta acao nao pode ser desfeita.</span>',function(){
    for(var i=0;i<USERS.length;i++){if(String(USERS[i].id)===String(uid)){USERS.splice(i,1);break;}}
    go('usuarios');
  });
}

function saveNovaRole(){
  var n=document.getElementById('nr2-n').value.trim();if(!n){alert('Informe o nome!');return;}
  var pages=[];for(var i=0;i<ALLPAGES.length;i++){var cb=document.getElementById('rp-'+ALLPAGES[i].id);if(cb&&cb.checked)pages.push(ALLPAGES[i].id);}
  if(!pages.length){alert('Selecione ao menos uma aba!');return;}
  var id='role_'+Date.now();
  CUSTOM_ROLES.push({id:id,nome:n,pages:pages});
  PPAGES[id]=pages;PNOME[id]=n;
  closeM();go('usuarios');
}
function mEditRole(roleId){
  var r=getRoleById(roleId);
  if(!r)return;
  openM('Editar Funcao: '+r.nome,
    _buildRoleForm(r)
    +'<div class="brow">'
    +'<button class="btnO bOr" onclick="delRole(\&apos;'+roleId+'\&apos;)">&#128465; Excluir</button>'
    +'<button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn" onclick="saveEditRole(\&apos;'+roleId+'\&apos;)">Salvar</button>'
    +'</div></div>',500);
}
function saveEditRole(roleId){
  var n=document.getElementById('nr2-n').value.trim();if(!n){alert('Informe o nome!');return;}
  var pages=[];for(var i=0;i<ALLPAGES.length;i++){var cb=document.getElementById('rp-'+ALLPAGES[i].id);if(cb&&cb.checked)pages.push(ALLPAGES[i].id);}
  if(!pages.length){alert('Selecione ao menos uma aba!');return;}
  // Try base roles first
  var foundBase=false;
  for(var i=0;i<BASE_ROLES.length;i++){
    if(BASE_ROLES[i].id===roleId){BASE_ROLES[i].nome=n;BASE_ROLES[i].pages=pages;foundBase=true;break;}
  }
  if(!foundBase){
    for(var i=0;i<CUSTOM_ROLES.length;i++){
      if(CUSTOM_ROLES[i].id===roleId){CUSTOM_ROLES[i].nome=n;CUSTOM_ROLES[i].pages=pages;break;}
    }
  }
  PPAGES[roleId]=pages;PNOME[roleId]=n;
  closeM();go('usuarios');
}
function delRole(roleId){
  var inUse=false;for(var i=0;i<USERS.length;i++){if(USERS[i].perfil===roleId){inUse=true;break;}}
  if(inUse){alert('Essa funcao esta em uso. Altere os usuarios primeiro.');return;}
  var nome=getRoleName(roleId);
  confirmar('Excluir a funcao <b>'+nome+'</b>?',function(){
    for(var i=0;i<BASE_ROLES.length;i++){if(BASE_ROLES[i].id===roleId){BASE_ROLES.splice(i,1);break;}}
    for(var i=0;i<CUSTOM_ROLES.length;i++){if(CUSTOM_ROLES[i].id===roleId){CUSTOM_ROLES.splice(i,1);break;}}
    go('usuarios');
  });
}

document.addEventListener('keydown',function(e){
  if(!CFG.sistema.atalhos)return;
  if(['INPUT','TEXTAREA','SELECT'].indexOf(e.target.tagName)>=0)return;
  if(e.ctrlKey&&e.key==='k'){e.preventDefault();/* busca global placeholder */return;}
  if(!e.shiftKey)return;
  var map={D:'dashboard',P:'pesagem',X:'caixa_dia',E:'estoque',R:'revenda',F:'financeiro',A:'agenda',N:'funcionarios',C:'clientes',T:'tabelas',S:'configuracoes'};
  var k=e.key.toUpperCase();
  if(map[k]){e.preventDefault();go(map[k]);}
});
