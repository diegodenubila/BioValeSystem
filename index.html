<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>BioVale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0f1a;--s1:#111827;--s2:#1a2235;--s3:#1e2a40;--bd:#2a3a52;
--gr:#22c55e;--gr2:#16a34a;--grb:rgba(34,197,94,.1);
--bl:#3b82f6;--blb:rgba(59,130,246,.1);--or:#f59e0b;--orb:rgba(245,158,11,.1);
--rd:#ef4444;--rdb:rgba(239,68,68,.1);--pu:#a855f7;--pub:rgba(168,85,247,.1);
--tx:#f0f4ff;--mt:#7a90b0;--ft:#3a4a65;--r:10px;--r2:16px;}

/* Tema Claro */
body.tema-claro{--bg:#f0f4f8;--s1:#ffffff;--s2:#e8edf3;--s3:#dde3ec;--bd:#c8d3e0;--tx:#1a2235;--mt:#5a6a80;--ft:#b0bcc8;}
body.tema-claro ::-webkit-scrollbar-thumb{background:#b0bcc8}
body.tema-claro select option{background:#fff}

/* Tema Escuro Pro (preto/grafite) */
body.tema-escuro-pro{--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#222222;--bd:#2e2e2e;--tx:#e8e8e8;--mt:#888888;--ft:#333333;}
body.tema-escuro-pro ::-webkit-scrollbar-thumb{background:#333}
body.tema-escuro-pro select option{background:#141414}

/* Menu Superior (desktop) */
body.menu-superior #wrap{flex-direction:column}
body.menu-superior #sb{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--bd);flex-direction:row;align-items:center;padding:0 12px}
body.menu-superior .sbh{border-bottom:none;border-right:1px solid var(--bd);padding:10px 14px;flex-shrink:0}
body.menu-superior .sbn{display:flex;flex-direction:row;flex:1;padding:4px 8px;overflow-x:auto;overflow-y:hidden}
body.menu-superior .sbn::-webkit-scrollbar{display:none}
body.menu-superior .nb{margin-bottom:0;margin-right:2px;white-space:nowrap;padding:6px 10px}
body.menu-superior .sbu{border-top:none;border-left:1px solid var(--bd);padding:6px 12px;flex-shrink:0}
body.menu-superior #sb-cfg{border-top:none;border-left:1px solid var(--bd);padding:4px 8px;flex-shrink:0}
body.menu-superior #main{flex:1;overflow:hidden}
body.menu-superior #ct{flex:1;overflow-y:auto;padding:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}button{cursor:pointer}
input,select,textarea{outline:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#344560;border-radius:4px}
select option{background:var(--s1)}.H{display:none!important}
#wrap{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sb{width:210px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#topbar{display:none;height:52px;background:var(--s1);border-bottom:1px solid var(--bd);align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
#ct{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;min-height:0}
#bnn{display:none}
.sbh{padding:16px 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.sblo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gr2),var(--gr));display:flex;align-items:center;justify-content:center;font-size:16px}
.sbn{flex:1;padding:8px;overflow-y:auto;min-height:0}
.nb{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;border:none;background:transparent;color:var(--mt);font-size:12px;transition:all .15s;text-align:left;margin-bottom:1px}
.nb:hover{background:var(--s2);color:var(--tx)}.nb.on{background:var(--grb);color:var(--gr);font-weight:700}
.sbu{padding:10px 12px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.sbav{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gr2),var(--gr));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.lob{margin-left:auto;background:none;border:none;color:var(--mt);font-size:16px;padding:2px 5px;border-radius:5px}
.lob:hover{color:var(--rd)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r2);padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fc{display:flex;flex-direction:column;gap:14px}
.pl{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:3px}
.pt{font-size:20px;font-weight:700;margin-top:2px}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.stl{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.stb{width:3px;height:14px;background:var(--gr);border-radius:2px}
.stx{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tg{color:var(--gr);background:var(--grb)}.tr{color:var(--rd);background:var(--rdb)}
.tb{color:var(--bl);background:var(--blb)}.to{color:var(--or);background:var(--orb)}
.tp{color:var(--pu);background:var(--pub)}.tgr{color:var(--mt);background:var(--s3)}
.btn{background:var(--gr2);border:none;border-radius:var(--r);padding:9px 14px;color:#fff;font-size:13px;font-weight:600;min-height:36px}
.btn:hover{opacity:.85}.btn-rd{background:var(--rd)}.btn-bl{background:var(--bl)}.btn-or{background:var(--or);color:#000}
.btnO{background:transparent;border-radius:var(--r);padding:7px 12px;font-size:13px;min-height:36px}
.bOg{border:1px solid var(--gr);color:var(--gr)}.bOb{border:1px solid var(--bl);color:var(--bl)}
.bOr{border:1px solid var(--rd);color:var(--rd)}.bOgr{border:1px solid #344560;color:var(--mt)}
.bsm{padding:4px 10px;font-size:11px;font-weight:600;border:none;border-radius:6px;min-height:28px}
.bsmg{background:var(--gr2);color:#fff}.bsmr{background:var(--rdb);color:var(--rd);border:1px solid rgba(239,68,68,.3)}
.brow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inp{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:9px 11px;color:var(--tx);font-size:14px}
.inp:focus{border-color:var(--gr)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
.mbx{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r2);padding:22px;width:500px;max-width:100%;max-height:90vh;overflow-y:auto}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mtl{font-size:15px;font-weight:700}.mcl{background:none;border:none;color:var(--mt);font-size:20px;line-height:1;padding:2px 5px}
.mf{display:flex;flex-direction:column;gap:11px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabbtn{background:transparent;border:1px solid transparent;border-radius:var(--r);padding:7px 13px;font-size:12px;color:var(--mt);white-space:nowrap;min-height:36px;flex-shrink:0}
.tabbtn.on{background:var(--grb);border-color:var(--gr);color:var(--gr);font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:9px 12px;text-align:left;font-size:10px;color:var(--mt);font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--bd)}
.tbl td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--bd)}
.tbl tr:last-child td{border-bottom:none}
.bw{height:4px;background:var(--bd);border-radius:4px;margin-top:3px}
.bf{height:100%;border-radius:4px;transition:width .5s}
.al{border-radius:var(--r);padding:9px 12px;font-size:12px;line-height:1.5}
.alg{background:var(--grb);border:1px solid rgba(34,197,94,.25);color:var(--gr)}
.aly{background:var(--orb);border:1px solid rgba(245,158,11,.25);color:var(--or)}
.alb{background:var(--blb);border:1px solid rgba(59,130,246,.25);color:var(--bl)}
.alr{background:var(--rdb);border:1px solid rgba(239,68,68,.25);color:var(--rd)}
.aba-bar{display:flex;align-items:center;gap:5px;overflow-x:auto;padding-bottom:2px}
.aba-tab{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--mt);white-space:nowrap;min-height:32px;display:flex;align-items:center;gap:5px;cursor:pointer}
.aba-tab.on{background:var(--grb);border-color:var(--gr);color:var(--gr);font-weight:700}
.aba-close{margin-left:3px;font-size:14px;border:none;background:none;color:inherit;padding:0 2px;cursor:pointer;opacity:.6;line-height:1}
.aba-close:hover{opacity:1}
.add-aba{background:var(--s3);border:1px solid var(--bd);border-radius:9px;padding:6px 12px;font-size:18px;color:var(--mt);min-height:32px}
.add-aba:hover{color:var(--gr)}
.pdd{width:100%}
.pdd-trigger{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:9px 36px 9px 11px;color:var(--tx);font-size:14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s;position:relative}
.pdd-trigger:hover{border-color:var(--gr)}
.pdd-trigger.open{border-color:var(--gr);border-bottom-left-radius:0;border-bottom-right-radius:0}
.pdd-trigger .pdd-ic{font-size:18px;flex-shrink:0}
.pdd-trigger .pdd-lbl{flex:1;font-weight:500}
.pdd-trigger .pdd-arr{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mt);transition:transform .2s}
.pdd-trigger.open .pdd-arr{transform:translateY(-50%) rotate(180deg)}
.pdd-panel{background:var(--s2);border:1px solid var(--gr);border-top:none;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);overflow:hidden;display:none}
.pdd-panel.open{display:block}
.pdd-search{padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--bg)}
.pdd-search input{width:100%;background:transparent;border:none;color:var(--tx);font-size:13px;outline:none;padding:2px 0}
.pdd-search input::placeholder{color:var(--mt)}
.pdd-list{max-height:280px;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.prod-card{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:all .15s}
.prod-card:hover{background:var(--s3);border-color:var(--gr)}
.prod-card:active{transform:scale(.98)}
.cb{display:grid;grid-template-columns:1fr 340px;gap:14px}
.pgto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgto-itm{background:var(--s2);border:2px solid var(--bd);border-radius:var(--r);padding:10px 8px;text-align:center;cursor:pointer}
.pgto-itm .pi-ic{font-size:18px;margin-bottom:3px}
.pgto-itm .pi-lb{font-size:10px;color:var(--mt);text-transform:uppercase}
.pgto-itm input{width:100%;background:transparent;border:none;color:var(--gr);font-size:15px;font-weight:700;text-align:center;padding:3px 0;margin-top:3px}
.pgto-itm input:focus{outline:none}
#ls{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 50%,rgba(34,197,94,.06),transparent 55%),var(--bg);padding:14px}
.lbox{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:32px 28px;width:360px;max-width:100%;text-align:center}
.llogo{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,var(--gr2),var(--gr));display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.ltit{font-size:22px;font-weight:700;margin-bottom:4px}.lsub{font-size:13px;color:var(--mt);margin-bottom:20px}
.lu{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;text-align:left;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;margin-bottom:7px;width:100%}
.lu:hover,.lu.sel{border-color:var(--gr);background:rgba(34,197,94,.05)}
.lav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.pin-a{margin-top:10px}
.pin-a input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:10px;color:var(--tx);font-size:20px;text-align:center;letter-spacing:10px;margin-bottom:7px}
.pin-a input:focus{border-color:var(--gr)}
.lbtn{width:100%;background:var(--gr2);border:none;border-radius:var(--r);padding:11px;color:#fff;font-size:14px;font-weight:600}
.perr{font-size:11px;color:var(--rd);min-height:16px;margin-bottom:5px}
@media(max-width:768px){
#sb{position:fixed;top:0;left:0;height:100vh;z-index:50;transform:translateX(-100%);transition:transform .25s}
#sb.open{transform:translateX(0)}#topbar{display:flex}
#bnn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);z-index:40;padding:5px 4px;padding-bottom:calc(5px + env(safe-area-inset-bottom, 0px))}
.bnb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--mt);font-size:10px;padding:5px 2px;border-radius:7px;min-height:46px}
.bnb.on{color:var(--gr)}.bnb .bni{font-size:19px}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mt);margin-bottom:10px;flex-wrap:wrap}
.breadcrumb span{color:var(--tx);font-weight:600}
.breadcrumb .sep{font-size:10px}
.fin-periodo button{border:1px solid var(--bd);background:transparent;color:var(--mt);border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;margin-right:5px;margin-bottom:8px}
.fin-periodo button.on{border-color:var(--gr);background:var(--grb);color:var(--gr);font-weight:700}
.alerta-min{background:var(--rdb);border:1px solid rgba(239,68,68,.35);border-radius:var(--r);padding:9px 13px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--rd);margin-bottom:4px}
.alerta-min .am-ic{font-size:18px;flex-shrink:0}
#ct{padding:12px;padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px))}
.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.cb{grid-template-columns:1fr}
.tabbtn{padding:7px 11px;font-size:11px;min-height:34px}
.pgto-itm{min-height:80px}}
@media print{
  body*{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:fixed;top:0;left:0;width:100%;background:#fff;color:#000;padding:32px 40px;font-family:'Segoe UI',Arial,sans-serif}
  #print-area .pr-logo{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #16a34a}
  #print-area .pr-logo-icon{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#16a34a,#22c55e);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
  #print-area .pr-logo-text{font-size:22px;font-weight:700;color:#111}
  #print-area .pr-logo-sub{font-size:11px;color:#666;letter-spacing:2px;text-transform:uppercase}
  #print-area .pr-title{font-size:18px;font-weight:700;margin-bottom:4px;color:#111}
  #print-area .pr-meta{font-size:12px;color:#666;margin-bottom:20px}
  #print-area table{width:100%;border-collapse:collapse;margin-top:8px}
  #print-area table th{background:#f0f9f0;color:#16a34a;padding:9px 14px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #16a34a}
  #print-area table td{padding:9px 14px;font-size:13px;border-bottom:1px solid #e5e7eb;color:#222}
  #print-area table tr:last-child td{border-bottom:none}
  #print-area .pr-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}
  #print-area .pr-badge-venda{color:#2563eb;border-color:#2563eb;background:#eff6ff}
  #print-area .pr-badge-compra{color:#d97706;border-color:#d97706;background:#fffbeb}
  #print-area .pr-footer{margin-top:24px;font-size:11px;color:#999;text-align:right;border-top:1px solid #e5e7eb;padding-top:10px}
}

<meta name="theme-color" content="#16a34a">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
#bv-sync-badge{position:fixed;bottom:12px;right:12px;z-index:9999;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;transition:all .3s;pointer-events:none;backdrop-filter:blur(6px)}
#bv-sync-badge.idle{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#22c55e}
#bv-sync-badge.saving{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:#3b82f6}
#bv-sync-badge.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#ef4444}
#bv-sync-badge.local{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:#f59e0b}
#bv-sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
#bv-sync-badge.saving #bv-sync-dot{animation:bv-pulse .8s ease-in-out infinite}
@keyframes bv-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:768px){#bv-sync-badge{bottom:66px}}
</style>
</head><body>
<div id="bv-sync-badge" class="idle"><div id="bv-sync-dot"></div><span id="bv-sync-txt">Nuvem ativa</span></div>

function getPreco(prod,tipo,tabId){
  if(!prod)return 0;
  if(tipo==='Doacao')return 0;
  // Primeiro: verificar se há tabela selecionada com preço definido para o produto
  if(tabId){for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){var t=DB.tabelas[i];for(var j=0;j<t.itens.length;j++){if(t.itens[j].pId===prod.id)return t.itens[j].preco;}}}}
  // Fallback: preço padrão do produto
  if(tipo==='Compra')return prod.vC||prod.vV;
  return prod.vV;
}

function buildBottomNav(){
  var r=getRoleById(CU.perfil);
  var perms=r?r.pages:(PPAGES[CU.perfil]||[]);
  // Paginas fixas para a bottom bar: 2 + botao+ + 2
  // Ordem: Dashboard, Pesagem | + | Revenda, Financeiro
  var desired=['dashboard','pesagem','revenda','financeiro'];
  var pages=[];
  for(var i=0;i<desired.length;i++){
    if(perms.indexOf(desired[i])>=0){
      for(var j=0;j<ALLPAGES.length;j++){
        if(ALLPAGES[j].id===desired[i]){pages.push(ALLPAGES[j]);break;}
      }
    }
  }
  // Fallback: se perfil nao tiver todas, preenche com as disponiveis
  if(pages.length<2){
    pages=[];var c=0;
    for(var i=0;i<ALLPAGES.length;i++){if(perms.indexOf(ALLPAGES[i].id)>=0&&c<4){pages.push(ALLPAGES[i]);c++;}}
  }
  var mid=Math.floor(pages.length/2);
  var h='';
  for(var i=0;i<pages.length;i++){
    var p=pages[i];
    h+='<button class="bnb" id="bn-'+p.id+'" onclick="go(\&apos;'+p.id+'\&apos;)">'
      +'<span class="bni">'+p.icon+'</span>'+p.label+'</button>';

// Cria a tabela se não existir (usa upsert para ser idempotente)
function _sbEnsureTable(){
  if(!_sbReady||!_sbClient)return;
  // Faz um select silencioso — se a tabela não existir, cria via SQL pelo Supabase
  // (o usuário deve criar a tabela manualmente caso apareça erro; ver instrução no badge)
  _sbClient.from('biovale_dados').select('chave').limit(1).then(function(r){
    if(r.error){
      // Tabela não existe ainda — informa usuário
      _syncBadge('error','Criar tabela no Supabase');
      console.warn('BioVale Supabase: crie a tabela "biovale_dados" com colunas: chave (text, PK), valor (text), atualizado_em (timestamptz). Erro:', r.error.message);
    } else {
      _syncBadge('idle','Nuvem ativa');
    }
  });
}

// Salva um par chave/valor na tabela biovale_dados
function _sbSet(chave, valor, onDone){
  if(!_sbReady||!_sbClient){if(onDone)onDone(false);return;}
  _sbClient.from('biovale_dados').upsert({chave:chave, valor: JSON.stringify(valor), atualizado_em: new Date().toISOString()}, {onConflict:'chave'}).then(function(r){
    if(r.error){console.warn('BioVale SB save error:',r.error.message);if(onDone)onDone(false);}
    else{if(onDone)onDone(true);}
  });
}

// Lê um valor da tabela biovale_dados
function _sbGet(chave, onDone){
  if(!_sbReady||!_sbClient){if(onDone)onDone(null);return;}
  _sbClient.from('biovale_dados').select('valor').eq('chave',chave).maybeSingle().then(function(r){
    if(r.error||!r.data){if(onDone)onDone(null);}
    else{try{if(onDone)onDone(JSON.parse(r.data.valor));}catch(e){if(onDone)onDone(null);}}
  });
}

  }
})();

var _dbSaveTimer=null;
function saveDB(){
  try{
    var snap={
      caixaDia:DB.caixaDia,caixaOntem:DB.caixaOntem,caixasHist:DB.caixasHist,
      atendNum:DB.atendNum,produtos:DB.produtos,movs:DB.movs,contas:DB.contas,
      revenda:DB.revenda,revendaCats:DB.revendaCats,revendaStates:DB.revendaStates,
      entradas:DB.entradas,atendHistLS:atendHist,pesagensEmAberto:DB.pesagensEmAberto,
      transf:DB.transf,coletas:DB.coletas,funcs:DB.funcs,clientes:DB.clientes,
      tabelas:DB.tabelas,contasFixas:DB.contasFixas,filtrosMat:DB.filtrosMat
    };
    // 1. Salva local como fallback imediato
    localStorage.setItem('bv_db',JSON.stringify(snap));
    // 2. Sincroniza na nuvem
    if(_sbReady){
      _syncBadge('saving','Salvando…');
      _sbSet('bv_db', snap, function(ok){
        if(ok) _syncBadge('idle','Nuvem ativa');
        else   _syncBadge('error','Erro na nuvem');
      });
    }
  }catch(e){}
}
function loadDB(){
  // Carrega imediatamente do localStorage (síncrono) para não travar o boot
  var localOk=false;
  try{
    var raw=localStorage.getItem('bv_db');
    if(raw){var s=JSON.parse(raw);_applySnap(s);localOk=true;}
  }catch(e){}
  // Em seguida busca da nuvem de forma assíncrona e sobrescreve se mais recente
  if(_sbReady){
    _syncBadge('saving','Carregando nuvem…');
    _sbGet('bv_db', function(s){
      if(s){
        _applySnap(s);
        // Atualiza também o localStorage com dado da nuvem
        try{localStorage.setItem('bv_db',JSON.stringify(s));}catch(e){}
        _syncBadge('idle','Nuvem ativa');
        // Re-renderiza a tela atual se o usuário já estiver logado
        if(pgAtiva){go(pgAtiva);}
      } else {
        _syncBadge(localOk?'local':'idle', localOk?'Só local':'Nuvem ativa');
      }
    });
  }
  return localOk;
}
function _applySnap(s){
  if(!s)return;
  if(s.caixaDia!==undefined)DB.caixaDia=s.caixaDia;
  if(s.caixaOntem!==undefined)DB.caixaOntem=s.caixaOntem;
  if(s.caixasHist)DB.caixasHist=s.caixasHist;
  if(s.atendNum)DB.atendNum=s.atendNum;
  if(s.produtos&&s.produtos.length)DB.produtos=s.produtos;
  if(s.movs)DB.movs=s.movs;
  if(s.contas&&s.contas.length)DB.contas=s.contas;
  if(s.revenda)DB.revenda=s.revenda;
  if(s.revendaCats&&s.revendaCats.length)DB.revendaCats=s.revendaCats;
  if(s.revendaStates&&s.revendaStates.length)DB.revendaStates=s.revendaStates;
  if(s.entradas)DB.entradas=s.entradas;
  if(s.atendHistLS)atendHist=s.atendHistLS;
  if(s.pesagensEmAberto)DB.pesagensEmAberto=s.pesagensEmAberto;
  if(s.transf)DB.transf=s.transf;
  if(s.coletas)DB.coletas=s.coletas;
  if(s.funcs)DB.funcs=s.funcs;
  if(s.clientes)DB.clientes=s.clientes;
  if(s.tabelas)DB.tabelas=s.tabelas;
  if(s.contasFixas)DB.contasFixas=s.contasFixas;
  if(s.filtrosMat&&s.filtrosMat.length)DB.filtrosMat=s.filtrosMat;
}

function setPesTipo(t){
  var ab=pesAbas[pesAtiva];

  if(ab.tabId){var tipoTab=t==='Compra'?'compra':'venda';var found=false;for(var i=0;i<DB.tabelas.length;i++){if(DB.tabelas[i].id==ab.tabId&&DB.tabelas[i].tipo===tipoTab){found=true;break;}}if(!found)ab.tabId=null;}

function reaplicarTabela(){
  var ab=pesAbas[pesAtiva];
  if(!ab.tabId||!ab.itens.length)return;
  var tabNome='esta tabela';

  var warn=(ab.tipo==='Venda'&&prod.est===0)?'<div class="al alr" style="margin-bottom:4px">Estoque zerado. Sera possivel transferir.</div>':'';
  openM(prod.ic+' '+prod.nome,'<div class="mf">'+warn
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'
    +'<div class="fld"><label>Peso kg</label><input class="inp" type="number" inputmode="decimal" id="ai-kg" placeholder="0.000" step="0.001" style="font-size:18px;text-align:center;font-family:monospace"></div>'
    +'<div class="fld"><label>Preco R$/kg</label><input class="inp" type="number" inputmode="decimal" id="ai-pr" value="'+preco+'" step="0.01" style="font-size:18px;text-align:center;font-family:monospace"></div></div>'
    +'<div class="fld"><label>Tara (kg)</label><input class="inp" type="number" inputmode="decimal" id="ai-tara" placeholder="0.000" step="0.001" value="0" style="font-family:monospace"></div>'
    +'<div class="fld"><label>Desconto de Impureza</label>'
    +'<div style="display:grid;grid-template-columns:1fr auto;gap:6px">'
    +'<input class="inp" type="number" inputmode="decimal" id="ai-desc" placeholder="0" step="0.001" value="0" style="font-family:monospace">'
    +'<select class="inp" id="ai-desc-tipo" style="width:70px;padding:9px 6px">'
    +'<option value="kg">kg</option>'
    +'<option value="%">%</option>'
    +'</select></div></div>'
    +'<div id="ai-preview" style="background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:10px 13px;font-size:12px;color:var(--mt)">'
    +'<span>Peso Liquido = </span><strong id="ai-liq-txt" style="color:var(--gr);font-family:monospace">0,000 kg</strong>'
    +'</div>'
    +'<div class="al alg" style="display:flex;justify-content:space-between"><span>Total estimado</span><strong id="ai-tv" style="font-family:monospace">'+fR(0)+'</strong></div>'
    +'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn" onclick="confAddP('+prodId+')">+ Adicionar</button></div></div>',460);
  setTimeout(function(){
    var kg=document.getElementById('ai-kg');
    var pr=document.getElementById('ai-pr');
    var tara=document.getElementById('ai-tara');
    var desc=document.getElementById('ai-desc');
    var descTipo=document.getElementById('ai-desc-tipo');
    var tv=document.getElementById('ai-tv');
    var liqTxt=document.getElementById('ai-liq-txt');
    function calcLiq(){
      var p=parseFloat(kg&&kg.value)||0;
      var t=parseFloat(tara&&tara.value)||0;
      var d=parseFloat(desc&&desc.value)||0;
      var tipo=descTipo?descTipo.value:'kg';
      var descKg=tipo==='%'?+(p*d/100).toFixed(3):d;
      var liq=Math.max(0,+(p-t-descKg).toFixed(3));
      var pre=parseFloat(pr&&pr.value)||0;
      if(liqTxt)liqTxt.textContent=fKg(liq)+' kg';
      if(tv)tv.textContent=fR(liq*pre);
      return liq;
    }
    if(kg){kg.focus();kg.addEventListener('input',calcLiq);}
    if(pr)pr.addEventListener('input',calcLiq);
    if(tara)tara.addEventListener('input',calcLiq);
    if(desc)desc.addEventListener('input',calcLiq);
    if(descTipo)descTipo.addEventListener('change',calcLiq);
  },80);
}

function confAddP(prodId){
  var ab=pesAbas[pesAtiva];var prod=gP(prodId);
  var peso=parseFloat(document.getElementById('ai-kg').value)||0;
  var preco=parseFloat(document.getElementById('ai-pr').value)||0;
  var tara=parseFloat(document.getElementById('ai-tara')?document.getElementById('ai-tara').value:0)||0;
  var descVal=parseFloat(document.getElementById('ai-desc')?document.getElementById('ai-desc').value:0)||0;
  var descTipoEl=document.getElementById('ai-desc-tipo');
  var descTipo=descTipoEl?descTipoEl.value:'kg';
  var descKg=descTipo==='%'?+(peso*descVal/100).toFixed(3):descVal;
  var pesoLiquido=Math.max(0,+(peso-tara-descKg).toFixed(3));
  if(peso<=0){alert('Informe o peso!');return;}
  if(pesoLiquido<=0){alert('O Peso Liquido e zero ou negativo. Verifique Tara e Desconto.');return;}
  if(ab.tipo==='Venda'&&prod.est<pesoLiquido){
    var falta=+(pesoLiquido-prod.est).toFixed(2);closeM();
    var opts='';for(var i=0;i<DB.produtos.length;i++){var p=DB.produtos[i];if(p.id!==prodId&&p.est>0)opts+='<option value="'+p.nome+'">'+p.ic+' '+p.nome+' ('+fKg(p.est)+'kg)</option>';}
    openM('Estoque Insuficiente','<div class="mf"><div class="al aly">Faltam '+falta+'kg de '+prod.nome+'. Transferir de qual material?</div>'
      +'<div class="fld"><label>Material de origem</label><select class="inp" id="ori-d">'+opts+'</select></div>'
      +'<div class="fld"><label>Peso a transferir kg</label><input class="inp" type="number" inputmode="decimal" id="ori-p" value="'+falta+'" step="0.01"></div>'
      +'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
      +'<button class="btn btn-or" onclick="confTransfP('+prodId+','+pesoLiquido+','+preco+')">Transferir e adicionar</button></div></div>',460);
    return;
  }
  var tabN='Padrao';if(ab.tabId){for(var i=0;i<DB.tabelas.length;i++){if(DB.tabelas[i].id==ab.tabId){tabN=DB.tabelas[i].nome;break;}}}
  ab.itens.push({prodId:prodId,ic:prod.ic,nome:prod.nome,peso:peso,tara:tara,desconto:descVal,descontoTipo:descTipo,pesoLiquido:pesoLiquido,preco:preco,tipo:ab.tipo,uni:false,tabN:tabN});
  closeM();savePesState();renderPesagem();
}
function confTransfP(prodId,peso,preco){
  var oriNome=document.getElementById('ori-d').value,oriPeso=parseFloat(document.getElementById('ori-p').value)||0;
  if(!oriNome||!oriPeso){alert('Preencha!');return;}
  var pOri=null,pDest=gP(prodId);
  for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].nome===oriNome){pOri=DB.produtos[i];break;}}
  if(pOri)pOri.est=+(pOri.est-oriPeso).toFixed(2);if(pDest)pDest.est=+(pDest.est+oriPeso).toFixed(2);
  DB.transf.unshift({id:nid(),data:hj(),de:oriNome,para:pDest.nome,pS:oriPeso,pE:oriPeso,obs:'Auto pesagem'});
  var ab=pesAbas[pesAtiva];var tabN='Padrao';
  if(ab.tabId){for(var i=0;i<DB.tabelas.length;i++){if(DB.tabelas[i].id==ab.tabId){tabN=DB.tabelas[i].nome;break;}}}
  ab.itens.push({prodId:prodId,ic:pDest.ic,nome:pDest.nome,peso:peso,preco:preco,tipo:ab.tipo,uni:false,tabN:tabN});
  closeM();savePesState();renderPesagem();
}

var _blocoSel={};
function selBlocoForma(prefix,tipo,tot){
  _blocoSel[prefix]=tipo;
  var ids=['din','pix','crt','misto'];
  for(var i=0;i<ids.length;i++){
    var b=document.getElementById(prefix+'sb-'+ids[i]);
    if(b){b.style.borderColor='var(--bd)';b.style.background='var(--bg)';}
  }
  var sel=document.getElementById(prefix+'sb-'+tipo);
  if(sel){sel.style.borderColor='var(--gr)';sel.style.background='rgba(34,197,94,.12)';}
  // ocultar tudo primeiro
  var bancoRow=document.getElementById(prefix+'banco-row');if(bancoRow)bancoRow.style.display='none';
  var simplesOk=document.getElementById(prefix+'simples-ok');if(simplesOk)simplesOk.style.display='none';
  var mistoArea=document.getElementById(prefix+'misto-area');if(mistoArea)mistoArea.style.display='none';
  if(tipo==='misto'){
    if(mistoArea){mistoArea.style.display='flex';}
    var mDin=document.getElementById(prefix+'m-din');if(mDin)mDin.value=tot;
    var mOut=document.getElementById(prefix+'m-out');if(mOut)mOut.value=0;
    calcBloco(prefix,tot);
  } else {
    if(tipo==='pix'||tipo==='crt'){if(bancoRow)bancoRow.style.display='flex';}
    var vlbl={din:'Dinheiro — Caixa',pix:'Pix',crt:'Cartao'};
    var lbl=document.getElementById(prefix+'simples-lbl');if(lbl)lbl.textContent=vlbl[tipo]||tipo;
    var val=document.getElementById(prefix+'simples-val');if(val)val.textContent=fR(tot);
    if(simplesOk)simplesOk.style.display='block';
    // Auto-seleciona conta: Dinheiro → Caixa; Pix/Cartao → primeira conta bancária
    var bancSel=document.getElementById(prefix+'banco-sel');
    if(bancSel){
      if(tipo==='din'){
        for(var _i=0;_i<DB.contas.length;_i++){if(DB.contas[_i].tipo==='Dinheiro'){bancSel.value=DB.contas[_i].nome;break;}}
      } else {
        for(var _i=0;_i<DB.contas.length;_i++){if(DB.contas[_i].tipo!=='Dinheiro'){bancSel.value=DB.contas[_i].nome;break;}}
      }
    }
  }
}
function calcBloco(prefix,tot){
  var d=parseFloat(document.getElementById(prefix+'m-din')?document.getElementById(prefix+'m-din').value:0)||0;
  var o=parseFloat(document.getElementById(prefix+'m-out')?document.getElementById(prefix+'m-out').value:0)||0;
  var pg=+(d+o).toFixed(2);var df=+(pg-tot).toFixed(2);
  var el=document.getElementById(prefix+'misto-st');if(!el)return;
  if(pg===0){el.innerHTML='';return;}
  if(Math.abs(df)<0.01)el.innerHTML='<div class="al alg" style="margin-top:4px">&#10003; Valor correto!</div>';
  else if(df<0)el.innerHTML='<div class="al alr" style="margin-top:4px">Falta '+fR(Math.abs(df))+'</div>';
  else el.innerHTML='<div class="al aly" style="margin-top:4px">Troco: '+fR(df)+'</div>';
}
function getBlocoMethods(prefix,total){
  if(total<=0)return[];
  var tipo=_blocoSel[prefix];if(!tipo)return[];
  var labels={din:'Dinheiro',pix:'Pix',crt:'Cartao'};
  if(tipo==='misto'){
    var res=[];
    var d=parseFloat(document.getElementById(prefix+'m-din')?document.getElementById(prefix+'m-din').value:0)||0;
    var o=parseFloat(document.getElementById(prefix+'m-out')?document.getElementById(prefix+'m-out').value:0)||0;
    if(d>0)res.push({id:'din',label:'Dinheiro',valor:d,conta:'Caixa'});
    if(o>0){
      var tEl=document.getElementById(prefix+'m-tipo');var t=tEl?tEl.value:'pix';
      var bEl=document.getElementById(prefix+'m-banco');var conta=bEl?bEl.value:'';
      res.push({id:t,label:labels[t]||t,valor:o,conta:conta});
    }
    return res;
  }
  var conta='Caixa';
  if(tipo==='pix'||tipo==='crt'){var el=document.getElementById(prefix+'banco-sel');conta=el?el.value:'';}
  return [{id:tipo,label:labels[tipo]||tipo,valor:total,conta:conta}];
}
function getPgMethods(){
  var ab=pesAbas[pesAtiva];var valReceb=0,valPagei=0;
  for(var i=0;i<ab.itens.length;i++){
    var it=ab.itens[i];
    var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;
    var v=it.uni?it.preco:pesoEf*it.preco;
    if(it.tipo==='Venda')valReceb+=v;else valPagei+=v;
  }
  valReceb=+valReceb.toFixed(2);valPagei=+valPagei.toFixed(2);
  var recMethods=getBlocoMethods('rec-',valReceb);
  var pagMethods=getBlocoMethods('pag-',valPagei);
  return {recMethods:recMethods,pagMethods:pagMethods,valReceb:valReceb,valPagei:valPagei};
}

function confirmarFin(){
  var ab=pesAbas[pesAtiva];
  var pg=getPgMethods();
  var recMethods=pg.recMethods;var pagMethods=pg.pagMethods;
  var valReceb=pg.valReceb;var valPagei=pg.valPagei;
  // Validacao: bloco A Receber precisa estar preenchido se ha venda
  if(valReceb>0&&!recMethods.length){alert('Selecione a forma de recebimento (Venda)!');return;}
  // Validacao: bloco A Pagar precisa estar preenchido se ha compra
  if(valPagei>0&&!pagMethods.length){alert('Selecione a forma de pagamento (Compra)!');return;}
  // Validacao dos valores dos blocos
  if(recMethods.length){var somaRec=0;for(var i=0;i<recMethods.length;i++)somaRec=+(somaRec+recMethods[i].valor).toFixed(2);if(Math.abs(somaRec-valReceb)>0.01){confirmar('Recebimento ('+fR(somaRec)+') difere da venda ('+fR(valReceb)+').<br>Deseja confirmar mesmo assim?',function(){_finalizarPesagem();});return;}}
  if(pagMethods.length){var somaPag=0;for(var i=0;i<pagMethods.length;i++)somaPag=+(somaPag+pagMethods[i].valor).toFixed(2);if(Math.abs(somaPag-valPagei)>0.01){confirmar('Pagamento ('+fR(somaPag)+') difere da compra ('+fR(valPagei)+').<br>Deseja confirmar mesmo assim?',function(){_finalizarPesagem();});return;}}
  _finalizarPesagem();
}
function _finalizarPesagem(){
  var ab=pesAbas[pesAtiva];
  var pg=getPgMethods();
  var recMethods=pg.recMethods;var pagMethods=pg.pagMethods;
  var valReceb=pg.valReceb;var valPagei=pg.valPagei;
  var obs=document.getElementById('fin-obs')?document.getElementById('fin-obs').value||'':'';
  var num=ab.numAtend||gerarNum();ab.numAtend=num;ab.obs=obs;
  var totLiq2=+(valReceb-valPagei).toFixed(2);
  var vendaTotal=valReceb;var compraTotal=valPagei;
  // Apply stock changes
  for(var i=0;i<ab.itens.length;i++){
    var it=ab.itens[i];
    if(it.uni){
      for(var j=0;j<DB.revenda.length;j++){
        if(DB.revenda[j].id===it.uid){
          DB.revenda[j].status='Vendido';
          var estPId=DB.revenda[j].estProdId;
          if(estPId){var ep=gP(estPId);if(ep)ep.est=+(ep.est-DB.revenda[j].peso).toFixed(2);}
          break;
        }
      }
    }else if(it.tipo==='Venda'){
      var p=gP(it.prodId);
      var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;
      if(p)p.est=+(p.est-pesoEf).toFixed(2);
    }else if(it.tipo==='Compra'){
      var p=gP(it.prodId);
      var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;
      if(p)p.est=+(p.est+pesoEf).toFixed(2);
    }else{
      var p=gP(it.prodId);
      var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;
      if(p)p.est=+(p.est+pesoEf).toFixed(2);
      DB.entradas.unshift({id:nid(),data:hj(),forn:obs||'Doacao',tipo:'Doacao',pId:it.prodId,peso:pesoEf,vKg:0,total:0,status:'Triagem'});
    }
  }
  // Registrar movimentacoes financeiras separadas por bloco
  // Bloco Recebimento (Venda) — sempre entrada
  for(var i=0;i<recMethods.length;i++){
    var m=recMethods[i];
    DB.movs.unshift({id:nid(),data:hj(),desc:'Recebimento Venda #'+num+' ('+m.label+')',tipo:'entrada',cat:'Venda',valor:m.valor,conta:m.conta});
    for(var j=0;j<DB.contas.length;j++){if(DB.contas[j].nome===m.conta){DB.contas[j].saldo=+(DB.contas[j].saldo+m.valor).toFixed(2);break;}}
  }
  // Bloco Pagamento (Compra) — sempre saida
  for(var i=0;i<pagMethods.length;i++){
    var m=pagMethods[i];
    DB.movs.unshift({id:nid(),data:hj(),desc:'Pagamento Compra #'+num+' ('+m.label+')',tipo:'saida',cat:'Compra',valor:m.valor,conta:m.conta});
    for(var j=0;j<DB.contas.length;j++){if(DB.contas[j].nome===m.conta){DB.contas[j].saldo=+(DB.contas[j].saldo-m.valor).toFixed(2);break;}}
  }
  // Combinar todos os methods para snapshot do historico
  var allMethods=recMethods.concat(pagMethods);
  if(DB.caixaDia){if(!DB.caixaDia.movimentos)DB.caixaDia.movimentos=[];DB.caixaDia.movimentos.unshift({num:num,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),itens:ab.itens.length,total:totLiq2,venda:vendaTotal,compra:compraTotal,recMethods:recMethods,pagMethods:pagMethods,methods:allMethods,obs:obs,itensList:ab.itens.slice(),label:ab.label,tipo:ab.tipo,cliId:ab.cliId,tabId:ab.tabId});}
  atendHist.unshift({id:nid(),label:ab.label,tipo:ab.tipo,itens:ab.itens.slice(),num:num,total:totLiq2,recMethods:recMethods,pagMethods:pagMethods,methods:allMethods,obs:obs,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  closeM();pesAbas.splice(pesAtiva,1);
  if(!pesAbas.length){clearPesState();novaPesAba();}else{pesAtiva=Math.min(pesAtiva,pesAbas.length-1);savePesState();renderPesagem();}
  autoSave();
}

function suspenderAtendimento(){
  var ab=pesAbas[pesAtiva];
  if(!ab||!ab.itens.length){alert('Adicione itens antes de suspender!');return;}
  var obs=document.getElementById('fin-obs')?document.getElementById('fin-obs').value||'':'';
  var num=ab.numAtend||gerarNum();
  ab.numAtend=num;ab.obs=obs;
  var valTotal=0;
  for(var i=0;i<ab.itens.length;i++){var it=ab.itens[i];valTotal+=it.uni?it.preco:(it.pesoLiquido!=null?it.pesoLiquido:it.peso)*it.preco;}
  valTotal=+valTotal.toFixed(2);
  for(var i=0;i<ab.itens.length;i++){
    var it=ab.itens[i];
    if(it.uni){for(var j=0;j<DB.revenda.length;j++){if(DB.revenda[j].id===it.uid){DB.revenda[j].status='Reservado';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;if(p)p.est=+(p.est-pesoEf).toFixed(2);}

function reabrirPendencia(pendId){
  if(!DB.pesagensEmAberto)DB.pesagensEmAberto=[];
  var pend=null,pendIdx=-1;
  for(var i=0;i<DB.pesagensEmAberto.length;i++){if(String(DB.pesagensEmAberto[i].id)===String(pendId)){pend=DB.pesagensEmAberto[i];pendIdx=i;break;}}
  if(!pend){alert('Pendencia nao encontrada!');return;}
  for(var i=0;i<pend.itens.length;i++){
    var it=pend.itens[i];
    if(it.uni){for(var j=0;j<DB.revenda.length;j++){if(DB.revenda[j].id===it.uid){DB.revenda[j].status='Disponivel';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;if(p)p.est=+(p.est+pesoEf).toFixed(2);}
    else if(it.tipo==='Compra'){var p=gP(it.prodId);var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;if(p)p.est=+(p.est-pesoEf).toFixed(2);}
  }
  DB.pesagensEmAberto.splice(pendIdx,1);

    openM('Caixa Fechado','<div class="mf"><div class="al aly">Abra o caixa do dia antes de reabrir atendimentos.</div><div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button><button class="btn btn-bl" onclick="closeM();go(&apos;caixa_dia&apos;)">Ir para Caixa</button></div></div>');
    for(var i=0;i<pend.itens.length;i++){var it=pend.itens[i];if(it.uni){for(var j=0;j<DB.revenda.length;j++){if(DB.revenda[j].id===it.uid){DB.revenda[j].status='Reservado';break;}}}else if(it.tipo==='Venda'){var p=gP(it.prodId);var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;if(p)p.est=+(p.est-pesoEf).toFixed(2);}else if(it.tipo==='Compra'){var p=gP(it.prodId);var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;if(p)p.est=+(p.est+pesoEf).toFixed(2);}}
    DB.pesagensEmAberto.splice(pendIdx,0,pend);autoSave();return;
  }
  pesAbas.push({id:nid(),label:'Pen.#'+pend.num,tipo:pend.tipo,cliId:pend.cliId,tabId:pend.tabId,itens:pend.itens.slice(),obs:pend.obs||'',showUnit:false,numAtend:pend.num,nfNum:pend.nfNum||''});

function confirmarLiquidacao(pendId,valReceb,valPagei){
  if(!DB.pesagensEmAberto)DB.pesagensEmAberto=[];
  var pend=null,pendIdx=-1;
  for(var i=0;i<DB.pesagensEmAberto.length;i++){if(String(DB.pesagensEmAberto[i].id)===String(pendId)){pend=DB.pesagensEmAberto[i];pendIdx=i;break;}}
  if(!pend)return;
  var conta=document.getElementById('liq-conta')?document.getElementById('liq-conta').value:'Caixa';
  var forma=document.getElementById('liq-forma-val')?document.getElementById('liq-forma-val').value:'Dinheiro';
  var num=pend.num;
  var totLiq=+(valReceb-valPagei).toFixed(2);
  if(valReceb>0){DB.movs.unshift({id:nid(),data:hj(),desc:'Liquidacao Venda #'+num+' ('+forma+')',tipo:'entrada',cat:'Venda',valor:valReceb,conta:conta});for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome===conta){DB.contas[i].saldo=+(DB.contas[i].saldo+valReceb).toFixed(2);break;}}}
  if(valPagei>0){DB.movs.unshift({id:nid(),data:hj(),desc:'Liquidacao Compra #'+num+' ('+forma+')',tipo:'saida',cat:'Compra',valor:valPagei,conta:conta});for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome===conta){DB.contas[i].saldo=+(DB.contas[i].saldo-valPagei).toFixed(2);break;}}}
  if(DB.caixaDia){if(!DB.caixaDia.movimentos)DB.caixaDia.movimentos=[];DB.caixaDia.movimentos.unshift({num:num,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),itens:pend.itens.length,total:totLiq,venda:valReceb,compra:valPagei,methods:[{label:forma,valor:Math.abs(totLiq),conta:conta}],obs:pend.obs,itensList:pend.itens.slice(),label:pend.label,tipo:pend.tipo,cliId:pend.cliId,tabId:pend.tabId,liquidadoPendencia:true});}
  atendHist.unshift({id:nid(),label:pend.label,tipo:pend.tipo,itens:pend.itens.slice(),num:num,total:totLiq,methods:[{label:forma,valor:Math.abs(totLiq),conta:conta}],obs:pend.obs,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  DB.pesagensEmAberto.splice(pendIdx,1);
  closeM();autoSave();
  var msg=document.createElement('div');msg.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gr2);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.4)';
  msg.textContent='✅ Atendimento #'+num+' liquidado com sucesso!';
  document.body.appendChild(msg);setTimeout(function(){msg.remove();},2800);
  if(pgAtiva==='pendencias')go('pendencias');
  else if(pgAtiva==='caixa_dia')renderCaixaDia();
}

function reabrirA(i){
  var snap=atendHist[i];
  for(var j=0;j<snap.itens.length;j++){
    var it=snap.itens[j];
    if(it.uni){for(var k=0;k<DB.revenda.length;k++){if(DB.revenda[k].id===it.uid){DB.revenda[k].status='Disponivel';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);if(p)p.est=+(p.est+it.peso).toFixed(2);}
    else if(it.tipo==='Compra'){var p=gP(it.prodId);if(p)p.est=+(p.est-it.peso).toFixed(2);}
  }
  if(DB.caixaDia&&DB.caixaDia.movimentos){for(var j=0;j<DB.caixaDia.movimentos.length;j++){if(DB.caixaDia.movimentos[j].num===snap.num){DB.caixaDia.movimentos.splice(j,1);break;}}}
  // Reverse financial movements
  if(snap.methods){for(var j=0;j<DB.movs.length;j++){if(DB.movs[j].desc&&DB.movs[j].desc.indexOf('#'+snap.num)>=0){var rm=DB.movs.splice(j,1)[0];for(var k=0;k<DB.contas.length;k++){if(DB.contas[k].nome===rm.conta){DB.contas[k].saldo=rm.tipo==='entrada'?+(DB.contas[k].saldo-rm.valor).toFixed(2):+(DB.contas[k].saldo+rm.valor).toFixed(2);break;}}j--;}};}
  pesAbas.push({id:nid(),label:'Reab.#'+snap.num,tipo:snap.tipo,cliId:snap.cliId||'',tabId:snap.tabId||null,itens:snap.itens.slice(),obs:snap.obs||'',showUnit:false,numAtend:snap.num});
  pesAtiva=pesAbas.length-1;atendHist.splice(i,1);savePesState();autoSave();renderPesagem();
}
function execReabrirDoCaixa(numAtend){
  if(!DB.caixaDia||!DB.caixaDia.movimentos)return;
  var snap=null,snapIdx=-1;
  for(var j=0;j<DB.caixaDia.movimentos.length;j++){
    if(String(DB.caixaDia.movimentos[j].num)===String(numAtend)){snap=DB.caixaDia.movimentos[j];snapIdx=j;break;}
  }
  if(!snap){openM('Erro','<p style="color:var(--rd)">Atendimento nao encontrado.</p>');return;}
  if(!snap.itensList||!snap.itensList.length){openM('Aviso','<p style="color:var(--or)">Este atendimento nao possui itens salvos para reabrir.</p>');return;}
  closeM();
  // Reverse stock
  for(var j=0;j<snap.itensList.length;j++){
    var it=snap.itensList[j];
    if(it.uni){for(var k=0;k<DB.revenda.length;k++){if(DB.revenda[k].id===it.uid){DB.revenda[k].status='Disponivel';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);if(p)p.est=+(p.est+it.peso).toFixed(2);}
    else if(it.tipo==='Compra'){var p=gP(it.prodId);if(p)p.est=+(p.est-it.peso).toFixed(2);}
  }
  // Reverse financial movements
  for(var j=DB.movs.length-1;j>=0;j--){
    if(DB.movs[j].desc&&DB.movs[j].desc.indexOf('#'+snap.num)>=0){
      var rm=DB.movs.splice(j,1)[0];
      for(var k=0;k<DB.contas.length;k++){
        if(DB.contas[k].nome===rm.conta){
          DB.contas[k].saldo=rm.tipo==='entrada'?+(DB.contas[k].saldo-rm.valor).toFixed(2):+(DB.contas[k].saldo+rm.valor).toFixed(2);break;
        }
      }
    }
  }
  // Remove from caixa movimentos
  DB.caixaDia.movimentos.splice(snapIdx,1);
  // Remove from atendHist if present
  for(var j=0;j<atendHist.length;j++){if(String(atendHist[j].num)===String(numAtend)){atendHist.splice(j,1);break;}}
  // Push aba e navegar
  pesAbas.push({id:nid(),label:'Reab.#'+snap.num,tipo:snap.tipo||'Venda',cliId:snap.cliId||'',tabId:snap.tabId||null,itens:snap.itensList.slice(),obs:snap.obs||'',showUnit:false,numAtend:snap.num});
  pesAtiva=pesAbas.length-1;savePesState();
  autoSave();go('pesagem');
}

  if(caixaAberto()){openM('Caixa Aberto','<div class="mf"><div class="al aly">Feche o caixa atual antes de reabrir atendimentos de caixas anteriores.</div><div class="brow"><button class="btn" onclick="closeM()">OK</button></div></div>');return;}
  var hc=DB.caixasHist[histIdx];if(!hc)return;
  var snap=null;
  for(var j=0;j<hc.movimentos.length;j++){if(String(hc.movimentos[j].num)===String(numAtend)){snap=hc.movimentos[j];break;}}
  if(!snap||!snap.itensList||!snap.itensList.length){openM('Aviso','<div class="mf"><div class="al alr">Atendimento sem dados — nao e possivel reabrir.</div><div class="brow"><button class="btn" onclick="closeM()">OK</button></div></div>');return;}
  openM('Reabrir Atendimento Antigo','<div class="mf">'
    +'<div class="al alb">Atendimento <strong>#'+snap.num+'</strong> de <strong>'+hc.data+'</strong></div>'
    +'<div style="font-size:13px;color:var(--mt)">O estoque e os movimentos financeiros serao revertidos imediatamente. O caixa sera aberto para correcao.</div>'
    +'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn" id="btn-rhist-exec">&#128393; Reabrir</button>'
    +'</div></div>');
  setTimeout(function(){var b=document.getElementById('btn-rhist-exec');if(b)b.onclick=function(){execReabrirHistAtend(histIdx,numAtend);};},50);
}
function execReabrirHistAtend(histIdx,numAtend){
  var hc=DB.caixasHist[histIdx];if(!hc)return;
  var snap=null,snapIdx=-1;
  for(var j=0;j<hc.movimentos.length;j++){if(String(hc.movimentos[j].num)===String(numAtend)){snap=hc.movimentos[j];snapIdx=j;break;}}
  if(!snap)return;closeM();
  for(var j=0;j<snap.itensList.length;j++){
    var it=snap.itensList[j];var pesoEf=it.pesoLiquido!=null?it.pesoLiquido:it.peso;
    if(it.uni){for(var k=0;k<DB.revenda.length;k++){if(DB.revenda[k].id===it.uid){DB.revenda[k].status='Disponivel';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);if(p)p.est=+(p.est+pesoEf).toFixed(2);}
    else if(it.tipo==='Compra'){var p=gP(it.prodId);if(p)p.est=+(p.est-pesoEf).toFixed(2);}
  }
  for(var j=DB.movs.length-1;j>=0;j--){
    if(DB.movs[j].desc&&DB.movs[j].desc.indexOf('#'+snap.num)>=0){
      var rm=DB.movs.splice(j,1)[0];
      for(var k=0;k<DB.contas.length;k++){if(DB.contas[k].nome===rm.conta){DB.contas[k].saldo=rm.tipo==='entrada'?+(DB.contas[k].saldo-rm.valor).toFixed(2):+(DB.contas[k].saldo+rm.valor).toFixed(2);break;}}
    }
  }
  hc.movimentos.splice(snapIdx,1);
  hc.pesoTotal=0;for(var j=0;j<hc.movimentos.length;j++){var mv=hc.movimentos[j];if(mv.itensList){for(var k=0;k<mv.itensList.length;k++){var itp=mv.itensList[k];if(!itp.uni&&itp.peso)hc.pesoTotal+=itp.peso;}}}
  if(!hc.movimentos.length)DB.caixasHist.splice(histIdx,1);
  if(!DB.caixaDia){var saldoAt=0;for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].nome==='Caixa'){saldoAt=DB.contas[i].saldo;break;}}DB.caixaDia={data:hj(),aberto:true,saldoAbertura:saldoAt,movimentos:[],sangrias:[],reforcos:[]};}
  pesAbas.push({id:nid(),label:'Reab.#'+snap.num,tipo:snap.tipo||'Venda',cliId:snap.cliId||'',tabId:snap.tabId||null,itens:snap.itensList.slice(),obs:snap.obs||'',showUnit:false,numAtend:snap.num});
  pesAtiva=pesAbas.length-1;savePesState();autoSave();go('pesagem');
}

function calcFD(esp){var v=parseFloat(document.getElementById('fc-v')?document.getElementById('fc-v').value:0)||0,dif=+(v-esp).toFixed(2);var el=document.getElementById('fc-dif');if(!el)return;if(Math.abs(dif)<0.01)el.innerHTML='<div class="al alg">&#10003; Caixa confere!</div>';else if(dif<0)el.innerHTML='<div class="al alr">Falta '+fR(Math.abs(dif))+'</div>';else el.innerHTML='<div class="al aly">Sobra '+fR(dif)+'</div>';}
function confirmarFech(esp){
  var v=parseFloat(document.getElementById('fc-v').value)||0;
  // Calcula peso total dos atendimentos do caixa
  var pesoTotal=0;
  var movs=DB.caixaDia.movimentos||[];
  for(var i=0;i<movs.length;i++){
    var mv=movs[i];
    if(mv.itensList){for(var j=0;j<mv.itensList.length;j++){var it=mv.itensList[j];if(!it.uni&&it.peso)pesoTotal+=it.peso;}}
  }
  DB.caixaDia.aberto=false;
  DB.caixaDia.saldoFinal=esp;
  DB.caixaDia.saldoContado=v;
  DB.caixaDia.diferenca=+(v-esp).toFixed(2);
  DB.caixaDia.pesoTotal=+pesoTotal.toFixed(3);
  DB.caixaDia.fechadoEm=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  // Snapshot dos produtos/contas no momento do fechamento para reversão futura
  DB.caixaDia.snapProdutos=DB.produtos.map(function(p){return {id:p.id,est:p.est};});
  DB.caixaDia.snapContas=DB.contas.map(function(c){return {nome:c.nome,saldo:c.saldo};});

function _parseDataBR(s){
  if(!s)return null;
  var pts=s.split('/');if(pts.length<3)return null;
  return new Date(parseInt(pts[2]),parseInt(pts[1])-1,parseInt(pts[0]));
}
function _entrPeriodo(per){
  var agora=new Date();
  var pesoKg=0,valorR=0;
  for(var i=0;i<DB.entradas.length;i++){
    var e=DB.entradas[i];
    var d=_parseDataBR(e.data);if(!d)continue;
    var ok=false;
    if(per==='hoje'){var h=new Date();ok=(d.getDate()===h.getDate()&&d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear());}
    else if(per==='semana'){var diff=Math.floor((agora-d)/(1000*60*60*24));ok=diff>=0&&diff<7;}
    else if(per==='mes'){ok=(d.getMonth()===agora.getMonth()&&d.getFullYear()===agora.getFullYear());}
    else if(per==='trim'){var qA=Math.floor(agora.getMonth()/3);var qD=Math.floor(d.getMonth()/3);ok=(qD===qA&&d.getFullYear()===agora.getFullYear());}
    else if(per==='sem'){ok=(d.getFullYear()===agora.getFullYear()&&(d.getMonth()<6?agora.getMonth()<6:agora.getMonth()>=6));}
    else if(per==='ano'){ok=(d.getFullYear()===agora.getFullYear());}
    if(ok){pesoKg+=e.peso;valorR+=e.total||0;}
  }
  return {kg:pesoKg,val:valorR};
}

// ── CHART RENDERERS ──────────────────────────────────────────
function _dashCharts(){
  // 1. Barras: entradas por período
  (function(){
    var c=document.getElementById('ch-barras');if(!c)return;
    var ctx=c.getContext('2d');
    c.width=c.offsetWidth||320;c.height=160;
    var pers=['hoje','semana','mes','trim','sem','ano'];
    var nms=['Hj','7d','Mês','Trim','Sem','Ano'];
    var vals=[];for(var i=0;i<pers.length;i++)vals.push(_entrPeriodo(pers[i]).kg);
    var max=Math.max.apply(null,vals)||1;
    var W=c.width,H=c.height,pad=10,bw=Math.floor((W-pad*2)/pers.length)-6,gap=6;
    ctx.clearRect(0,0,W,H);
    // grid lines
    ctx.strokeStyle='rgba(42,58,82,0.8)';ctx.lineWidth=1;
    for(var i=1;i<=4;i++){var y=H-pad-(H-pad*2)*(i/4);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
    for(var i=0;i<pers.length;i++){
      var x=pad+i*(bw+gap);
      var bh=Math.max(4,(H-pad*2)*(vals[i]/max));
      var y=H-pad-bh;
      var on=pers[i]===_dashPer;
      var grad=ctx.createLinearGradient(0,y,0,H-pad);
      grad.addColorStop(0,on?'#22c55e':'#1e4d2b');
      grad.addColorStop(1,on?'rgba(34,197,94,0.2)':'rgba(22,163,74,0.05)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,bw,bh,4):ctx.rect(x,y,bw,bh);
      ctx.fill();
      // label
      ctx.fillStyle=on?'#22c55e':'#7a90b0';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
      ctx.fillText(nms[i],x+bw/2,H-1);
      // value
      if(vals[i]>0){ctx.fillStyle=on?'#22c55e':'#4a6080';ctx.font='bold 9px monospace';ctx.fillText(vals[i].toFixed(0)+'kg',x+bw/2,y-3);}
    }
  })();

  // 2. Linha: evolução do estoque (simulada por produto)
  (function(){
    var c=document.getElementById('ch-linha');if(!c)return;
    var ctx=c.getContext('2d');
    c.width=c.offsetWidth||320;c.height=160;
    var W=c.width,H=c.height,pad=14;
    ctx.clearRect(0,0,W,H);
    // Gera pontos baseados nas entradas dos últimos 7 dias
    var agora=new Date();
    var dias=[];for(var i=6;i>=0;i--){var d=new Date(agora);d.setDate(d.getDate()-i);dias.push(d);}
    // Acumula peso de estoque por dia (soma do estoque atual - entradas posteriores)
    var totAtual=0;for(var i=0;i<DB.produtos.length;i++)totAtual+=DB.produtos[i].est;
    var pts=[];var acum=totAtual;
    // Calcula subtraindo entradas do mais recente para o mais antigo
    var entByDay=[];
    for(var d=0;d<dias.length;d++){
      var dk=dias[d].toLocaleDateString('pt-BR');
      var soma=0;for(var i=0;i<DB.entradas.length;i++){if(DB.entradas[i].data===dk)soma+=DB.entradas[i].peso;}
      entByDay.push(soma);
    }
    // Reconstrói: ponto de hoje = estoque atual, dias anteriores = estoque - entradas posteriores
    var runEst=totAtual;
    var ptsArr=[];
    for(var d=dias.length-1;d>=0;d--){ptsArr.unshift(runEst);runEst=Math.max(0,runEst-entByDay[d]);}
    var maxV=Math.max.apply(null,ptsArr)||1;
    var minV=Math.min.apply(null,ptsArr);
    var range=maxV-minV||1;
    // Grid
    ctx.strokeStyle='rgba(42,58,82,0.7)';ctx.lineWidth=1;
    for(var i=1;i<=3;i++){var y=pad+(H-pad*2)*(i/3);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
    // Área
    var step=(W-pad*2)/(ptsArr.length-1||1);
    var getY=function(v){return pad+(H-pad*2)*(1-(v-minV)/range);};
    var grad=ctx.createLinearGradient(0,pad,0,H);
    grad.addColorStop(0,'rgba(245,158,11,0.35)');grad.addColorStop(1,'rgba(245,158,11,0.02)');
    ctx.beginPath();ctx.moveTo(pad,getY(ptsArr[0]));
    for(var i=1;i<ptsArr.length;i++)ctx.lineTo(pad+i*step,getY(ptsArr[i]));
    ctx.lineTo(pad+(ptsArr.length-1)*step,H-pad);ctx.lineTo(pad,H-pad);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
    // Linha
    ctx.beginPath();ctx.moveTo(pad,getY(ptsArr[0]));
    for(var i=1;i<ptsArr.length;i++)ctx.lineTo(pad+i*step,getY(ptsArr[i]));
    ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();
    // Pontos
    var dnms=['D-6','D-5','D-4','D-3','D-2','D-1','Hj'];
    for(var i=0;i<ptsArr.length;i++){
      var px=pad+i*step,py=getY(ptsArr[i]);
      ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);
      ctx.fillStyle=i===ptsArr.length-1?'#f59e0b':'#7a4f00';ctx.fill();
      ctx.fillStyle='#7a90b0';ctx.font='8px sans-serif';ctx.textAlign='center';
      ctx.fillText(dnms[i],px,H-1);
    }
  })();

  // 3. Pizza: tipos de entrada
  (function(){
    var c=document.getElementById('ch-pizza');if(!c)return;
    var ctx=c.getContext('2d');
    var sz=Math.min(c.offsetWidth||140,140);
    c.width=sz;c.height=sz;
    var tipos={Compra:0,Doacao:0,Coleta:0};
    for(var i=0;i<DB.entradas.length;i++){
      var t=DB.entradas[i].tipo;
      if(tipos[t]!==undefined)tipos[t]+=DB.entradas[i].peso;
      else tipos['Coleta']+=DB.entradas[i].peso;
    }
    var keys=Object.keys(tipos);var total=0;for(var i=0;i<keys.length;i++)total+=tipos[keys[i]];
    if(!total){ctx.fillStyle='#2a3a52';ctx.beginPath();ctx.arc(sz/2,sz/2,sz/2-4,0,Math.PI*2);ctx.fill();return;}
    var cols={Compra:'#22c55e',Doacao:'#3b82f6',Coleta:'#f59e0b'};
    var start=-Math.PI/2;
    for(var i=0;i<keys.length;i++){
      var k=keys[i];if(!tipos[k])continue;
      var slice=(tipos[k]/total)*Math.PI*2;
      ctx.beginPath();ctx.moveTo(sz/2,sz/2);
      ctx.arc(sz/2,sz/2,sz/2-4,start,start+slice);
      ctx.closePath();ctx.fillStyle=cols[k]||'#7a90b0';ctx.fill();
      ctx.strokeStyle='#111827';ctx.lineWidth=2;ctx.stroke();
      start+=slice;
    }
    // buraco
    ctx.beginPath();ctx.arc(sz/2,sz/2,sz/2-20,0,Math.PI*2);
    ctx.fillStyle='#111827';ctx.fill();
  })();

  // 4. Barras: coletas por dia da semana
  (function(){
    var c=document.getElementById('ch-coletas');if(!c)return;
    var ctx=c.getContext('2d');
    c.width=c.offsetWidth||320;c.height=130;
    var W=c.width,H=c.height,pad=10;
    ctx.clearRect(0,0,W,H);
    var agora=new Date();
    var dias=[],nms=[];
    for(var i=6;i>=0;i--){var d=new Date(agora);d.setDate(d.getDate()-i);dias.push(d.toLocaleDateString('pt-BR'));var dn=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];nms.push(dn);}
    var vals=[];
    for(var d=0;d<dias.length;d++){var cnt=0;for(var i=0;i<DB.coletas.length;i++){if(DB.coletas[i].data===dias[d])cnt++;}vals.push(cnt);}
    var max=Math.max.apply(null,vals)||1;
    var bw=Math.floor((W-pad*2)/7)-5,gap=5;
    ctx.strokeStyle='rgba(42,58,82,0.7)';ctx.lineWidth=1;
    for(var i=1;i<=3;i++){var y=H-pad-(H-pad*2)*(i/3);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
    for(var i=0;i<7;i++){
      var x=pad+i*(bw+gap);
      var bh=Math.max(4,(H-pad*2)*(vals[i]/max));
      var y=H-pad-bh;
      var isHj=(i===6);
      var grad=ctx.createLinearGradient(0,y,0,H-pad);
      grad.addColorStop(0,isHj?'#3b82f6':'#1e3a5f');
      grad.addColorStop(1,isHj?'rgba(59,130,246,0.2)':'rgba(59,130,246,0.03)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,bw,bh,3):ctx.rect(x,y,bw,bh);ctx.fill();
      ctx.fillStyle=isHj?'#3b82f6':'#7a90b0';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
      ctx.fillText(nms[i],x+bw/2,H-1);
      if(vals[i]>0){ctx.fillStyle=isHj?'#3b82f6':'#4a6080';ctx.font='bold 9px monospace';ctx.fillText(vals[i],x+bw/2,y-3);}
    }
  })();
}

var _colTabAtiva=0;
function _colTab(idx){
  _colTabAtiva=idx;
  var slides=document.getElementById('col-slides');
  if(slides)slides.style.transform='translateX(-'+(idx*50)+'%)';
  var hjBtn=document.getElementById('col-tab-hj');
  var smBtn=document.getElementById('col-tab-sm');
  if(hjBtn&&smBtn){
    hjBtn.style.background=idx===0?'var(--bl)':'transparent';
    hjBtn.style.color=idx===0?'#fff':'var(--mt)';
    hjBtn.style.fontWeight=idx===0?'700':'400';
    smBtn.style.background=idx===1?'var(--bl)':'transparent';
    smBtn.style.color=idx===1?'#fff':'var(--mt)';
    smBtn.style.fontWeight=idx===1?'700':'400';
  }
  // Atualiza subtítulo
  var sub=document.getElementById('col-subtit');
  if(sub){
    var hjStr2=new Date().toLocaleDateString('pt-BR');
    var colH2=[],colS2=[];var agora2=new Date();
    for(var i=0;i<DB.coletas.length;i++){
      var c=DB.coletas[i];if(c.data===hjStr2)colH2.push(c);
      var d=_parseDataBR(c.data);if(d){var df=Math.floor((agora2-d)/(1000*60*60*24));if(df>=0&&df<7)colS2.push(c);}
    }
    var ph=0;for(var i=0;i<colH2.length;i++)ph+=colH2[i].peso||0;
    var ps=0;for(var i=0;i<colS2.length;i++)ps+=colS2[i].peso||0;
    if(idx===0)sub.textContent=colH2.length+' coleta(s) · ~'+fKg(ph)+'kg est.';
    else sub.textContent=colS2.length+' coleta(s) esta semana · ~'+fKg(ps)+'kg est.';
  }
}

function saveEditFiltro(id){
  var f=DB.filtrosMat.find(function(x){return x.id===id;});if(!f)return;
  var novoNome=document.getElementById('ef-n').value.trim();
  if(!novoNome){alert('Informe um nome!');return;}
  var antigoNome=f.nome;
  f.nome=novoNome;
  f.ic=document.getElementById('ef-ic').value||f.ic;
  f.cor=document.getElementById('ef-cor').value||f.cor;
  // Atualiza cat nos produtos que usavam o nome antigo
  for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].cat===antigoNome)DB.produtos[i].cat=novoNome;}
  saveDB();mGerenciarFiltros();
}
function mDelFiltro(id){
  var f=DB.filtrosMat.find(function(x){return x.id===id;});if(!f)return;
  var idx=DB.filtrosMat.findIndex(function(x){return x.id===id;});
  if(idx>=0)DB.filtrosMat.splice(idx,1);
  saveDB();mGerenciarFiltros();
}

function salvarTodosPrecos(){
  var mudados=0;
  for(var i=0;i<DB.produtos.length;i++){
    var p=DB.produtos[i];
    var inpVV=document.getElementById('prc-vv-'+p.id);
    var inpVC=document.getElementById('prc-vc-'+p.id);
    if(!inpVV||!inpVC)continue;
    var novoVV=parseFloat(inpVV.value)||0;
    var novoVC=parseFloat(inpVC.value)||0;
    var antigoVV=p.vV;
    if(novoVV!==p.vV||novoVC!==p.vC){
      p.vV=novoVV;p.vC=novoVC;mudados++;
      // Atualiza tabela Padrao se venda mudou
      if(novoVV!==antigoVV){
        for(var j=0;j<DB.tabelas.length;j++){
          if(DB.tabelas[j].nome==='Padrao'&&DB.tabelas[j].tipo==='venda'){
            var tab=DB.tabelas[j];var found=false;
            for(var k=0;k<tab.itens.length;k++){if(tab.itens[k].pId===p.id){tab.itens[k].preco=novoVV;found=true;break;}}
            if(!found)tab.itens.push({pId:p.id,preco:novoVV});
            break;
          }
        }
      }
    }
  }
  _precMudados={};
  var st=document.getElementById('prec-status');
  var btn=document.getElementById('btn-salvar-precos');
  if(mudados>0){
    if(st){st.style.display='block';st.style.color='var(--gr)';st.textContent='&#10003; '+mudados+' produto(s) atualizados! Tabela Padrao sincronizada.';}
    if(btn){btn.textContent='&#10003; Salvo!';btn.style.background='var(--gr2)';}
  }else{
    if(st){st.style.display='block';st.style.color='var(--mt)';st.textContent='Nenhuma alteracao detectada.';}
  }
  setTimeout(function(){
    var s=document.getElementById('prec-status');if(s)s.style.display='none';
  },3000);
}

function saveEditProd(id){
  var p=gP(id);if(!p)return;
  var novoNome=document.getElementById('ep-n').value.trim();
  if(!novoNome){alert('Informe o nome!');return;}
  var novoVV=parseFloat(document.getElementById('ep-vv').value)||0;
  var novoVC=parseFloat(document.getElementById('ep-vc').value)||0;
  var antigoVV=p.vV;
  p.nome=novoNome;
  p.ic=document.getElementById('ep-ic').value||p.ic;
  p.cat=document.getElementById('ep-c').value;
  p.vV=novoVV;p.vC=novoVC;
  // Atualiza tabela Padrao automaticamente se o preco de venda mudou
  if(novoVV!==antigoVV){
    for(var i=0;i<DB.tabelas.length;i++){
      if(DB.tabelas[i].nome==='Padrao'&&DB.tabelas[i].tipo==='venda'){
        var tab=DB.tabelas[i];var found=false;
        for(var j=0;j<tab.itens.length;j++){if(tab.itens[j].pId===id){tab.itens[j].preco=novoVV;found=true;break;}}
        if(!found)tab.itens.push({pId:id,preco:novoVV});
        break;
      }
    }
  }
  saveDB();closeM();go('estoque');
}
function mDelProd(id){
  var p=gP(id);if(!p)return;

function confDelProd(id){
  var idx=-1;for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].id===id){idx=i;break;}}

  for(var i=0;i<DB.tabelas.length;i++){var t=DB.tabelas[i];for(var j=t.itens.length-1;j>=0;j--){if(t.itens[j].pId===id)t.itens.splice(j,1);}}

function updTransfTotal(){
  var total=0;
  var box=document.getElementById('t-dests');if(!box)return;
  var inputs=box.querySelectorAll('input[type="number"]');
  for(var i=0;i<inputs.length;i++)total+=parseFloat(inputs[i].value)||0;
  var tv=document.getElementById('t-total-val');if(tv)tv.textContent=fKg(total)+' kg';
  var tb=document.getElementById('t-total-box');if(tb)tb.style.display='flex';

function mTransfPre(id){mTransf(id);}
function saveTransf(){
  var de=document.getElementById('t-de').value;
  var ob=document.getElementById('t-ob').value;
  var box=document.getElementById('t-dests');if(!box){alert('Erro interno!');return;}
  // Coleta todos os destinos visiveis
  var rows=box.querySelectorAll('div[id^="td-row-"]');
  var destinos=[];var totalPE=0;
  for(var i=0;i<rows.length;i++){
    var rowId=rows[i].id.replace('td-row-','');
    var paSel=document.getElementById('td-pa-'+rowId);
    var pePeso=document.getElementById('td-pe-'+rowId);
    if(!paSel||!pePeso)continue;
    var pa=paSel.value,pe=parseFloat(pePeso.value)||0;
    if(pa&&pe>0){destinos.push({para:pa,pE:pe});totalPE+=pe;}
  }
  if(!de||destinos.length===0||totalPE===0){alert('Preencha ao menos um destino com peso!');return;}
  // Desconta da origem o total de todos os destinos
  var pDe=null;for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].nome===de){pDe=DB.produtos[i];break;}}
  if(pDe)pDe.est=+(pDe.est-totalPE).toFixed(2);
  // Para cada destino, adiciona ao estoque e salva registro
  for(var i=0;i<destinos.length;i++){
    var d=destinos[i];
    var pPa=null;for(var j=0;j<DB.produtos.length;j++){if(DB.produtos[j].nome===d.para){pPa=DB.produtos[j];break;}}
    if(pPa)pPa.est=+(pPa.est+d.pE).toFixed(2);
    DB.transf.unshift({id:nid(),data:hj(),de:de,para:d.para,pS:+(totalPE/destinos.length).toFixed(2),pE:d.pE,obs:ob+(destinos.length>1?' ('+i+1+'/'+destinos.length+')':'')});
  }
  closeM();go('estoque');
}

// ── FINANCEIRO helpers ────────────────────────────────────────
var _finTab='resumo'; // aba ativa do financeiro
var _finPeriodo='mes'; // 'mes','ano','tudo'


function _finPeriodoLabel(){
  if(_finPeriodo==='mes'){var d=new Date();return '📅 '+['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][d.getMonth()]+' '+d.getFullYear();}
  if(_finPeriodo==='ano')return '📅 Ano '+new Date().getFullYear();
  return '📅 Todos os registros';
}
function _filtrarMovsPeriodo(movs){
  var hoje=new Date();
  return movs.filter(function(m){
    if(_finPeriodo==='tudo')return true;
    var parts=m.data.split('/');
    if(parts.length<3)return true;
    var d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
    if(_finPeriodo==='mes')return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();
    if(_finPeriodo==='ano')return d.getFullYear()===hoje.getFullYear();
    return true;
  });
}

function _filtrarEntradasPeriodo(ents){
  var hoje=new Date();
  return ents.filter(function(e){
    if(_finPeriodo==='tudo')return true;
    var parts=e.data.split('/');
    if(parts.length<3)return true;
    var d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
    if(_finPeriodo==='mes')return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();
    if(_finPeriodo==='ano')return d.getFullYear()===hoje.getFullYear();
    return true;
  });
}

function _finRender(t){
  if(t==='resumo')    return _finResumo();
  if(t==='relatorio') return _finRelatorio();
  if(t==='contas')    return _finContas();
  if(t==='movs')      return _finMovs();
  if(t==='fixas')     return _finFixas();
  if(t==='categorias') return _finCategorias();
  return '';
}

function saveEditConta(id){
  var c=null;for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].id===id){c=DB.contas[i];break;}}
  if(!c)return;
  var n=document.getElementById('ct-n').value.trim();
  var t=document.getElementById('ct-t').value;
  var s=parseFloat(document.getElementById('ct-s').value)||0;
  var ic=document.getElementById('ct-ic').value||c.ic;
  if(!n){alert('Informe o nome!');return;}
  var dup=DB.contas.find(function(x){return x.id!==id&&x.nome.toLowerCase()===n.toLowerCase();});
  if(dup){alert('Ja existe outra conta com este nome!');return;}
  // Update references in movs
  if(c.nome!==n){for(var i=0;i<DB.movs.length;i++){if(DB.movs[i].conta===c.nome)DB.movs[i].conta=n;}}
  c.nome=n;c.tipo=t;c.saldo=s;c.ic=ic;
  closeM();saveDB();
  document.getElementById('fin-content').innerHTML=_finRender('contas');
}
function delConta(id){
  var c=null;for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].id===id){c=DB.contas[i];break;}}
  if(!c)return;
  if(DB.contas.length<=1){alert('Voce precisa ter ao menos uma conta!');return;}
  confirmar('Excluir a conta <b>'+c.nome+'</b>?<br><span style="font-size:12px;color:var(--mt)">O saldo de '+fR(c.saldo)+' sera perdido. Movimentacoes vinculadas a esta conta NAO serao apagadas.</span>',function(){
    for(var i=0;i<DB.contas.length;i++){if(DB.contas[i].id===id){DB.contas.splice(i,1);break;}}

var _cfSubTab='contas'; // 'contas' ou 'hist'
var _cfHistId=null;
var _fixasMesOffset=0; // 0 = mes atual, 1 = proximo mes, -1 = mes anterior, etc.

function _mesAtual(){var d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function _mesComOffset(offset){
  var d=new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()+offset);
  return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function _mesLabel(mesStr){
  var MESES=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var p=mesStr.split('/');
  return MESES[parseInt(p[0])-1]+' '+p[1];
}
function _cfValorMesRef(c,mesRef){
  if(c.historico){for(var i=0;i<c.historico.length;i++){if(c.historico[i].mes===mesRef)return c.historico[i].valor;}}
  if(c.tipo==='fixa')return c.valor;
  return 0;
}
function _cfStatusMesRef(c,mesRef){
  if(c.historico){for(var i=0;i<c.historico.length;i++){if(c.historico[i].mes===mesRef)return c.historico[i].pago?'Pago':'Pendente';}}
  return 'Pendente';
}
function _cfHasParcelaNoMes(c,mesRef){
  if(c.tipo!=='parcelada')return true;
  if(c.historico){for(var i=0;i<c.historico.length;i++){if(c.historico[i].mes===mesRef)return true;}}
  return false;
}
// Keep backward-compat wrappers using current month
function _cfValorMes(c){return _cfValorMesRef(c,_mesAtual());}
function _cfStatusMes(c){return _cfStatusMesRef(c,_mesAtual());}

function fixasMesNav(delta){
  _fixasMesOffset+=delta;
  document.getElementById('fin-content').innerHTML=_finRender('fixas');
}
function fixasMesHoje(){
  _fixasMesOffset=0;
  document.getElementById('fin-content').innerHTML=_finRender('fixas');
}

function _finFixas(){
  var ma=_mesComOffset(_fixasMesOffset);
  var maAtual=_mesAtual();
  var isFuturo=_fixasMesOffset>0;
  var isPast=_fixasMesOffset<0;
  var totP=0,totPago=0,totFuturo=0;
  for(var i=0;i<DB.contasFixas.length;i++){
    var c=DB.contasFixas[i];
    if(!_cfHasParcelaNoMes(c,ma)&&c.tipo==='parcelada')continue;
    var v=_cfValorMesRef(c,ma);
    var s=_cfStatusMesRef(c,ma);
    if(s==='Pendente'&&v>0)totP+=v;
    else if(s==='Pago')totPago+=v;
    if(isFuturo&&v>0&&s==='Pendente')totFuturo+=v;
  }
  var cfH='';
  for(var i=0;i<DB.contasFixas.length;i++){
    var c=DB.contasFixas[i];
    // Para parcelada, pular se nao tem parcela neste mes
    if(c.tipo==='parcelada'&&!_cfHasParcelaNoMes(c,ma))continue;
    var v=_cfValorMesRef(c,ma);
    var s=_cfStatusMesRef(c,ma);
    var mesHist=null;
    if(c.historico){for(var j=0;j<c.historico.length;j++){if(c.historico[j].mes===ma){mesHist=c.historico[j];break;}}}
    var tipoTag='';
    if(c.tipo==='fixa') tipoTag='<span style="font-size:9px;background:var(--blb);color:var(--bl);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:1px 6px">FIXA</span>';
    else if(c.tipo==='parcelada'){
      var pagoCount=(c.historico||[]).filter(function(h){return h.pago;}).length;
      var totParc=c.totalParcelas||'?';
      // Numero da parcela deste mes
      var numParc=mesHist&&mesHist.parcela?mesHist.parcela:'?';
      tipoTag='<span style="font-size:9px;background:var(--pub);color:var(--pu);border:1px solid rgba(168,85,247,.3);border-radius:10px;padding:1px 6px">'+numParc+'/'+totParc+'x</span>';
    } else tipoTag='<span style="font-size:9px;background:var(--orb);color:var(--or);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:1px 6px">VARIAVEL</span>';
    var acoes='';
    if(isFuturo||isPast){
      // Meses que nao sao o atual: mostrar status apenas, sem botao pagar
      if(s==='Pago') acoes='<span class="tag tg">Pago</span>';
      else if(v>0) acoes='<span class="tag to">Previsto</span>';
      else acoes='<span style="font-size:11px;color:var(--mt)">sem valor</span>';
    } else {
      // Mes atual: logica normal
      if(c.tipo==='parcelada'){
        if(!mesHist) acoes='<span style="font-size:11px;color:var(--mt)">sem parcela</span>';
        else if(!mesHist.pago) acoes='<button class="bsm bsmg" onclick="mPagarCF('+c.id+')">Pagar parcela</button>';
        else acoes='<span class="tag tg">Pago</span>';
      } else if(s==='Pendente'){
        if(c.tipo==='variavel'&&v===0) acoes='<button class="bsm" style="background:var(--orb);color:var(--or);border:1px solid rgba(245,158,11,.3)" onclick="mLancarCF('+c.id+')">Lancar Valor</button>';
        else if(v>0) acoes='<button class="bsm bsmg" onclick="mPagarCF('+c.id+')">Pagar</button>';
        else acoes='<button class="bsm" style="background:var(--orb);color:var(--or);border:1px solid rgba(245,158,11,.3)" onclick="mLancarCF('+c.id+')">Lancar Valor</button>';
      } else {
        acoes='<span class="tag tg">Pago</span>';
      }
    }

    var borderCol=isFuturo&&v>0?'rgba(168,85,247,.2)':statusParc==='Pendente'&&v>0?'rgba(239,68,68,.25)':statusParc==='Pago'?'rgba(34,197,94,.2)':'var(--bd)';
    cfH+='<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--s2);border-radius:var(--r);margin-bottom:7px;border:1px solid '+borderCol+'">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:22px">'+(c.ic||'&#128197;')+'</span>'
      +'<div>'

      +'<div style="font-size:10px;color:var(--mt);margin-top:2px">Vence dia '+c.venc+' &middot; <button onclick="mHistCF('+c.id+')" style="background:none;border:none;color:var(--bl);font-size:10px;cursor:pointer;padding:0">ver historico</button></div>'
      +'</div></div>'
      +'<div style="display:flex;align-items:center;gap:9px">'
      +(v>0?'<span style="font-size:14px;font-weight:700;font-family:monospace;color:'+(isFuturo?'var(--pu)':statusParc==='Pendente'?'var(--rd)':'var(--mt)')+'">'+fR(v)+'</span>':'')
      +acoes
      +(!isFuturo&&!isPast?'<button onclick="mEditCF('+c.id+')" style="background:none;border:none;color:var(--mt);font-size:15px;cursor:pointer;padding:2px 4px" title="Editar">&#9998;</button>':'')
      +(!isFuturo&&!isPast?'<button onclick="delCF('+c.id+')" style="background:none;border:none;color:var(--mt);font-size:13px;cursor:pointer;padding:2px 4px" title="Excluir">&#128465;</button>':'')
      +'</div></div>';
  }
  if(!DB.contasFixas.length) cfH='<div style="text-align:center;padding:28px;color:var(--mt);font-size:13px">Nenhuma conta cadastrada.<br>Clique em + Nova Conta para comecar.</div>';
  // Nav header
  var navBar='<div style="display:flex;align-items:center;justify-content:space-between;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:9px 13px">'
    +'<button onclick="fixasMesNav(-1)" style="background:none;border:none;color:var(--tx);font-size:18px;cursor:pointer;padding:2px 8px">&#8249;</button>'
    +'<div style="text-align:center">'
    +'<div style="font-size:13px;font-weight:700;color:'+(isFuturo?'var(--pu)':isPast?'var(--mt)':'var(--tx)')+'">'+_mesLabel(ma)+'</div>'
    +(_fixasMesOffset!==0?'<button onclick="fixasMesHoje()" style="background:none;border:none;color:var(--bl);font-size:10px;cursor:pointer;padding:1px 0;text-decoration:underline">Voltar ao mes atual</button>':'<div style="font-size:10px;color:var(--gr)">&#9679; Mes atual</div>')
    +'</div>'
    +'<button onclick="fixasMesNav(1)" style="background:none;border:none;color:var(--tx);font-size:18px;cursor:pointer;padding:2px 8px">&#8250;</button>'
    +'</div>';
  // Summary cards
  var sumCards='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  if(isFuturo){
    sumCards+='<div class="card" style="text-align:center;background:var(--pub);border-color:rgba(168,85,247,.3);grid-column:1/-1">'
      +'<div style="font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">&#128197; Previsto a Pagar</div>'
      +'<div style="font-size:22px;font-weight:700;color:#fff;font-family:monospace">'+fR(totP)+'</div>'
      +'<div style="font-size:10px;color:rgba(255,255,255,.7);margin-top:3px">projecao — valores podem mudar</div></div>';
  } else {
    sumCards+='<div class="card" style="text-align:center;background:var(--rdb);border-color:rgba(239,68,68,.3)">'
      +'<div style="font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">&#128197; A Pagar</div>'

      +'<div class="card" style="text-align:center;background:var(--grb);border-color:rgba(34,197,94,.3)">'

      +'<div style="font-size:20px;font-weight:700;color:var(--gr);font-family:monospace">'+fR(totPago)+'</div></div>';

  sumCards+='</div>';
  return '<div class="fc">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'

    +'</div>'

    +'<div class="card"><div class="stl"><div class="stb" style="background:'+(isFuturo?'var(--pu)':'var(--gr)')+'"></div><div class="stx">Contas — '+_mesLabel(ma)+'</div></div>'+cfH+'</div>'
    +'</div>';
}
