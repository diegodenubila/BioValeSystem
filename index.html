// ── HELPERS ──────────────────────────────────────────────────
function fR(v){return 'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});}
function fKg(v){return parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});}
function hj(){return new Date().toLocaleDateString('pt-BR');}
function nid(){return Date.now()+Math.random();}
function gP(id){for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].id===id)return DB.produtos[i];}return null;}
function stag(s){
  if(s==='Confirmada'||s==='Pago'||s==='Disponivel'||s==='Concluido')return '<span class="tag tg">'+s+'</span>';
  if(s==='Agendada'||s==='Triagem')return '<span class="tag tb">'+s+'</span>';
  if(s==='Pendente'||s==='Desmontagem')return '<span class="tag to">'+s+'</span>';
  return '<span class="tag tgr">'+s+'</span>';
}
function sc(icon,lbl,val,sub,cor){
  cor=cor||'var(--gr)';
  return '<div class="card" style="display:flex;flex-direction:column;gap:5px">'
    +'<div style="display:flex;justify-content:space-between">'
    +'<span style="font-size:18px">'+icon+'</span>'
    +'<span style="font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:1px">'+lbl+'</span></div>'
    +'<div style="font-size:21px;font-weight:700;font-family:monospace;color:'+cor+'">'+val+'</div>'
    +'<div style="font-size:11px;color:var(--mt)">'+sub+'</div></div>';
}
function getPreco(prod,tipo,tabId){
  if(!prod)return 0;
  if(tipo==='Doacao')return 0;
  // Primeiro: verificar se há tabela selecionada com preço definido para o produto
  if(tabId){for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){var t=DB.tabelas[i];for(var j=0;j<t.itens.length;j++){if(t.itens[j].pId===prod.id)return t.itens[j].preco;}}}}
  // Fallback: preço padrão do produto
  if(tipo==='Compra')return prod.vC||prod.vV;
  return prod.vV;
}
function tipoCol(t){return t==='Venda'?'var(--rd)':t==='Compra'?'var(--gr)':'var(--bl)';}
function tipoIco(t){return t==='Compra'?'&#128229;':t==='Venda'?'&#128228;':'&#127873;';}
function caixaAberto(){return DB.caixaDia&&DB.caixaDia.data===hj()&&DB.caixaDia.aberto;}
function openM(title,body,w){
  w=w||500;
  var ov=document.getElementById('m-ov');
  if(!ov){ov=document.createElement('div');ov.id='m-ov';ov.className='mov';document.body.appendChild(ov);}
  ov.innerHTML='<div class="mbx" style="width:'+w+'px"><div class="mhd"><div class="mtl">'+title+'</div>'
    +'<button class="mcl" onclick="closeM()">&#215;</button></div>'+body+'</div>';
  ov.style.display='flex';
}
function closeM(){var o=document.getElementById('m-ov');if(o)o.style.display='none';}

function selU(uid,el){
  for(var i=0;i<USERS.length;i++){if(USERS[i].id===uid){SU=USERS[i];break;}}
  var bs=document.querySelectorAll('.lu');for(var i=0;i<bs.length;i++)bs[i].classList.remove('sel');
  if(el)el.classList.add('sel');

  document.getElementById('plbl').textContent='PIN de '+SU.nome;
  document.getElementById('pi').value='';document.getElementById('pe').textContent='';
  setTimeout(function(){document.getElementById('pi').focus();},100);
}
function doLogin(){
  if(!SU)return;
  if(document.getElementById('pi').value!==SU.pin){document.getElementById('pe').textContent='PIN incorreto!';return;}
  CU=SU;
  document.getElementById('ls').classList.add('H');document.getElementById('wrap').classList.remove('H');
  buildSidebar();buildBottomNav();go(PPAGES[CU.perfil][0]);
}

  CU=SU=null;document.getElementById('wrap').classList.add('H');document.getElementById('ls').classList.remove('H');

  }

  document.getElementById('sbur').textContent=PNOME[CU.perfil];document.getElementById('tbav').textContent=CU.av;

function buildBottomNav(){
  var perms=PPAGES[CU.perfil];var pages=[],c=0;
  for(var i=0;i<ALLPAGES.length;i++){if(perms.indexOf(ALLPAGES[i].id)>=0&&c<5){pages.push(ALLPAGES[i]);c++;}}
  var h='';

    h+='<button class="bnb" id="bn-'+p.id+'" onclick="go(\''+p.id+'\')">'
      +'<span class="bni">'+p.icon+'</span>'+p.label+'</button>';

function setPesTab(v){pesAbas[pesAtiva].tabId=v?parseFloat(v):null;savePesState();renderPesagem();}
function reaplicarTabela(){
  var ab=pesAbas[pesAtiva];
  if(!ab.tabId||!ab.itens.length)return;
  var tabNome='esta tabela';
  for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(ab.tabId)){tabNome=DB.tabelas[i].nome;break;}}
  // Mostra prévia dos itens que vão mudar
  var mudancas='';var algumaMudanca=false;
  for(var i=0;i<ab.itens.length;i++){
    var it=ab.itens[i];if(it.uni)continue;// unidades não têm preço por tabela
    var novoPreco=getPreco(gP(it.prodId),ab.tipo,ab.tabId);
    if(novoPreco!==it.preco){
      algumaMudanca=true;
      mudancas+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:var(--bg);border-radius:6px;margin-bottom:4px">'
        +'<span style="font-size:12px">'+it.ic+' '+it.nome+'</span>'
        +'<span style="font-size:12px;font-family:monospace"><span style="color:var(--rd);text-decoration:line-through">'+fR(it.preco)+'/kg</span>'
        +' → <span style="color:var(--gr);font-weight:700">'+fR(novoPreco)+'/kg</span></span>'
        +'</div>';
    }
  }
  var msg=algumaMudanca
    ?'<div style="margin-bottom:9px;font-size:13px;color:var(--mt)">Os seguintes itens terão o preço atualizado para <strong style="color:var(--or)">'+tabNome+'</strong>:</div>'
     +'<div style="max-height:200px;overflow-y:auto;margin-bottom:4px">'+mudancas+'</div>'
     +'<div class="al aly" style="margin-top:8px;font-size:12px">Você ainda poderá ajustar valores manualmente depois.</div>'
    :'<div class="al alg">Todos os preços já estão de acordo com <strong>'+tabNome+'</strong>. Nenhuma alteração necessária.</div>';
  openM('&#8635; Reaplicar Tabela',
    '<div class="mf">'+msg
    +(algumaMudanca
      ?'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button><button class="btn btn-or" onclick="confirmarReaplicar()">Atualizar Preços</button></div>'
      :'<div class="brow"><button class="btn" onclick="closeM()">OK</button></div>')
    +'</div>',480);
}

function confAddP(prodId){
  var ab=pesAbas[pesAtiva];var prod=gP(prodId);
  var peso=parseFloat(document.getElementById('ai-kg').value)||0;
  var preco=parseFloat(document.getElementById('ai-pr').value)||0;
  if(peso<=0){alert('Informe o peso!');return;}
  if(ab.tipo==='Venda'&&prod.est<peso){
    var falta=+(peso-prod.est).toFixed(2);closeM();
    var opts='';for(var i=0;i<DB.produtos.length;i++){var p=DB.produtos[i];if(p.id!==prodId&&p.est>0)opts+='<option value="'+p.nome+'">'+p.ic+' '+p.nome+' ('+fKg(p.est)+'kg)</option>';}
    openM('Estoque Insuficiente','<div class="mf"><div class="al aly">Faltam '+falta+'kg de '+prod.nome+'. Transferir de qual material?</div>'
      +'<div class="fld"><label>Material de origem</label><select class="inp" id="ori-d">'+opts+'</select></div>'
      +'<div class="fld"><label>Peso a transferir kg</label><input class="inp" type="number" inputmode="decimal" id="ori-p" value="'+falta+'" step="0.01"></div>'
      +'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
      +'<button class="btn btn-or" onclick="confTransfP('+prodId+','+peso+','+preco+')">Transferir e adicionar</button></div></div>',460);
    return;
  }
  var tabN='Padrao';if(ab.tabId){for(var i=0;i<DB.tabelas.length;i++){if(DB.tabelas[i].id==ab.tabId){tabN=DB.tabelas[i].nome;break;}}}
  ab.itens.push({prodId:prodId,ic:prod.ic,nome:prod.nome,peso:peso,preco:preco,tipo:ab.tipo,uni:false,tabN:tabN});
  closeM();savePesState();renderPesagem();
}
function confTransfP(prodId,peso,preco){
  var oriNome=document.getElementById('ori-d').value,oriPeso=parseFloat(document.getElementById('ori-p').value)||0;
  if(!oriNome||!oriPeso){alert('Preencha!');return;}
  var pOri=null,pDest=gP(prodId);
  for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].nome===oriNome){pOri=DB.produtos[i];break;}}
  if(pOri)pOri.est=+(pOri.est-oriPeso).toFixed(2);if(pDest)pDest.est=+(pDest.est+oriPeso).toFixed(2);
  DB.transf.unshift({id:nid(),data:hj(),de:oriNome,para:pDest.nome,pS:oriPeso,pE:oriPeso,obs:'Auto pesagem'});
  var ab=pesAbas[pesAtiva];var tabN='Padrao';
  if(ab.tabId){for(var i=0;i<DB.tabelas.length;i++){if(DB.tabelas[i].id==ab.tabId){tabN=DB.tabelas[i].nome;break;}}}
  ab.itens.push({prodId:prodId,ic:pDest.ic,nome:pDest.nome,peso:peso,preco:preco,tipo:ab.tipo,uni:false,tabN:tabN});
  closeM();savePesState();renderPesagem();
}

// Estado dos blocos
var _blocoSel={};
function selBlocoForma(prefix,tipo,tot){
  _blocoSel[prefix]=tipo;
  var ids=['din','pix','crt','misto'];
  for(var i=0;i<ids.length;i++){
    var b=document.getElementById(prefix+'sb-'+ids[i]);
    if(b){b.style.borderColor='var(--bd)';b.style.background='var(--bg)';}
  }
  var sel=document.getElementById(prefix+'sb-'+tipo);
  if(sel){sel.style.borderColor='var(--gr)';sel.style.background='rgba(34,197,94,.12)';}
  // ocultar tudo primeiro
  var bancoRow=document.getElementById(prefix+'banco-row');if(bancoRow)bancoRow.style.display='none';
  var simplesOk=document.getElementById(prefix+'simples-ok');if(simplesOk)simplesOk.style.display='none';
  var mistoArea=document.getElementById(prefix+'misto-area');if(mistoArea)mistoArea.style.display='none';
  if(tipo==='misto'){
    if(mistoArea){mistoArea.style.display='flex';}
    var mDin=document.getElementById(prefix+'m-din');if(mDin)mDin.value=tot;
    var mOut=document.getElementById(prefix+'m-out');if(mOut)mOut.value=0;
    calcBloco(prefix,tot);
  } else {
    if(tipo==='pix'||tipo==='crt'){if(bancoRow)bancoRow.style.display='flex';}
    var vlbl={din:'Dinheiro — Caixa',pix:'Pix',crt:'Cartao'};
    var lbl=document.getElementById(prefix+'simples-lbl');if(lbl)lbl.textContent=vlbl[tipo]||tipo;
    var val=document.getElementById(prefix+'simples-val');if(val)val.textContent=fR(tot);
    if(simplesOk)simplesOk.style.display='block';
  }
}
function calcBloco(prefix,tot){
  var d=parseFloat(document.getElementById(prefix+'m-din')?document.getElementById(prefix+'m-din').value:0)||0;
  var o=parseFloat(document.getElementById(prefix+'m-out')?document.getElementById(prefix+'m-out').value:0)||0;
  var pg=+(d+o).toFixed(2);var df=+(pg-tot).toFixed(2);
  var el=document.getElementById(prefix+'misto-st');if(!el)return;
  if(pg===0){el.innerHTML='';return;}
  if(Math.abs(df)<0.01)el.innerHTML='<div class="al alg" style="margin-top:4px">&#10003; Valor correto!</div>';
  else if(df<0)el.innerHTML='<div class="al alr" style="margin-top:4px">Falta '+fR(Math.abs(df))+'</div>';
  else el.innerHTML='<div class="al aly" style="margin-top:4px">Troco: '+fR(df)+'</div>';
}
function getBlocoMethods(prefix,total){
  if(total<=0)return[];
  var tipo=_blocoSel[prefix];if(!tipo)return[];
  var labels={din:'Dinheiro',pix:'Pix',crt:'Cartao'};
  if(tipo==='misto'){
    var res=[];
    var d=parseFloat(document.getElementById(prefix+'m-din')?document.getElementById(prefix+'m-din').value:0)||0;
    var o=parseFloat(document.getElementById(prefix+'m-out')?document.getElementById(prefix+'m-out').value:0)||0;
    if(d>0)res.push({id:'din',label:'Dinheiro',valor:d,conta:'Caixa'});
    if(o>0){
      var tEl=document.getElementById(prefix+'m-tipo');var t=tEl?tEl.value:'pix';
      var bEl=document.getElementById(prefix+'m-banco');var conta=bEl?bEl.value:'';
      res.push({id:t,label:labels[t]||t,valor:o,conta:conta});
    }
    return res;
  }
  var conta='Caixa';
  if(tipo==='pix'||tipo==='crt'){var el=document.getElementById(prefix+'banco-sel');conta=el?el.value:'';}
  return [{id:tipo,label:labels[tipo]||tipo,valor:total,conta:conta}];
}
function getPgMethods(){
  var ab=pesAbas[pesAtiva];var valReceb=0,valPagei=0;
  for(var i=0;i<ab.itens.length;i++){var it=ab.itens[i];var v=it.uni?it.preco:it.peso*it.preco;if(it.tipo==='Venda')valReceb+=v;else valPagei+=v;}
  valReceb=+valReceb.toFixed(2);valPagei=+valPagei.toFixed(2);
  var recMethods=getBlocoMethods('rec-',valReceb);
  var pagMethods=getBlocoMethods('pag-',valPagei);
  return {recMethods:recMethods,pagMethods:pagMethods,valReceb:valReceb,valPagei:valPagei};
}
function setSelectVal(sel,val){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===val){sel.selectedIndex=i;return;}}}
function gerarNum(){DB.atendNum=(DB.atendNum||1000)+1;return String(DB.atendNum).padStart(6,'0');}

  }
  // Saldo liquido

function confirmarFin(){
  var ab=pesAbas[pesAtiva];
  var pg=getPgMethods();
  var recMethods=pg.recMethods;var pagMethods=pg.pagMethods;
  var valReceb=pg.valReceb;var valPagei=pg.valPagei;
  // Validacao: bloco A Receber precisa estar preenchido se ha venda
  if(valReceb>0&&!recMethods.length){alert('Selecione a forma de recebimento (Venda)!');return;}
  // Validacao: bloco A Pagar precisa estar preenchido se ha compra
  if(valPagei>0&&!pagMethods.length){alert('Selecione a forma de pagamento (Compra)!');return;}
  // Validacao dos valores dos blocos
  if(recMethods.length){var somaRec=0;for(var i=0;i<recMethods.length;i++)somaRec=+(somaRec+recMethods[i].valor).toFixed(2);if(Math.abs(somaRec-valReceb)>0.01&&!confirm('Recebimento ('+fR(somaRec)+') difere da venda ('+fR(valReceb)+'). Confirmar?'))return;}
  if(pagMethods.length){var somaPag=0;for(var i=0;i<pagMethods.length;i++)somaPag=+(somaPag+pagMethods[i].valor).toFixed(2);if(Math.abs(somaPag-valPagei)>0.01&&!confirm('Pagamento ('+fR(somaPag)+') difere da compra ('+fR(valPagei)+'). Confirmar?'))return;}
  var obs=document.getElementById('fin-obs')?document.getElementById('fin-obs').value||'':'';
  var num=ab.numAtend||gerarNum();ab.numAtend=num;ab.obs=obs;
  var totLiq2=+(valReceb-valPagei).toFixed(2);
  var vendaTotal=valReceb;var compraTotal=valPagei;
  // Apply stock changes
  for(var i=0;i<ab.itens.length;i++){
    var it=ab.itens[i];
    if(it.uni){
      for(var j=0;j<DB.revenda.length;j++){
        if(DB.revenda[j].id===it.uid){
          DB.revenda[j].status='Vendido';
          var estPId=DB.revenda[j].estProdId;
          if(estPId){var ep=gP(estPId);if(ep)ep.est=+(ep.est-DB.revenda[j].peso).toFixed(2);}
          break;
        }
      }
    }else if(it.tipo==='Venda'){
      var p=gP(it.prodId);if(p)p.est=+(p.est-it.peso).toFixed(2);
    }else if(it.tipo==='Compra'){
      var p=gP(it.prodId);if(p)p.est=+(p.est+it.peso).toFixed(2);
    }else{
      var p=gP(it.prodId);if(p)p.est=+(p.est+it.peso).toFixed(2);
      DB.entradas.unshift({id:nid(),data:hj(),forn:obs||'Doacao',tipo:'Doacao',pId:it.prodId,peso:it.peso,vKg:0,total:0,status:'Triagem'});
    }
  }
  // Registrar movimentacoes financeiras separadas por bloco
  // Bloco Recebimento (Venda) — sempre entrada
  for(var i=0;i<recMethods.length;i++){
    var m=recMethods[i];
    DB.movs.unshift({id:nid(),data:hj(),desc:'Recebimento Venda #'+num+' ('+m.label+')',tipo:'entrada',cat:'Venda',valor:m.valor,conta:m.conta});
    for(var j=0;j<DB.contas.length;j++){if(DB.contas[j].nome===m.conta){DB.contas[j].saldo=+(DB.contas[j].saldo+m.valor).toFixed(2);break;}}
  }
  // Bloco Pagamento (Compra) — sempre saida
  for(var i=0;i<pagMethods.length;i++){
    var m=pagMethods[i];
    DB.movs.unshift({id:nid(),data:hj(),desc:'Pagamento Compra #'+num+' ('+m.label+')',tipo:'saida',cat:'Compra',valor:m.valor,conta:m.conta});
    for(var j=0;j<DB.contas.length;j++){if(DB.contas[j].nome===m.conta){DB.contas[j].saldo=+(DB.contas[j].saldo-m.valor).toFixed(2);break;}}
  }
  // Combinar todos os methods para snapshot do historico
  var allMethods=recMethods.concat(pagMethods);
  if(DB.caixaDia){if(!DB.caixaDia.movimentos)DB.caixaDia.movimentos=[];DB.caixaDia.movimentos.unshift({num:num,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),itens:ab.itens.length,total:totLiq2,venda:vendaTotal,compra:compraTotal,recMethods:recMethods,pagMethods:pagMethods,methods:allMethods,obs:obs,itensList:ab.itens.slice(),label:ab.label,tipo:ab.tipo,cliId:ab.cliId,tabId:ab.tabId});}
  atendHist.unshift({id:nid(),label:ab.label,tipo:ab.tipo,itens:ab.itens.slice(),num:num,total:totLiq2,recMethods:recMethods,pagMethods:pagMethods,methods:allMethods,obs:obs,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  closeM();pesAbas.splice(pesAtiva,1);
  if(!pesAbas.length){clearPesState();novaPesAba();}else{pesAtiva=Math.min(pesAtiva,pesAbas.length-1);savePesState();renderPesagem();}
}
function mHist(){
  var h='';
  if(!atendHist.length)h='<div style="text-align:center;padding:20px;color:var(--mt)">Nenhum atendimento finalizado.</div>';
  else for(var i=0;i<Math.min(atendHist.length,20);i++){
    var a=atendHist[i];
    h+='<div style="background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:11px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'
      +'<div><span style="font-weight:700">#'+a.num+'</span><span style="color:var(--mt);font-size:12px;margin-left:8px">'+a.hora+'</span></div>'
      +'<span style="font-size:14px;font-weight:700;color:var(--gr);font-family:monospace">'+fR(a.total)+'</span></div>'
      +'<div style="font-size:12px;color:var(--mt);margin-bottom:7px">'+a.itens.length+' item(s)'+(a.obs?' &middot; '+a.obs:'')+'</div>'
      +'<button class="bsm bsmg" onclick="reabrirA('+i+');closeM()">Reabrir para edicao</button></div>';
  }
  openM('Historico','<div>'+h+'<button class="btnO bOgr" style="width:100%;margin-top:6px" onclick="closeM()">Fechar</button></div>',480);
}
function reabrirA(i){
  var snap=atendHist[i];
  for(var j=0;j<snap.itens.length;j++){
    var it=snap.itens[j];
    if(it.uni){for(var k=0;k<DB.revenda.length;k++){if(DB.revenda[k].id===it.uid){DB.revenda[k].status='Disponivel';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);if(p)p.est=+(p.est+it.peso).toFixed(2);}
    else if(it.tipo==='Compra'){var p=gP(it.prodId);if(p)p.est=+(p.est-it.peso).toFixed(2);}
  }
  if(DB.caixaDia&&DB.caixaDia.movimentos){for(var j=0;j<DB.caixaDia.movimentos.length;j++){if(DB.caixaDia.movimentos[j].num===snap.num){DB.caixaDia.movimentos.splice(j,1);break;}}}
  // Reverse financial movements
  if(snap.methods){for(var j=0;j<DB.movs.length;j++){if(DB.movs[j].desc&&DB.movs[j].desc.indexOf('#'+snap.num)>=0){var rm=DB.movs.splice(j,1)[0];for(var k=0;k<DB.contas.length;k++){if(DB.contas[k].nome===rm.conta){DB.contas[k].saldo=rm.tipo==='entrada'?+(DB.contas[k].saldo-rm.valor).toFixed(2):+(DB.contas[k].saldo+rm.valor).toFixed(2);break;}}j--;}};}
  pesAbas.push({id:nid(),label:'Reab.#'+snap.num,tipo:snap.tipo,cliId:snap.cliId||'',tabId:snap.tabId||null,itens:snap.itens.slice(),obs:snap.obs||'',showUnit:false,numAtend:snap.num});
  pesAtiva=pesAbas.length-1;atendHist.splice(i,1);savePesState();renderPesagem();
}
function execReabrirDoCaixa(numAtend){
  if(!DB.caixaDia||!DB.caixaDia.movimentos)return;
  var snap=null,snapIdx=-1;
  for(var j=0;j<DB.caixaDia.movimentos.length;j++){
    if(String(DB.caixaDia.movimentos[j].num)===String(numAtend)){snap=DB.caixaDia.movimentos[j];snapIdx=j;break;}
  }
  if(!snap){openM('Erro','<p style="color:var(--rd)">Atendimento nao encontrado.</p>');return;}
  if(!snap.itensList||!snap.itensList.length){openM('Aviso','<p style="color:var(--or)">Este atendimento nao possui itens salvos para reabrir.</p>');return;}
  closeM();
  // Reverse stock
  for(var j=0;j<snap.itensList.length;j++){
    var it=snap.itensList[j];
    if(it.uni){for(var k=0;k<DB.revenda.length;k++){if(DB.revenda[k].id===it.uid){DB.revenda[k].status='Disponivel';break;}}}
    else if(it.tipo==='Venda'){var p=gP(it.prodId);if(p)p.est=+(p.est+it.peso).toFixed(2);}
    else if(it.tipo==='Compra'){var p=gP(it.prodId);if(p)p.est=+(p.est-it.peso).toFixed(2);}
  }
  // Reverse financial movements
  for(var j=DB.movs.length-1;j>=0;j--){
    if(DB.movs[j].desc&&DB.movs[j].desc.indexOf('#'+snap.num)>=0){
      var rm=DB.movs.splice(j,1)[0];
      for(var k=0;k<DB.contas.length;k++){
        if(DB.contas[k].nome===rm.conta){
          DB.contas[k].saldo=rm.tipo==='entrada'?+(DB.contas[k].saldo-rm.valor).toFixed(2):+(DB.contas[k].saldo+rm.valor).toFixed(2);break;
        }
      }
    }
  }
  // Remove from caixa movimentos
  DB.caixaDia.movimentos.splice(snapIdx,1);
  // Remove from atendHist if present
  for(var j=0;j<atendHist.length;j++){if(String(atendHist[j].num)===String(numAtend)){atendHist.splice(j,1);break;}}
  // Push aba e navegar
  pesAbas.push({id:nid(),label:'Reab.#'+snap.num,tipo:snap.tipo||'Venda',cliId:snap.cliId||'',tabId:snap.tabId||null,itens:snap.itensList.slice(),obs:snap.obs||'',showUnit:false,numAtend:snap.num});
  pesAtiva=pesAbas.length-1;savePesState();
  go('pesagem');
}

      if(String(DB.caixaDia.movimentos[j].num)===String(numAtend)){snap=DB.caixaDia.movimentos[j];break;}
    }

  var temItens=snap.itensList&&snap.itensList.length>0;
  var info='<div class="mf">'
    +'<div class="al alb">Atendimento <strong>#'+snap.num+'</strong> &mdash; '+snap.hora+'<br>'+(snap.itens||0)+' item(s)'+(snap.obs?' &mdash; '+snap.obs:'')+'</div>'
    +(temItens
      ?'<div style="font-size:13px;color:var(--mt)">O estoque e os movimentos financeiros serao revertidos. Voce podera corrigir e finalizar novamente.</div>'
      :'<div class="al alr">Atendimento sem dados de itens — nao e possivel reabrir.</div>')
    +'<div class="brow">'
    +'<button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +(temItens?'<button class="btn" style="flex:1" id="btn-reabrir-exec">&#128393; Reabrir para edicao</button>':'')
    +'</div></div>';
  openM('Reabrir Atendimento',info);
  setTimeout(function(){
    var b=document.getElementById('btn-reabrir-exec');

  },50);
}

var _precMudados={};
function marcouMudanca(id){
  _precMudados[id]=true;
  var btn=document.getElementById('btn-salvar-precos');
  if(btn){btn.textContent='&#10003; Salvar Todos';btn.style.background='var(--gr2)';}
  var st=document.getElementById('prec-status');
  if(st){st.style.display='block';st.style.color='var(--or)';st.textContent='Alteracoes nao salvas...';}
}
function salvarTodosPrecos(){
  var mudados=0;
  for(var i=0;i<DB.produtos.length;i++){
    var p=DB.produtos[i];
    var inpVV=document.getElementById('prc-vv-'+p.id);
    var inpVC=document.getElementById('prc-vc-'+p.id);
    if(!inpVV||!inpVC)continue;
    var novoVV=parseFloat(inpVV.value)||0;
    var novoVC=parseFloat(inpVC.value)||0;
    var antigoVV=p.vV;
    if(novoVV!==p.vV||novoVC!==p.vC){
      p.vV=novoVV;p.vC=novoVC;mudados++;
      // Atualiza tabela Padrao se venda mudou
      if(novoVV!==antigoVV){
        for(var j=0;j<DB.tabelas.length;j++){
          if(DB.tabelas[j].nome==='Padrao'&&DB.tabelas[j].tipo==='venda'){
            var tab=DB.tabelas[j];var found=false;
            for(var k=0;k<tab.itens.length;k++){if(tab.itens[k].pId===p.id){tab.itens[k].preco=novoVV;found=true;break;}}
            if(!found)tab.itens.push({pId:p.id,preco:novoVV});
            break;
          }
        }
      }
    }
  }
  _precMudados={};
  var st=document.getElementById('prec-status');
  var btn=document.getElementById('btn-salvar-precos');
  if(mudados>0){
    if(st){st.style.display='block';st.style.color='var(--gr)';st.textContent='&#10003; '+mudados+' produto(s) atualizados! Tabela Padrao sincronizada.';}
    if(btn){btn.textContent='&#10003; Salvo!';btn.style.background='var(--gr2)';}
  }else{
    if(st){st.style.display='block';st.style.color='var(--mt)';st.textContent='Nenhuma alteracao detectada.';}
  }
  setTimeout(function(){
    var s=document.getElementById('prec-status');if(s)s.style.display='none';
  },3000);
}

function saveTransf(){
  var de=document.getElementById('t-de').value;
  var ob=document.getElementById('t-ob').value;
  var box=document.getElementById('t-dests');if(!box){alert('Erro interno!');return;}
  // Coleta todos os destinos visiveis
  var rows=box.querySelectorAll('div[id^="td-row-"]');
  var destinos=[];var totalPE=0;
  for(var i=0;i<rows.length;i++){
    var rowId=rows[i].id.replace('td-row-','');
    var paSel=document.getElementById('td-pa-'+rowId);
    var pePeso=document.getElementById('td-pe-'+rowId);
    if(!paSel||!pePeso)continue;
    var pa=paSel.value,pe=parseFloat(pePeso.value)||0;
    if(pa&&pe>0){destinos.push({para:pa,pE:pe});totalPE+=pe;}
  }
  if(!de||destinos.length===0||totalPE===0){alert('Preencha ao menos um destino com peso!');return;}
  // Desconta da origem o total de todos os destinos
  var pDe=null;for(var i=0;i<DB.produtos.length;i++){if(DB.produtos[i].nome===de){pDe=DB.produtos[i];break;}}
  if(pDe)pDe.est=+(pDe.est-totalPE).toFixed(2);
  // Para cada destino, adiciona ao estoque e salva registro
  for(var i=0;i<destinos.length;i++){
    var d=destinos[i];
    var pPa=null;for(var j=0;j<DB.produtos.length;j++){if(DB.produtos[j].nome===d.para){pPa=DB.produtos[j];break;}}
    if(pPa)pPa.est=+(pPa.est+d.pE).toFixed(2);
    DB.transf.unshift({id:nid(),data:hj(),de:de,para:d.para,pS:+(totalPE/destinos.length).toFixed(2),pE:d.pE,obs:ob+(destinos.length>1?' ('+i+1+'/'+destinos.length+')':'')});
  }
  closeM();go('estoque');
}

function setCmpA(v){cmpTabA=v?parseFloat(v):null;go('tabelas');}
function setCmpB(v){cmpTabB=v?parseFloat(v):null;go('tabelas');}

function mEditCmpPreco(lado,prodId){
  var tabId=lado==='A'?cmpTabA:cmpTabB;
  var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){tab=DB.tabelas[i];break;}}
  if(!tab)return;
  var p=gP(prodId);if(!p)return;
  var precoAtual=null;var itemIdx=-1;
  for(var i=0;i<tab.itens.length;i++){if(tab.itens[i].pId===prodId){precoAtual=tab.itens[i].preco;itemIdx=i;break;}}
  var cor=getTabCor(tab);
  var isNovo=precoAtual===null;
  openM((isNovo?'Adicionar':'Editar')+' preço — '+tab.nome,
    '<div class="mf">'
    +'<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:'+cor.hex+';border-radius:var(--r);margin-bottom:4px">'
    +'<span style="font-size:22px">'+p.ic+'</span>'
    +'<div><div style="font-size:14px;font-weight:700;color:#fff">'+p.nome+'</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.6)">Tabela: '+tab.nome+' ('+(tab.tipo==='venda'?'Venda':'Compra')+')</div></div>'
    +'</div>'
    +'<div class="fld"><label>Preço R$/kg</label>'
    +'<input class="inp" type="number" inputmode="decimal" id="cmp-pr" value="'+(precoAtual||'')+'" placeholder="0,00" step="0.01" style="font-size:20px;text-align:center;font-family:monospace">'
    +'</div>'
    +'<div class="brow">'
    +(!isNovo?'<button class="btnO bOr" onclick="delCmpPreco(\''+lado+'\','+prodId+','+itemIdx+')">Remover da tabela</button>':'')
    +'<button class="btnO bOgr" onclick="closeM()">Cancelar</button>'
    +'<button class="btn" onclick="saveCmpPreco(\''+lado+'\','+prodId+','+itemIdx+')">Salvar</button>'
    +'</div></div>',400);
  setTimeout(function(){var el=document.getElementById('cmp-pr');if(el){el.focus();el.select();}},80);
}

function saveCmpPreco(lado,prodId,itemIdx){
  var tabId=lado==='A'?cmpTabA:cmpTabB;
  var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){tab=DB.tabelas[i];break;}}
  if(!tab)return;
  var novoPreco=parseFloat(document.getElementById('cmp-pr').value)||0;
  if(novoPreco<0){alert('Preço inválido!');return;}
  if(itemIdx>=0){
    tab.itens[itemIdx].preco=novoPreco;
  } else {
    tab.itens.push({pId:prodId,preco:novoPreco});
  }
  closeM();go('tabelas');
}

function delCmpPreco(lado,prodId,itemIdx){
  var tabId=lado==='A'?cmpTabA:cmpTabB;
  var tab=null;for(var i=0;i<DB.tabelas.length;i++){if(String(DB.tabelas[i].id)===String(tabId)){tab=DB.tabelas[i];break;}}
  if(!tab||itemIdx<0)return;
  if(!confirm('Remover este produto da tabela?'))return;
  tab.itens.splice(itemIdx,1);
  closeM();go('tabelas');
}

function swTabF(f){tabFiltro=f;go('tabelas');}

function pgTabs(){
  var all=sortTabelas(DB.tabelas);

  var header='<div class="fc"><div class="ptop"><div><div class="pl">Precos</div><div class="pt">Tabelas de Preco</div></div><button class="btn" onclick="mNovaTab()">+ Nova</button></div>'+tabsBar;
  if(tabFiltro==='comparacao'){return header+buildComparacao()+'</div>';}

  for(var i=0;i<filtered.length;i++){

    var tabPad=null;for(var k=0;k<DB.tabelas.length;k++){if(DB.tabelas[k].nome.toLowerCase()==='padrao'&&DB.tabelas[k].tipo===t.tipo){tabPad=DB.tabelas[k];break;}}

        +'<span style="font-size:12px;color:#fff">'+p.ic+' '+p.nome+'</span>'
        +'<div style="display:flex;align-items:center;gap:7px">'
        +(showRiscado?'<span style="font-size:11px;color:rgba(255,255,255,.5);text-decoration:line-through;font-family:monospace">'+fR(padPreco)+'</span>':'')
        +'<span style="font-size:13px;font-weight:700;color:'+(showRiscado?(df>=0?'#86efac':'#fca5a5'):'#fff')+';font-family:monospace">'+fR(it.preco)+'/kg</span>'
        +'</div></div>';
    }
    cards+='<div class="card" style="cursor:pointer;background:'+cor.hex+';border:none;border-left:4px solid rgba(255,255,255,.35);box-shadow:0 4px 18px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s" onclick="mVerTab('+tIdx+')" onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'0 8px 28px rgba(0,0,0,.6)\'" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'0 4px 18px rgba(0,0,0,.5)\'">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px">'
      +'<div><div style="display:flex;align-items:center;gap:6px">'
      +'<div style="font-size:14px;font-weight:700;color:#fff">'+t.nome+'</div>'
      +(isPadrao?'<span style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700">Padrão</span>':'')
      +'</div>'
      +'<div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:2px">'+(cls.length?'Usada por: '+cls.join(', '):'Sem clientes')+'</div>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px">'

      +'<button style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer" onclick="event.stopPropagation();mEditTab('+tIdx+')">✏️</button>'
      +'</div></div>'
      +itH

// ── Imprimir tabela ──
function printTab(idx){
  var t=DB.tabelas[idx];
  var cor=getTabCor(t);
  var isPadrao=t.nome.toLowerCase()==='padrao';
  var tabPad=null;for(var k=0;k<DB.tabelas.length;k++){if(DB.tabelas[k].nome.toLowerCase()==='padrao'&&DB.tabelas[k].tipo===t.tipo){tabPad=DB.tabelas[k];break;}}
  var rows='';
  for(var j=0;j<t.itens.length;j++){
    var it=t.itens[j];var p=gP(it.pId);if(!p)continue;
    var padPreco=null;
    if(tabPad&&!isPadrao){for(var k=0;k<tabPad.itens.length;k++){if(tabPad.itens[k].pId===p.id){padPreco=tabPad.itens[k].preco;break;}}}
    var showRiscado=padPreco!==null&&padPreco!==it.preco;
    var df=padPreco!==null?it.preco-padPreco:0;
    rows+='<tr>'
      +'<td>'+p.ic+' '+p.nome+'</td>'
      +'<td style="text-align:right;text-decoration:line-through;color:#999">'+(showRiscado?fR(padPreco)+'/kg':'—')+'</td>'
      +'<td style="text-align:right;font-weight:700;color:'+(showRiscado?(df>=0?'#16a34a':'#dc2626'):'#222')+'">'+fR(it.preco)+'/kg</td>'
      +'</tr>';
  }
  var badge=t.tipo==='venda'
    ?'<span class="pr-badge pr-badge-venda">Venda</span>'
    :'<span class="pr-badge pr-badge-compra">Compra</span>';
  var now=new Date().toLocaleString('pt-BR');
  var pa=document.getElementById('print-area');
  if(!pa){pa=document.createElement('div');pa.id='print-area';document.body.appendChild(pa);}
  pa.innerHTML=
    '<div class="pr-logo">'
    +'<div class="pr-logo-icon">&#9850;</div>'
    +'<div><div class="pr-logo-text">BioVale</div><div class="pr-logo-sub">Gestao de Residuos</div></div>'
    +'</div>'
    +'<div class="pr-title">'+t.nome+' '+badge+'</div>'
    +'<div class="pr-meta">Gerado em '+now+' &nbsp;|&nbsp; '+t.itens.length+' produto(s)</div>'
    +'<table>'
    +'<thead><tr><th>Produto</th><th style="text-align:right">Preco Padrao</th><th style="text-align:right">Preco Tabela</th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'</table>'
    +'<div class="pr-footer">BioVale &mdash; Tabela de Precos &mdash; '+now+'</div>';
  window.print();
}

function updTabItem(tIdx,iIdx,val){
  DB.tabelas[tIdx].itens[iIdx].preco=parseFloat(val)||0;
  go('tabelas');
}

function delTabItem(tIdx,iIdx){
  DB.tabelas[tIdx].itens.splice(iIdx,1);
  mVerTab(tIdx);
  go('tabelas');
}

function addTabItemExist(tIdx){
  var pId=parseInt(document.getElementById('vt-p').value);
  var pr=parseFloat(document.getElementById('vt-pr').value)||0;
  var t=DB.tabelas[tIdx];
  for(var i=0;i<t.itens.length;i++){if(t.itens[i].pId===pId){alert('Produto ja esta na tabela!');return;}}
  t.itens.push({pId:pId,preco:pr});
  mVerTab(tIdx);
  go('tabelas');
}

function saveEditTab(idx){
  var n=document.getElementById('et-n').value.trim();
  if(!n){alert('Informe o nome!');return;}
  DB.tabelas[idx].nome=n;
  var novoTipo=document.getElementById('et-t').value;
  DB.tabelas[idx].tipo=novoTipo;
  DB.tabelas[idx].cor=document.getElementById('et-cor').value;
  // Se o tipo mudou, verificar pesagem ativa
  if(pesAbas.length){
    var ab=pesAbas[pesAtiva];
    if(ab.tabId==DB.tabelas[idx].id){
      var abTipoTab=ab.tipo==='Compra'?'compra':'venda';
      if(novoTipo!==abTipoTab)ab.tabId=null;
    }
  }
  closeM();go('tabelas');
}

function delTab(idx){
  if(!confirm('Excluir tabela "'+DB.tabelas[idx].nome+'"? Esta acao nao pode ser desfeita.'))return;
  DB.tabelas.splice(idx,1);
  closeM();go('tabelas');
}

// ── Criar nova tabela ──
function mNovaTab(){
  tabItens=[];
  var opts='';for(var i=0;i<DB.produtos.length;i++)opts+='<option value="'+DB.produtos[i].id+'">'+DB.produtos[i].ic+' '+DB.produtos[i].nome+'</option>';
  openM('Nova Tabela de Precos',
    '<div class="mf">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'
    +'<div class="fld"><label>Nome</label><input class="inp" id="nt-n" placeholder="Ex: Tabela VIP"></div>'
    +'<div class="fld"><label>Tipo</label><select class="inp" id="nt-t"><option value="venda">Venda</option><option value="compra">Compra</option></select></div>'
    +'</div>'
    +buildCorPicker('padrao','nt-cor')
    +'<div style="background:var(--s2);border-radius:var(--r);padding:11px">'
    +'<div style="font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px">Produtos</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-bottom:7px">'
    +'<select class="inp" id="nt-p">'+opts+'</select>'
    +'<input class="inp" type="number" inputmode="decimal" id="nt-pr" placeholder="R$/kg">'
    +'<button class="btn" onclick="addTI()">+</button>'
    +'</div>'
    +'<div id="nt-items"></div>'
    +'</div>'
    +'<div class="brow"><button class="btnO bOgr" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveTab()">Criar</button></div>'
    +'</div>',520);
}

function addTI(){
  var pId=parseInt(document.getElementById('nt-p').value);
  var pr=parseFloat(document.getElementById('nt-pr').value)||0;
  for(var k=0;k<tabItens.length;k++){if(tabItens[k]&&tabItens[k].pId===pId){alert('Produto ja adicionado!');return;}}
  var idx=tabItens.length;
  tabItens.push({pId:pId,preco:pr});
  var p=gP(pId);
  var row='<div id="ti-row-'+idx+'" style="display:grid;grid-template-columns:1fr 130px 36px;gap:6px;align-items:center;background:var(--grb);border-radius:6px;padding:4px 7px;margin-bottom:4px">'
    +'<span style="font-size:12px">'+p.ic+' '+p.nome+'</span>'
    +'<input class="inp" type="number" inputmode="decimal" value="'+pr+'" style="text-align:right;font-family:monospace;padding:5px 8px" onchange="tabItens['+idx+'].preco=parseFloat(this.value)||0">'
    +'<button onclick="removeTI('+idx+')" style="background:var(--rdb);border:1px solid rgba(239,68,68,.3);color:var(--rd);border-radius:6px;padding:5px 7px;font-size:14px;cursor:pointer;min-height:32px">✕</button>'
    +'</div>';
  document.getElementById('nt-items').insertAdjacentHTML('beforeend',row);
  document.getElementById('nt-pr').value='';
}

function removeTI(idx){
  tabItens[idx]=null;
  var row=document.getElementById('ti-row-'+idx);
  if(row)row.remove();
}

function saveTab(){
  var n=document.getElementById('nt-n').value.trim();
  if(!n){alert('Informe o nome!');return;}
  var valid=tabItens.filter(function(x){return x!==null;});
  var tipo=document.getElementById('nt-t').value;
  var newTab={id:nid(),nome:n,tipo:tipo,cor:document.getElementById('nt-cor').value,itens:valid};
  DB.tabelas.push(newTab);
  // Auto-selecionar na aba de pesagem ativa se o tipo bater
  if(pesAbas.length&&pgAtiva==='pesagem'){
    var ab=pesAbas[pesAtiva];
    var abTipoTab=ab.tipo==='Compra'?'compra':'venda';
    if(tipo===abTipoTab){ab.tabId=newTab.id;}
  }
  closeM();go('tabelas');
}

function pgUsers(){
  var h='';for(var i=0;i<USERS.length;i++){var u=USERS[i];h+='<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:11px;align-items:center"><div style="width:38px;height:38px;border-radius:50%;background:hsl('+(i*80+140)+',50%,20%);border:2px solid hsl('+(i*80+140)+',60%,35%);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:hsl('+(i*80+140)+',70%,65%)">'+u.av+'</div><div><div style="font-size:13px;font-weight:700">'+u.nome+'</div><div style="font-size:11px;color:var(--mt)">'+PNOME[u.perfil]+'</div></div></div><div style="display:flex;gap:7px"><span class="tag '+(u.perfil==='adm'?'to':u.perfil==='caixa'?'tb':u.perfil==='motorista'?'tp':'tgr')+'">'+PNOME[u.perfil]+'</span><span class="tag tg">Ativo</span></div></div>';}
  var pH='';var perms=[{n:'Administrador',d:'Acesso total: financeiro, estoque, funcionarios, usuarios.',c:'to'},{n:'Caixa',d:'Pesagem: Compra, Venda, Doacao. Consulta de estoque.',c:'tb'},{n:'Operador',d:'Pesagem, estoque, revenda, agenda, funcionarios, clientes. Sem financeiro.',c:'tgr'},{n:'Motorista',d:'Acesso exclusivo a agenda de coletas.',c:'tp'}];
  for(var i=0;i<perms.length;i++){pH+='<div style="background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:13px"><span class="tag '+perms[i].c+'" style="display:inline-block;margin-bottom:7px">'+perms[i].n+'</span><div style="font-size:12px;color:var(--mt);line-height:1.5">'+perms[i].d+'</div></div>';}
  return '<div class="fc"><div><div class="pl">Sistema</div><div class="pt">Usuarios</div></div><div class="fc">'+h+'</div><div class="card"><div class="stl"><div class="stb"></div><div class="stx">Permissoes</div></div><div class="g2">'+pH+'</div></div></div>';
}
